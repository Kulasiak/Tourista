<!doctype html>
<html lang="it" dir="ltr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gestionale completo per agenzia viaggi specializzata in gruppi: partenze, quote, prenotazioni, rooming list, posti bus, fornitori, scadenzario, contabilita e documenti di viaggio.">
<meta name="theme-color" content="#0E6E7A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Urania">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>Urania — gestione viaggi di gruppo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- I caratteri arrivano per conto loro: se la linea manca il gestionale parte lo stesso,
     con i caratteri di sistema, invece di restare fermo ad aspettarli. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* ============================================================
   TOURISTA — gestionale per agenzia viaggi, viaggi di gruppo
   Un solo file, nessuna dipendenza, funziona anche senza linea.
   ============================================================ */

/* ---------- 1. COLORI ---------- */
:root{
  color-scheme: light;
  --brand:#0E6E7A; --brand-2:#0A525C; --brand-soft:rgba(14,110,122,.12);
  --accent:#C2600F; --accent-soft:rgba(194,96,15,.13);
  --bg:#F7F5F1; --bg-2:#FFFFFF; --bg-3:#EFEBE4;
  --bg-side:rgba(247,245,241,.90); --bar:rgba(255,255,255,.86);
  --fill-1:rgba(60,58,52,.06); --fill-2:rgba(60,58,52,.12); --fill-3:rgba(60,58,52,.03);
  --sep:rgba(60,58,52,.15); --sep-2:rgba(60,58,52,.28);
  --txt:#17201F; --txt-2:rgba(23,32,31,.64); --txt-3:rgba(23,32,31,.40);
  --on-brand:#FFFFFF;
  --green:#1E7A55; --green-soft:rgba(30,122,85,.13);
  --red:#BE3A2B;   --red-soft:rgba(190,58,43,.12);
  --amber:#B37309; --amber-soft:rgba(179,115,9,.14);
  --blue:#1668A8;  --blue-soft:rgba(22,104,168,.12);
  --violet:#6B4E9E;--violet-soft:rgba(107,78,158,.13);
  --grey:#83807A;  --grey-soft:rgba(131,128,122,.14);
  --sh-1:0 1px 2px rgba(40,45,40,.06), 0 1px 1px rgba(40,45,40,.04);
  --sh-2:0 6px 20px -8px rgba(30,40,38,.18), 0 1px 3px rgba(30,40,38,.07);
  --sh-3:0 28px 70px -22px rgba(20,30,28,.34), 0 3px 10px rgba(20,30,28,.10);
  --r-l:18px; --r-m:13px; --r-s:9px; --r-pill:980px;
  --ease:cubic-bezier(.32,.72,0,1);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono",monospace;
  --side:262px;
}
:root[data-skin="notte"]{
  color-scheme: dark;
  --brand:#3FB0BE; --brand-2:#2C8B97; --brand-soft:rgba(63,176,190,.16);
  --accent:#E39A45; --accent-soft:rgba(227,154,69,.16);
  --bg:#12181A; --bg-2:#192124; --bg-3:#1F282B;
  --bg-side:rgba(18,24,26,.92); --bar:rgba(25,33,36,.86);
  --fill-1:rgba(255,255,255,.06); --fill-2:rgba(255,255,255,.12); --fill-3:rgba(255,255,255,.03);
  --sep:rgba(255,255,255,.13); --sep-2:rgba(255,255,255,.24);
  --txt:#ECF1F0; --txt-2:rgba(236,241,240,.66); --txt-3:rgba(236,241,240,.40);
  --on-brand:#08191C;
  --green:#4FBE8B; --green-soft:rgba(79,190,139,.16);
  --red:#E4675A;   --red-soft:rgba(228,103,90,.16);
  --amber:#DFA430; --amber-soft:rgba(223,164,48,.16);
  --blue:#5AA3DE;  --blue-soft:rgba(90,163,222,.16);
  --violet:#A48BD8;--violet-soft:rgba(164,139,216,.16);
  --grey:#9AA09E;  --grey-soft:rgba(154,160,158,.16);
  --sh-1:0 1px 2px rgba(0,0,0,.36); --sh-2:0 8px 24px -10px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.4);
  --sh-3:0 30px 80px -24px rgba(0,0,0,.75), 0 4px 12px rgba(0,0,0,.5);
}
:root[data-skin="deserto"]{
  --brand:#A8601C; --brand-2:#83480F; --brand-soft:rgba(168,96,28,.13);
  --accent:#2A7A6F; --accent-soft:rgba(42,122,111,.13);
  --bg:#FAF6EE; --bg-2:#FFFFFF; --bg-3:#F2EADA;
  --bg-side:rgba(250,246,238,.90);
}
:root[data-skin="mare"]{
  --brand:#15588F; --brand-2:#0E4270; --brand-soft:rgba(21,88,143,.12);
  --accent:#C2600F; --accent-soft:rgba(194,96,15,.13);
  --bg:#F4F7FA; --bg-3:#E7EEF4; --bg-side:rgba(244,247,250,.90);
}

/* ---------- 2. BASE ---------- */
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--txt); font-family:var(--sans);
  font-size:14.5px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{ margin:0; font-weight:700; letter-spacing:-.015em; }
h1{ font-size:23px; } h2{ font-size:18px; } h3{ font-size:15.5px; } h4{ font-size:13.5px; }
p{ margin:0 0 8px; }
a{ color:var(--brand); text-decoration:none; }
button,input,select,textarea{ font:inherit; color:inherit; }
table{ border-collapse:collapse; width:100%; }
/* Le icone hanno sempre una misura: senza questa riga riempirebbero tutto il riquadro. */
svg{ width:17px; height:17px; flex:0 0 auto; }
.card-h > svg{ color:var(--brand); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--fill-2); border-radius:99px; border:3px solid transparent; background-clip:content-box; }
::selection{ background:var(--brand-soft); }

/* ---------- 3. IMPALCATURA ---------- */
#app{ display:flex; min-height:100vh; min-height:100dvh; }
#side{
  width:var(--side); flex:0 0 var(--side); position:sticky; top:0; height:100vh; height:100dvh;
  background:var(--bg-side); backdrop-filter:saturate(180%) blur(20px);
  border-right:1px solid var(--sep); display:flex; flex-direction:column; z-index:40;
}
.brand{ display:flex; align-items:center; gap:11px; padding:16px 16px 12px; }
.brand .logo{
  width:38px; height:38px; border-radius:11px; display:grid; place-items:center; flex:0 0 38px;
  background:linear-gradient(150deg,var(--brand),var(--brand-2)); color:var(--on-brand); box-shadow:var(--sh-1);
}
.brand .logo svg{ width:21px; height:21px; }
.brand b{ font-family:var(--serif); font-size:19px; letter-spacing:-.02em; display:block; line-height:1.1; }
.brand small{ color:var(--txt-3); font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; }
#nav{ flex:1; overflow-y:auto; padding:4px 10px 14px; }
.nav-sec{ font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--txt-3); padding:14px 8px 6px; }
.nav-i{
  display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:10px;
  border:0; background:transparent; cursor:pointer; text-align:left; color:var(--txt-2);
  font-size:14px; font-weight:500; transition:background .14s, color .14s;
}
.nav-i:hover{ background:var(--fill-1); color:var(--txt); }
.nav-i.on{ background:var(--brand-soft); color:var(--brand); font-weight:650; }
.nav-i svg{ width:17px; height:17px; flex:0 0 17px; opacity:.9; }
.nav-i .badge{
  margin-left:auto; background:var(--fill-2); color:var(--txt-2); font-size:11px; font-weight:700;
  padding:1px 7px; border-radius:99px; min-width:20px; text-align:center;
}
.nav-i.on .badge{ background:var(--brand); color:var(--on-brand); }
.nav-i .badge.hot{ background:var(--red); color:#fff; }
#side-foot{ padding:9px 12px 13px; border-top:1px solid var(--sep); }
#side-foot .lingue{ display:flex; gap:2px; justify-content:space-between; margin-bottom:7px; }
#side-foot .lingue button{ font-size:16px; line-height:1; padding:4px 6px; border-radius:8px; border:0; background:transparent; cursor:pointer; }
#side-foot .lingue button.on{ background:var(--brand-soft); }
#side-foot .fondo{ display:flex; gap:6px; align-items:center; }

#main{ flex:1; min-width:0; display:flex; flex-direction:column; overflow-x:clip; }
#top{
  position:sticky; top:0; z-index:30; background:var(--bar); backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--sep); padding:10px 20px; display:flex; align-items:center; gap:12px;
  padding-top:max(10px,env(safe-area-inset-top));
}
#top .t-title{ min-width:0; }
#top .t-title{ flex:1 1 auto; min-width:0; }
#top .t-title b{ font-size:17px; font-weight:700; display:block; line-height:1.2; letter-spacing:-.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#top .t-title span{ font-size:12.5px; color:var(--txt-3); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#top .sp{ flex:1; }
#view{ padding:20px; padding-bottom:80px; max-width:1500px; width:100%; }
#burger{ display:none; }
@media(max-width:1000px){
  #side{ position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .26s var(--ease); box-shadow:var(--sh-3); }
  body.side-open #side{ transform:none; }
  body.side-open #scrim{ opacity:1; pointer-events:auto; }
  #burger{ display:inline-flex; }
  #view{ padding:14px; }
}
#scrim{
  position:fixed; inset:0; background:rgba(10,15,14,.42); opacity:0; pointer-events:none;
  transition:opacity .26s; z-index:39;
}

/* ---------- 4. PEZZI ---------- */
.card{ background:var(--bg-2); border:1px solid var(--sep); border-radius:var(--r-l); box-shadow:var(--sh-1); }
.card.pad{ padding:16px; }
.card h3{ margin-bottom:2px; }
.card-h{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--sep); }
.card-h h3{ font-size:15px; }
.card-h .sp{ flex:1; }
.card-b{ padding:14px 16px; }
.grid{ display:grid; gap:14px; }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.g3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.g4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.g-auto{ grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); }
.g-wide{ grid-template-columns:repeat(auto-fill,minmax(292px,1fr)); }
@media(max-width:1100px){ .g4{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:820px){
  /* sul telefono tutto va in colonna, anche le griglie scritte a mano nelle schermate */
  .grid{ grid-template-columns:minmax(0,1fr) !important; }
  .g4.keep2{ grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
  .card-h{ flex-wrap:wrap; }
  .kpi .k-v{ font-size:21px; }
}
.row{ display:flex; align-items:center; gap:10px; }
.row.wrap{ flex-wrap:wrap; }
.sp{ flex:1; }
.stack{ display:flex; flex-direction:column; gap:12px; }
.muted{ color:var(--txt-2); }
.dim{ color:var(--txt-3); }
.small{ font-size:12.5px; }
.tiny{ font-size:11.5px; }
.mono{ font-family:var(--mono); font-size:12.5px; }
.serif{ font-family:var(--serif); }
.right{ text-align:right; } .center{ text-align:center; }
.nowrap{ white-space:nowrap; }
.trunc{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mt{ margin-top:14px; } .mb{ margin-bottom:14px; }
.hide{ display:none !important; }

/* bottoni */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:8px 13px;
  border-radius:var(--r-s); border:1px solid var(--sep); background:var(--bg-2); color:var(--txt);
  font-size:13.5px; font-weight:600; cursor:pointer; box-shadow:var(--sh-1);
  transition:transform .1s var(--ease), background .14s, border-color .14s; white-space:nowrap;
}
.btn:hover{ background:var(--fill-3); border-color:var(--sep-2); }
.btn:active{ transform:scale(.97); }
.btn svg{ width:15px; height:15px; }
.btn.pri{ background:var(--brand); border-color:transparent; color:var(--on-brand); }
.btn.pri:hover{ background:var(--brand-2); }
.btn.acc{ background:var(--accent); border-color:transparent; color:#fff; }
.btn.ghost{ background:transparent; box-shadow:none; border-color:transparent; color:var(--txt-2); }
.btn.ghost:hover{ background:var(--fill-1); color:var(--txt); }
.btn.dang{ color:var(--red); border-color:var(--red-soft); }
.btn.dang:hover{ background:var(--red-soft); }
.btn.sm{ padding:5px 10px; font-size:12.5px; border-radius:8px; }
.btn.sm svg{ width:13px; height:13px; }
.btn.ico{ padding:7px; }
.btn.wide{ width:100%; }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.btn-group{ display:inline-flex; background:var(--fill-1); border-radius:var(--r-s); padding:2px; gap:2px; max-width:100%; overflow-x:auto; }
.btn-group::-webkit-scrollbar{ height:0; }
.btn-group button{
  border:0; background:transparent; padding:6px 12px; border-radius:7px; cursor:pointer;
  font-size:13px; font-weight:600; color:var(--txt-2);
}
.btn-group button.on{ background:var(--bg-2); color:var(--txt); box-shadow:var(--sh-1); }

/* campi */
.f{ display:flex; flex-direction:column; gap:5px; }
.f > label{ font-size:12px; font-weight:650; color:var(--txt-2); letter-spacing:.01em; }
.f .hint{ font-size:11.5px; color:var(--txt-3); }
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=email],input[type=search],select,textarea{
  width:100%; padding:8px 11px; border-radius:var(--r-s); border:1px solid var(--sep);
  background:var(--bg-2); color:var(--txt); font-size:14px; outline:0; transition:border-color .14s, box-shadow .14s;
}
input:focus,select:focus,textarea:focus{ border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
textarea{ resize:vertical; min-height:74px; line-height:1.45; }
select{ appearance:none; background-image:linear-gradient(45deg,transparent 49%,var(--txt-3) 50%),linear-gradient(-45deg,transparent 49%,var(--txt-3) 50%);
  background-position:calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size:5px 5px; background-repeat:no-repeat; padding-right:30px; }
input[type=checkbox],input[type=radio]{ width:17px; height:17px; accent-color:var(--brand); }
.check{ display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13.5px; }
.search{ position:relative; }
.search svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--txt-3); }
.search input{ padding-left:32px; }

/* chip e stati */
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:99px;
  font-size:11.5px; font-weight:700; background:var(--fill-1); color:var(--txt-2); white-space:nowrap;
}
.chip.g{ background:var(--green-soft); color:var(--green); }
.chip.r{ background:var(--red-soft); color:var(--red); }
.chip.a{ background:var(--amber-soft); color:var(--amber); }
.chip.b{ background:var(--blue-soft); color:var(--blue); }
.chip.v{ background:var(--violet-soft); color:var(--violet); }
.chip.n{ background:var(--grey-soft); color:var(--grey); }
.chip.br{ background:var(--brand-soft); color:var(--brand); }
.chip.big{ font-size:12.5px; padding:4px 11px; }
.dot{ width:8px; height:8px; border-radius:99px; background:var(--grey); flex:0 0 8px; }

/* tabelle */
.tbl{ width:100%; }
.tbl th{
  text-align:left; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--txt-3); padding:8px 10px; border-bottom:1px solid var(--sep); white-space:nowrap;
}
.tbl td{ padding:9px 10px; border-bottom:1px solid var(--sep); vertical-align:middle; }
.tbl tr:last-child td{ border-bottom:0; }
.tbl tbody tr:hover{ background:var(--fill-3); }
.tbl tr.clickable{ cursor:pointer; }
.tbl .num{ text-align:right; font-variant-numeric:tabular-nums; }
.scroll-x{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.scroll-x .tbl{ min-width:660px; }

/* kpi */
.kpi{ background:var(--bg-2); border:1px solid var(--sep); border-radius:var(--r-m); padding:13px 14px; box-shadow:var(--sh-1); }
.kpi .k-l{ font-size:11.5px; font-weight:650; color:var(--txt-3); text-transform:uppercase; letter-spacing:.05em; }
.kpi .k-v{ font-size:25px; font-weight:750; letter-spacing:-.02em; margin-top:3px; font-variant-numeric:tabular-nums; }
.kpi .k-s{ font-size:12px; color:var(--txt-2); margin-top:1px; }
.kpi.br{ border-color:var(--brand-soft); background:linear-gradient(180deg,var(--brand-soft),transparent); }

/* barra occupazione */
.bar{ height:7px; border-radius:99px; background:var(--fill-2); overflow:hidden; }
.bar > i{ display:block; height:100%; background:var(--brand); border-radius:99px; transition:width .4s var(--ease); }
.bar > i.g{ background:var(--green); } .bar > i.a{ background:var(--amber); } .bar > i.r{ background:var(--red); }

/* vuoto */
.empty{ text-align:center; padding:34px 16px; color:var(--txt-3); }
.empty svg{ width:34px; height:34px; opacity:.4; margin-bottom:8px; }

/* tab */
.tabs{ display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--sep); margin-bottom:16px; }
.tabs button{
  border:0; background:transparent; padding:9px 13px; cursor:pointer; font-size:13.5px; font-weight:600;
  color:var(--txt-2); border-bottom:2px solid transparent; white-space:nowrap; margin-bottom:-1px;
}
.tabs button:hover{ color:var(--txt); }
.tabs button.on{ color:var(--brand); border-bottom-color:var(--brand); }

/* modale */
#modal{ position:fixed; inset:0; z-index:60; display:none; }
#modal.on{ display:block; }
#modal .back{ position:absolute; inset:0; background:rgba(10,15,14,.45); backdrop-filter:blur(2px); animation:fade .18s; }
#modal .box{
  position:relative; margin:auto; margin-top:5vh; max-width:640px; width:min(94vw,640px); max-height:88vh;
  background:var(--bg-2); border-radius:var(--r-l); box-shadow:var(--sh-3); display:flex; flex-direction:column;
  animation:pop .22s var(--ease); overflow:hidden;
}
#modal .box.wide{ max-width:900px; width:min(96vw,900px); }
#modal .box.slim{ max-width:440px; }
#modal .m-h{ padding:15px 18px; border-bottom:1px solid var(--sep); display:flex; align-items:center; gap:10px; }
#modal .m-b{ padding:16px 18px; overflow-y:auto; }
#modal .m-f{ padding:12px 18px; border-top:1px solid var(--sep); display:flex; gap:9px; justify-content:flex-end; background:var(--bg-2); }
@keyframes fade{ from{ opacity:0; } }
@keyframes pop{ from{ opacity:0; transform:translateY(14px) scale(.98); } }
@media(max-width:640px){
  #modal .box{ margin-top:auto; margin-bottom:0; width:100vw; max-width:100vw; border-radius:18px 18px 0 0; max-height:94vh; }
}

/* toast */
#toasts{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
.toast{
  background:var(--txt); color:var(--bg); padding:10px 16px; border-radius:99px; font-size:13.5px;
  font-weight:600; box-shadow:var(--sh-3); animation:up .22s var(--ease); max-width:92vw;
}
.toast.err{ background:var(--red); color:#fff; }
.toast.ok{ background:var(--green); color:#fff; }
@keyframes up{ from{ opacity:0; transform:translateY(12px); } }
</style>
<style>
/* ---------- 5. PEZZI DEL MESTIERE ---------- */

/* scheda partenza */
.dep{ background:var(--bg-2); border:1px solid var(--sep); border-radius:var(--r-l); box-shadow:var(--sh-1); overflow:hidden; cursor:pointer; transition:transform .12s var(--ease), box-shadow .18s; display:flex; flex-direction:column; }
.dep:hover{ transform:translateY(-2px); box-shadow:var(--sh-2); }
.dep .d-top{ padding:13px 15px 11px; display:flex; gap:10px; align-items:flex-start; }
.dep .d-flag{ font-size:26px; line-height:1; }
.dep .d-name{ font-weight:700; font-size:15.5px; letter-spacing:-.01em; }
.dep .d-when{ font-size:12.5px; color:var(--txt-2); margin-top:1px; }
.dep .d-body{ padding:0 15px 13px; }
.dep .d-foot{ margin-top:auto; padding:10px 15px; border-top:1px solid var(--sep); background:var(--fill-3); display:flex; align-items:center; gap:8px; font-size:12.5px; }
.seats{ display:flex; align-items:baseline; gap:6px; font-variant-numeric:tabular-nums; }
.seats b{ font-size:19px; font-weight:750; letter-spacing:-.02em; }

/* stato con puntino */
.st{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:650; }
.st .dot{ width:7px; height:7px; }

/* timeline programma */
.tl{ position:relative; padding-left:30px; }
.tl:before{ content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:var(--sep); }
.tl-i{ position:relative; padding:0 0 16px; }
.tl-i:before{
  content:""; position:absolute; left:-25px; top:5px; width:12px; height:12px; border-radius:99px;
  background:var(--bg-2); border:2.5px solid var(--brand);
}
.tl-i .tl-d{ font-size:11.5px; font-weight:700; color:var(--brand); text-transform:uppercase; letter-spacing:.05em; }
.tl-i .tl-t{ font-weight:650; font-size:14.5px; }
.tl-i .tl-x{ font-size:13px; color:var(--txt-2); margin-top:2px; white-space:pre-wrap; }

/* rooming */
.room{ border:1px solid var(--sep); border-radius:var(--r-m); padding:10px 12px; background:var(--bg-2); }
.room.full{ border-color:var(--green-soft); background:linear-gradient(180deg,var(--green-soft),transparent 60%); }
.room.over{ border-color:var(--red); }
.room .r-h{ display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.room .r-h b{ font-size:13.5px; }
.pax-chip{
  display:flex; align-items:center; gap:6px; padding:5px 8px; border-radius:8px; background:var(--fill-1);
  font-size:13px; margin-bottom:4px;
}
.pax-chip .x{ margin-left:auto; cursor:pointer; color:var(--txt-3); border:0; background:0; padding:2px; }
.pax-chip .x:hover{ color:var(--red); }

/* bus */
.bus{ display:inline-block; border:2px solid var(--sep-2); border-radius:20px 20px 12px 12px; padding:14px 12px 12px; background:var(--bg-2); }
.bus .b-front{ text-align:center; font-size:11px; color:var(--txt-3); font-weight:700; letter-spacing:.1em; margin-bottom:10px; text-transform:uppercase; }
.bus-row{ display:flex; gap:6px; align-items:center; margin-bottom:6px; }
.bus-row .aisle{ width:22px; text-align:center; font-size:10px; color:var(--txt-3); font-variant-numeric:tabular-nums; }
.seat{
  width:44px; height:40px; border-radius:8px; border:1px solid var(--sep); background:var(--bg-3); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:2px;
  font-size:9.5px; line-height:1.05; color:var(--txt-2); overflow:hidden; transition:background .14s, border-color .14s;
}
.seat b{ font-size:10.5px; font-weight:700; color:var(--txt); }
.seat.free:hover{ border-color:var(--brand); background:var(--brand-soft); }
.seat.taken{ background:var(--brand-soft); border-color:var(--brand); color:var(--brand); }
.seat.taken b{ color:var(--brand); }
.seat.sel{ outline:2.5px solid var(--accent); outline-offset:1px; }
.seat.block{ background:var(--fill-2); color:var(--txt-3); cursor:default; }

/* liste con avatar */
.av{
  width:32px; height:32px; border-radius:99px; flex:0 0 32px; display:grid; place-items:center;
  background:var(--brand-soft); color:var(--brand); font-size:12px; font-weight:750; letter-spacing:-.02em;
}
.av.sm{ width:26px; height:26px; flex-basis:26px; font-size:10.5px; }
.av.lg{ width:44px; height:44px; flex-basis:44px; font-size:15px; }
.av.a{ background:var(--accent-soft); color:var(--accent); }
.av.v{ background:var(--violet-soft); color:var(--violet); }
.av.b{ background:var(--blue-soft); color:var(--blue); }
.av.g{ background:var(--green-soft); color:var(--green); }

/* elenco cliccabile */
.list-i{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-bottom:1px solid var(--sep);
  cursor:pointer; transition:background .14s;
}
.list-i:last-child{ border-bottom:0; }
.list-i:hover{ background:var(--fill-3); }
.list-i .li-t{ font-weight:600; font-size:14px; }
.list-i .li-s{ font-size:12.5px; color:var(--txt-2); }

/* riquadro da sistemare */
.todo{ display:flex; gap:10px; align-items:flex-start; padding:9px 11px; border-radius:var(--r-s); background:var(--fill-3); border:1px solid var(--sep); margin-bottom:7px; cursor:pointer; }
.todo:hover{ background:var(--fill-1); }
.todo .t-i{ width:26px; height:26px; border-radius:8px; display:grid; place-items:center; flex:0 0 26px; }
.todo .t-i svg{ width:14px; height:14px; }
.todo.r .t-i{ background:var(--red-soft); color:var(--red); }
.todo.a .t-i{ background:var(--amber-soft); color:var(--amber); }
.todo.b .t-i{ background:var(--blue-soft); color:var(--blue); }
.todo.g .t-i{ background:var(--green-soft); color:var(--green); }
.todo .t-t{ font-size:13.5px; font-weight:600; }
.todo .t-s{ font-size:12px; color:var(--txt-2); }

/* riga movimento denaro */
.mv{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--sep); }
.mv:last-child{ border-bottom:0; }
.mv .m-a{ font-variant-numeric:tabular-nums; font-weight:700; margin-left:auto; white-space:nowrap; }
.mv .m-a.in{ color:var(--green); } .mv .m-a.out{ color:var(--red); }

/* segmento colorato prezzo */
.split{ display:flex; height:26px; border-radius:8px; overflow:hidden; border:1px solid var(--sep); }
.split > i{ display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:#fff; font-style:normal; }

/* mini calendario */
.cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cal .c-h{ font-size:10px; font-weight:700; color:var(--txt-3); text-align:center; padding:3px 0; text-transform:uppercase; }
.cal .c-d{ aspect-ratio:1; border-radius:7px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; background:var(--fill-3); position:relative; }
.cal .c-d.out{ opacity:.3; }
.cal .c-d.today{ outline:2px solid var(--brand); }
.cal .c-d.has{ background:var(--brand-soft); color:var(--brand); font-weight:700; cursor:pointer; }
.cal .c-d .pip{ position:absolute; bottom:3px; width:4px; height:4px; border-radius:99px; background:var(--brand); }

/* stampa: fogli */
#print{ display:none; }
.sheet{ font-family:var(--sans); color:#111; background:#fff; }
.sheet h1{ font-family:var(--serif); font-size:22pt; margin:0 0 2pt; }
.sheet h2{ font-size:13pt; margin:14pt 0 5pt; border-bottom:1pt solid #999; padding-bottom:3pt; }
.sheet .p-head{ display:flex; align-items:flex-start; gap:12pt; border-bottom:2pt solid #111; padding-bottom:8pt; margin-bottom:10pt; }
.sheet .p-head .p-ag{ margin-left:auto; text-align:right; font-size:8.5pt; line-height:1.35; color:#444; }
.sheet table{ width:100%; border-collapse:collapse; font-size:9.5pt; }
.sheet th{ text-align:left; background:#eee; padding:4pt 5pt; border:.5pt solid #999; font-size:8.5pt; text-transform:uppercase; letter-spacing:.04em; }
.sheet td{ padding:4pt 5pt; border:.5pt solid #bbb; vertical-align:top; }
.sheet .p-foot{ margin-top:14pt; padding-top:6pt; border-top:.5pt solid #999; font-size:8pt; color:#555; }
.sheet .pill{ display:inline-block; border:.75pt solid #111; border-radius:99pt; padding:1pt 7pt; font-size:8.5pt; font-weight:700; }
.sheet .box{ border:.75pt solid #999; border-radius:4pt; padding:7pt 9pt; margin-bottom:7pt; }
.sheet .cols2{ display:grid; grid-template-columns:1fr 1fr; gap:10pt; }
.sheet .cols3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8pt; }
.sheet .tagli{ display:grid; grid-template-columns:1fr 1fr; gap:0; }
.sheet .tag{ border:.5pt dashed #666; padding:8pt 10pt; height:47mm; display:flex; flex-direction:column; }
.sheet .badge{ border:.5pt solid #999; border-radius:5pt; padding:7pt; height:44mm; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.sheet .break{ page-break-after:always; }
.sheet .sign{ margin-top:22pt; display:grid; grid-template-columns:1fr 1fr; gap:26pt; font-size:8.5pt; }
.sheet .sign div{ border-top:.5pt solid #111; padding-top:3pt; }
.sheet .locandina{ text-align:center; padding:8mm 6mm; }
.sheet .locandina .big{ font-family:var(--serif); font-size:40pt; line-height:1.02; margin:6pt 0; }
.sheet .locandina .price{ font-size:34pt; font-weight:800; }

@media print{
  @page{ size:A4; margin:12mm; }
  body{ background:#fff; }
  #app,#modal,#toasts,#scrim{ display:none !important; }
  #print{ display:block !important; }
  .sheet{ font-size:10pt; }
}

/* lingue che si scrivono da destra a sinistra */
[dir="rtl"] #side{ border-right:0; border-left:1px solid var(--sep); }
[dir="rtl"] .nav-i, [dir="rtl"] .list-i, [dir="rtl"] .todo{ text-align:right; }
[dir="rtl"] .tbl th, [dir="rtl"] .tbl td{ text-align:right; }
[dir="rtl"] .tbl .num{ text-align:left; }
[dir="rtl"] .right{ text-align:left; }
[dir="rtl"] .tl{ padding-left:0; padding-right:30px; }
[dir="rtl"] .tl:before{ left:auto; right:9px; }
[dir="rtl"] .tl-i:before{ left:auto; right:-25px; }
[dir="rtl"] .search svg{ left:auto; right:10px; }
[dir="rtl"] .search input{ padding-left:11px; padding-right:32px; }
[dir="rtl"] .mv .m-a, [dir="rtl"] .pax-chip .x{ margin-left:0; margin-right:auto; }
[dir="rtl"] .badge{ margin-left:0; margin-right:auto; }
[dir="rtl"] select{ background-position:15px 55%, 10px 55%; padding-right:11px; padding-left:30px; }
[dir="rtl"] .sheet th{ text-align:right; }
[dir="rtl"] .sheet .p-head .p-ag{ margin-left:0; margin-right:auto; text-align:left; }
[dir="rtl"] .kv b, [dir="rtl"] .kpi .k-v{ direction:ltr; unicode-bidi:isolate; }
@media(max-width:1000px){ [dir="rtl"] #side{ left:auto; right:0; transform:translateX(100%); } body.side-open[dir] #side{ transform:none; } }

/* costo a persona → quota da chiedere, uno accanto all'altro */
.costo-quota{ display:flex; align-items:stretch; gap:10px; }
.costo-quota .cq{ flex:1; min-width:0; background:var(--fill-3); border:1px solid var(--sep);
  border-radius:var(--r-m); padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
.costo-quota .cq.forte{ background:var(--brand-soft); border-color:var(--brand-soft); }
.costo-quota .cq > span{ font-size:11.5px; font-weight:650; color:var(--txt-3); text-transform:uppercase; letter-spacing:.05em; }
.costo-quota .cq > b{ font-size:26px; font-weight:750; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.15; }
.costo-quota .cq.forte > b{ color:var(--brand); }
.costo-quota .cq > small{ font-size:12px; color:var(--txt-2); }
.costo-quota .cq-sug{ font-size:12px; font-style:normal; font-weight:600; color:var(--txt-3); }
.costo-quota .cq-fre{ display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; color:var(--txt-3); flex:0 0 auto; padding:0 2px; }
.costo-quota .cq-fre svg{ width:20px; height:20px; }
.costo-quota .cq-fre span{ font-size:11.5px; font-weight:700; white-space:nowrap; }
[dir="rtl"] .costo-quota .cq-fre svg{ transform:scaleX(-1); }
@media(max-width:560px){
  .costo-quota{ flex-direction:column; }
  .costo-quota .cq-fre{ flex-direction:row; padding:0; }
  [dir="ltr"] .costo-quota .cq-fre svg, .costo-quota .cq-fre svg{ transform:rotate(90deg); }
  [dir="rtl"] .costo-quota .cq-fre svg{ transform:rotate(90deg); }
}

/* utilita varie */
.sep-line{ height:1px; background:var(--sep); margin:12px 0; }
.pill-row{ display:flex; gap:6px; flex-wrap:wrap; }
.kv{ display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px dashed var(--sep); font-size:13.5px; }
.kv:last-child{ border-bottom:0; }
.kv b{ font-variant-numeric:tabular-nums; }
.kv.tot{ border-top:1.5px solid var(--sep-2); border-bottom:0; margin-top:4px; padding-top:8px; font-size:15px; font-weight:700; }
.warn{ background:var(--amber-soft); border:1px solid var(--amber); color:var(--amber); border-radius:var(--r-s); padding:9px 12px; font-size:13px; font-weight:600; }
.info{ background:var(--blue-soft); border:1px solid transparent; color:var(--blue); border-radius:var(--r-s); padding:9px 12px; font-size:13px; }
.danger{ background:var(--red-soft); border:1px solid var(--red); color:var(--red); border-radius:var(--r-s); padding:9px 12px; font-size:13px; font-weight:600; }
.ok-box{ background:var(--green-soft); color:var(--green); border-radius:var(--r-s); padding:9px 12px; font-size:13px; font-weight:600; }
.drag-over{ outline:2px dashed var(--brand); outline-offset:2px; }
[hidden]{ display:none !important; }
</style>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div>
        <b id="brand-name">Urania</b>
        <small id="brand-sub">viaggi di gruppo</small>
      </div>
    </div>
    <nav id="nav"></nav>
    <div id="side-foot">
      <button class="btn ghost sm" data-act="skin" title="Cambia colore"></button>
      <button class="btn ghost sm" data-act="go" data-view="impostazioni" title="Impostazioni"></button>
      <div class="sp"></div>
      <span class="tiny dim" id="sync-dot" title="Archivio locale">locale</span>
    </div>
  </aside>

  <div id="main">
    <header id="top">
      <button id="burger" class="btn ghost ico" data-act="side"></button>
      <div class="t-title">
        <b id="t-b">Cruscotto</b>
        <span id="t-s"></span>
      </div>
      <div class="sp"></div>
      <div id="t-act" class="row"></div>
    </header>
    <main id="view"></main>
  </div>
</div>

<div id="scrim" data-act="side"></div>

<div id="modal">
  <div class="back" data-act="close"></div>
  <div class="box" id="m-box">
    <div class="m-h">
      <h3 id="m-t">Titolo</h3>
      <div class="sp"></div>
      <button class="btn ghost ico" data-act="close"></button>
    </div>
    <div class="m-b" id="m-b"></div>
    <div class="m-f" id="m-f"></div>
  </div>
</div>

<div id="toasts"></div>
<div id="print"></div>

function ico(n, cls){
  const d = P[n] || "";
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"'
       + (cls ? ' class="'+cls+'"' : '') + '>' + d.split(" M").map((s,i)=> '<path d="'+(i?"M":"")+s+'"/>').join("") + '</svg>';

/** La scritta nella lingua scelta. Se manca la traduzione resta l'italiano. */
function L(s){
  if(LANG === "it" || !s) return s;
  const d = DIZ[s];
  if(!d) return s;
  return d[LNG.indexOf(LANG) - 1] || s;
}
/** Come L, ma sostituisce i segnaposto: LN("{n} posti", {n:12}) */
function LN(s, vals){
  let out = L(s);
  for(const k in (vals||{})) out = out.split("{"+k+"}").join(vals[k]);
  return out;
}
function setLang(l){
  if(LNG.indexOf(l) < 0) return;
  LANG = l;
  if(DB && DB.meta){ DB.meta.lingua = l; save(); }
  document.documentElement.lang = l;
  document.documentElement.dir = (l === "ar" || (typeof LNG_RTL === "object" && LNG_RTL[l])) ? "rtl" : "ltr";
  render();
}

function eur(n, dec){
  const v = Number(n)||0;
  const s = v.toLocaleString(LNG_LOC[LANG], { minimumFractionDigits: dec===undefined ? (Math.abs(v%1)>0.004?2:0) : dec, maximumFractionDigits: dec===undefined?2:dec });
  return cursym() + " " + s;
}

function today(){ return iso(new Date()); }
function iso(d){
  const z = new Date(d);
  return z.getFullYear() + "-" + String(z.getMonth()+1).padStart(2,"0") + "-" + String(z.getDate()).padStart(2,"0");
}
function dt(s){ const d = new Date(String(s||"").slice(0,10) + "T12:00:00"); return isNaN(d) ? new Date() : d; }
function addDays(s, n){ const d = dt(s); d.setDate(d.getDate()+n); return iso(d); }
function days(a, b){ return Math.round((dt(b) - dt(a)) / 86400000); }
function toGo(s){ return days(today(), s); }
function dIT(s){ const d = dt(s); return d.getDate() + " " + MESI3()[d.getMonth()] + " " + d.getFullYear(); }
function dLong(s){ const d = dt(s); return GIORNI()[d.getDay()] + " " + d.getDate() + " " + MESI()[d.getMonth()] + " " + d.getFullYear(); }
function dShort(s){ const d = dt(s); return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0"); }
function dDay(s){ const d = dt(s); return GIORNI2()[d.getDay()] + " " + d.getDate(); }
function mese(s){ const d = dt(s); return MESI()[d.getMonth()] + " " + d.getFullYear(); }
function ym(s){ return String(s||"").slice(0,7); }
function periodo(a, b){
  const x = dt(a), y = dt(b);
  if(x.getMonth() === y.getMonth() && x.getFullYear() === y.getFullYear())
    return x.getDate() + "–" + y.getDate() + " " + MESI()[y.getMonth()] + " " + y.getFullYear();
  return dIT(a) + " – " + dIT(b);
}
function eta(birth){
  if(!birth) return null;
  const b = dt(birth), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  const m = n.getMonth() - b.getMonth();
  if(m < 0 || (m === 0 && n.getDate() < b.getDate())) a--;
  return a;
}
function quando(s){
  const g = toGo(s);
  if(g === 0) return L("oggi");
  if(g === 1) return L("domani");
  if(g === -1) return L("ieri");
  if(g > 0) return LN("fra {n} giorni", { n:g });
  return LN("{n} giorni fa", { n:-g });
}
function scaduto(s){ return toGo(s) < 0; }

/* --- avviso a video --- */
function toast(msg, kind){
  const t = document.createElement("div");
  t.className = "toast" + (kind ? " " + kind : "");
  t.textContent = msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(()=>{ t.style.transition = "opacity .3s"; t.style.opacity = "0"; setTimeout(()=> t.remove(), 320); }, 2400);
}
function copia(txt){
  const done = ()=> toast("Copiato", "ok");
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, ()=> fallback());
  else fallback();
  function fallback(){
    const a = document.createElement("textarea");
    a.value = txt; a.style.position = "fixed"; a.style.opacity = "0";
    document.body.appendChild(a); a.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("Copia non riuscita", "err"); }
    a.remove();
  }
}

"Preventivo senza impegno. Le quote sono calcolate sul numero di persone indicato: se il gruppo cambia, la quota cambia.":["Quote without obligation. Prices are worked out on the number of people shown: if the group changes, the price changes.","Devis sans engagement. Les prix sont calculés sur le nombre de personnes indiqué : si le groupe change, le prix change.","Presupuesto sin compromiso. Las cuotas se calculan sobre el número de personas indicado: si el grupo cambia, la cuota cambia.","Oferta niezobowiązująca. Ceny liczone są dla podanej liczby osób: jeśli grupa się zmieni, cena też.","عرض غير ملزم. الأسعار محسوبة على عدد الأشخاص المذكور: إذا تغيّرت المجموعة تغيّر السعر."],

"Quando il gruppo dice di sì, il preventivo diventa una partenza vera con un clic: costi e quota si portano dietro.":["When the group says yes, the quote becomes a real departure in one click: costs and price come with it.","Quand le groupe dit oui, le devis devient un vrai départ en un clic : coûts et prix suivent.","Cuando el grupo dice que sí, el presupuesto se convierte en una salida real con un clic: costes y cuota se llevan consigo.","Gdy grupa się zgodzi, oferta jednym kliknięciem staje się prawdziwym wyjazdem: koszty i cena idą razem z nią.","عندما توافق المجموعة يتحوّل العرض إلى رحلة حقيقية بنقرة واحدة: التكاليف والسعر تنتقل معه."],
"Quando una comitiva chiede «quanto ci costa?», il viaggio non esiste ancora. Qui metti i costi che ti danno i fornitori, dici quanto vuoi guadagnare e lui ti dice la quota da chiedere, quante persone servono per non rimetterci e come cambia tutto se il gruppo cresce o cala.":["When a group asks “how much does it cost?”, the trip does not exist yet. Here you enter the costs your suppliers give you, say how much you want to earn, and it tells you the price to ask, how many people you need to break even and how everything changes if the group grows or shrinks.","Quand un groupe demande « combien ça coûte ? », le voyage n'existe pas encore. Ici vous saisissez les coûts donnés par les fournisseurs, vous dites ce que vous voulez gagner, et il vous dit le prix à demander, combien de personnes il faut pour être à l'équilibre et comment tout change si le groupe grandit ou diminue.","Cuando un grupo pregunta «¿cuánto cuesta?», el viaje aún no existe. Aquí pones los costes que te dan los proveedores, dices cuánto quieres ganar y él te dice la cuota que pedir, cuántas personas hacen falta para no perder y cómo cambia todo si el grupo crece o baja.","Gdy grupa pyta „ile to kosztuje?”, wyjazdu jeszcze nie ma. Tu wpisujesz koszty od dostawców, mówisz, ile chcesz zarobić, a program podaje cenę, liczbę osób potrzebną do wyjścia na zero i pokazuje, jak wszystko się zmienia, gdy grupa rośnie lub maleje.","عندما تسأل مجموعة «كم يكلّفنا؟» تكون الرحلة غير موجودة بعد. هنا تُدخل التكاليف التي يعطيك إياها المورّدون، وتقول كم تريد أن تربح، فيقول لك السعر المطلوب، وكم شخصاً تحتاج حتى لا تخسر، وكيف يتغيّر كل شيء إذا كبرت المجموعة أو صغرت."],

"Dai un codice di quattro cifre a chi lavora in agenzia: all'apertura il programma chiede il codice e sa chi sta lavorando. Chi non ha codice non compare nella schermata di entrata.":["Give a four-digit code to each member of staff: at start-up the program asks for the code and knows who is working. People without a code do not appear on the entry screen.","Donnez un code à quatre chiffres à chaque employé : au démarrage le logiciel demande le code et sait qui travaille. Sans code, la personne n'apparaît pas à l'écran d'entrée.","Da un código de cuatro cifras a cada persona: al abrir, el programa pide el código y sabe quién trabaja. Quien no tiene código no aparece en la pantalla de entrada.","Nadaj każdemu pracownikowi czterocyfrowy kod: przy starcie program pyta o kod i wie, kto pracuje. Osoby bez kodu nie pojawiają się na ekranie logowania.","أعطِ رمزاً من أربعة أرقام لكل من يعمل في الوكالة: عند الفتح يطلب البرنامج الرمز ويعرف من يعمل. من لا رمز له لا يظهر في شاشة الدخول."],

"I posti bloccati (autista, accompagnatore, guida) si impostano dall'ingranaggio. Chi ha problemi a stare in fondo va sistemato davanti: la piantina si stampa e si consegna all'autista.":["Blocked seats (driver, tour leader, guide) are set with the gear icon. Anyone who cannot sit at the back goes up front: the plan is printed and handed to the driver.","Les places bloquées (chauffeur, accompagnateur, guide) se règlent avec l'engrenage. Ceux qui ne supportent pas le fond vont devant : le plan s'imprime et se remet au chauffeur.","Los asientos bloqueados (conductor, acompañante, guía) se ajustan con el engranaje. Quien no puede ir atrás va delante: el plano se imprime y se entrega al conductor.","Miejsca zablokowane (kierowca, pilot, przewodnik) ustawia się przez zębatkę. Kto źle znosi tył, siada z przodu: plan drukuje się i daje kierowcy.","المقاعد المحجوزة (السائق، المرافق، المرشد) تُضبط من زر الإعدادات. من لا يتحمّل الجلوس في الخلف يُوضع في الأمام: المخطط يُطبع ويُسلَّم للسائق."],

"Il primo passeggero è l'intestatario. Gli altri si aggiungono dalla pratica.":["The first passenger is the lead name. The others are added inside the file.","Le premier passager est le titulaire. Les autres s'ajoutent dans le dossier.","El primer pasajero es el titular. Los demás se añaden dentro del expediente.","Pierwszy pasażer to główny zgłaszający. Pozostałych dodaje się w rezerwacji.","المسافر الأول هو صاحب الملف. الباقون يُضافون من ملف الحجز."],
"Il programma finisce sul foglio di viaggio dell'accompagnatore, sulla locandina e sulla conferma che si consegna al cliente. Scrivilo una volta sola: si stampa da tre parti diverse.":["The itinerary ends up in the tour leader's dossier, on the poster and on the client's confirmation. Write it once: it prints from three different places.","Le programme se retrouve dans le carnet de l'accompagnateur, sur l'affiche et sur la confirmation du client. Écrivez-le une fois : il s'imprime depuis trois endroits.","El itinerario acaba en la hoja del acompañante, en el cartel y en la confirmación del cliente. Escríbelo una vez: se imprime desde tres sitios.","Program trafia do teczki pilota, na plakat i na potwierdzenie dla klienta. Napisz go raz: drukuje się w trzech miejscach.","البرنامج يظهر في ورقة رحلة المرافق وفي الملصق وفي تأكيد الحجز الذي يُسلَّم للزبون. اكتبه مرة واحدة: يُطبع من ثلاثة أماكن."],

"In Italia le agenzie che vendono pacchetti propri applicano l'art. 74-ter: l'IVA non si calcola sul prezzo di vendita, ma sul margine, cioè su quello che resta dopo aver pagato i servizi acquistati da terzi. Qui sotto il conto, viaggio per viaggio.":["In Italy, agencies selling their own packages apply art. 74-ter: VAT is not charged on the selling price but on the margin, i.e. what is left after paying for services bought from third parties. Below, trip by trip.","En Italie, les agences qui vendent leurs propres forfaits appliquent l'art. 74-ter : la TVA porte non sur le prix de vente mais sur la marge, c'est-à-dire ce qui reste après avoir payé les services achetés à des tiers. Ci-dessous, voyage par voyage.","En Italia, las agencias que venden paquetes propios aplican el art. 74-ter: el IVA no se calcula sobre el precio de venta sino sobre el margen, es decir, lo que queda tras pagar los servicios comprados a terceros. Abajo, viaje por viaje.","We Włoszech biura sprzedające własne pakiety stosują art. 74-ter: VAT liczy się nie od ceny sprzedaży, lecz od marży, czyli tego, co zostaje po opłaceniu usług obcych. Poniżej wyjazd po wyjeździe.","في إيطاليا، الوكالات التي تبيع برامجها الخاصة تطبّق المادة 74-ثالثاً: الضريبة لا تُحسب على سعر البيع بل على الهامش، أي ما يتبقّى بعد دفع الخدمات المشتراة من الغير. في الأسفل الحساب، رحلة برحلة."],

"Tourista è un gestionale per agenzie che organizzano viaggi di gruppo: un solo file, nessun abbonamento, funziona anche senza internet. Si può installare sul telefono o sul computer come un'applicazione.":["Tourista is a management program for agencies that organise group trips: a single file, no subscription, works offline too. It can be installed on a phone or computer like an app.","Tourista est un logiciel de gestion pour les agences qui organisent des voyages de groupe : un seul fichier, sans abonnement, fonctionne aussi hors ligne. Il s'installe sur téléphone ou ordinateur comme une application.","Tourista es un programa de gestión para agencias que organizan viajes de grupo: un solo archivo, sin suscripción, funciona también sin internet. Se puede instalar en el móvil o el ordenador como una aplicación.","Tourista to program do zarządzania biurem organizującym wyjazdy grupowe: jeden plik, bez abonamentu, działa też bez internetu. Można go zainstalować na telefonie lub komputerze jak aplikację.","توريستا برنامج إدارة للوكالات التي تنظّم رحلات جماعية: ملف واحد، بلا اشتراك، يعمل حتى بدون إنترنت. يمكن تثبيته على الهاتف أو الحاسوب كتطبيق."],

"Tutto in ordine. Non c'è niente in sospeso.":["All clear. Nothing pending.","Tout est en ordre. Rien en attente.","Todo en orden. Nada pendiente.","Wszystko w porządku. Nic nie czeka.","كل شيء على ما يرام. لا شيء معلَّق."],
"Tutto quello che scrivi resta su questo apparecchio, dentro il browser. Nessuno lo vede da fuori. Fai una copia ogni tanto: se cambi computer, la riapri e ritrovi tutto.":["Everything you write stays on this device, inside the browser. Nobody sees it from outside. Make a backup now and then: if you change computer, you open it and find everything again.","Tout ce que vous écrivez reste sur cet appareil, dans le navigateur. Personne ne le voit de l'extérieur. Faites une sauvegarde de temps en temps : en changeant d'ordinateur, vous la rouvrez et retrouvez tout.","Todo lo que escribes queda en este aparato, dentro del navegador. Nadie lo ve desde fuera. Haz una copia de vez en cuando: si cambias de ordenador, la abres y lo recuperas todo.","Wszystko, co wpiszesz, zostaje na tym urządzeniu, w przeglądarce. Nikt z zewnątrz tego nie widzi. Rób od czasu do czasu kopię: przy zmianie komputera otworzysz ją i odzyskasz wszystko.","كل ما تكتبه يبقى على هذا الجهاز داخل المتصفح. لا أحد يراه من الخارج. خُذ نسخة من حين لآخر: إذا غيّرت الحاسوب تفتحها وتجد كل شيء."],

"Chiedi l'opzione all'hotel e al bus, segnala scadenza e acconto.":["Ask the hotel and the coach company for an option, note the deadline and the deposit.","Demandez une option à l'hôtel et au car, notez l'échéance et l'acompte.","Pide la opción al hotel y al autocar, anota el vencimiento y el anticipo.","Poproś hotel i przewoźnika o opcję, zapisz termin i zaliczkę.","اطلب الحجز المبدئي من الفندق والحافلة، وسجّل الأجل والعربون."],
"Chiedi sempre l'opzione a hotel e bus, e scrivi la data in cui scade. Se la scadenza passa, il prezzo cambia.":["Always ask hotels and coach firms for an option, and write down when it expires. Once it lapses, the price changes.","Demandez toujours une option à l'hôtel et au car, et notez la date d'expiration. Passé ce délai, le prix change.","Pide siempre la opción a hotel y autocar, y apunta cuándo vence. Si vence, el precio cambia.","Zawsze proś hotel i przewoźnika o opcję i zapisz datę jej wygaśnięcia. Po terminie cena się zmienia.","اطلب دائماً حجزاً مبدئياً من الفندق والحافلة، واكتب تاريخ انتهائه. إذا مرّ الأجل تغيّر السعر."],

"Il programma giorno per giorno":["The day-by-day itinerary","Le programme jour par jour","El itinerario día a día","Program dzień po dniu","البرنامج يوماً بيوم"],
"Il saldo si chiede trenta giorni prima, non il giorno della partenza. Lo scadenzario ti dice ogni mattina chi manca.":["Ask for the balance thirty days before, not on departure day. The due-date list tells you every morning who is missing.","Le solde se demande trente jours avant, pas le jour du départ. L'échéancier vous dit chaque matin qui manque.","El saldo se pide treinta días antes, no el día de la salida. Los vencimientos te dicen cada mañana quién falta.","Dopłatę bierze się trzydzieści dni wcześniej, nie w dniu wyjazdu. Terminarz codziennie rano pokaże, kogo brakuje.","الرصيد يُطلب قبل ثلاثين يوماً لا يوم الانطلاق. جدول الاستحقاقات يخبرك كل صباح من لم يدفع."],
"In viaggio":["Travelling","En voyage","De viaje","W trasie","في السفر"],
"L'hotel chiude le camere se non riceve l'elenco. Falla appena hai il gruppo quasi pieno.":["The hotel releases the rooms if it does not get the list. Do it as soon as the group is nearly full.","L'hôtel libère les chambres s'il ne reçoit pas la liste. Faites-la dès que le groupe est presque complet.","El hotel libera las habitaciones si no recibe la lista. Hazla en cuanto el grupo esté casi lleno.","Hotel zwolni pokoje, jeśli nie dostanie listy. Zrób ją, gdy grupa jest prawie pełna.","الفندق يغلق الغرف إن لم يستلم القائمة. أعدّها حالما تقترب المجموعة من الاكتمال."],
"L'hotel vuole il rooming di solito una settimana prima. La piantina evita le liti sul posto vicino al finestrino.":["The hotel usually wants the rooming list a week ahead. The seating plan avoids arguments over the window seat.","L'hôtel demande la rooming list en général une semaine avant. Le plan évite les disputes pour la place côté fenêtre.","El hotel suele pedir el rooming una semana antes. El plano evita las peleas por el asiento de ventanilla.","Hotel zwykle chce listy pokoi tydzień wcześniej. Plan miejsc zapobiega kłótniom o miejsce przy oknie.","الفندق يطلب توزيع الغرف عادةً قبل أسبوع. والمخطط يمنع الخلافات على المقعد قرب النافذة."],
"La partenza vera":["The actual departure","Le départ concret","La salida real","Konkretny wyjazd","الرحلة الحقيقية"],
"La pratica è il fascicolo del viaggio di quella famiglia o di quel gruppo: tutto quello che serve sta lì dentro.":["The booking is that family's or group's file: everything you need is in there.","Le dossier est le fichier de voyage de cette famille ou de ce groupe : tout y est.","El expediente es la carpeta del viaje de esa familia o grupo: todo lo necesario está ahí.","Rezerwacja to teczka wyjazdu danej rodziny lub grupy: wszystko, co potrzebne, jest w środku.","ملف الحجز هو ملف رحلة تلك العائلة أو تلك المجموعة: كل ما يلزم موجود بداخله."],
"La quota si calcola sul minimo di partecipanti, non sul pieno. Se parti in venti invece che in quaranta, i costi fissi si dividono su meno gente.":["The price is worked out on the minimum number, not on a full coach. With twenty instead of forty, the fixed costs are split among fewer people.","Le prix se calcule sur le minimum de participants, pas sur le car plein. À vingt au lieu de quarante, les coûts fixes se répartissent sur moins de monde.","El precio se calcula sobre el mínimo de participantes, no sobre el lleno. Con veinte en vez de cuarenta, los costes fijos se reparten entre menos gente.","Cenę liczy się na minimalną liczbę uczestników, nie na komplet. Przy dwudziestu zamiast czterdziestu koszty stałe dzielą się na mniej osób.","السعر يُحسب على الحد الأدنى للمشاركين لا على الاكتمال. إن سافرت بعشرين بدل أربعين تُقسَّم التكاليف الثابتة على عدد أقل."],

"Lo scadenzario ti avvisa da solo di chi è in ritardo, senza doverci pensare.":["The due-date list warns you by itself who is late, without you having to think about it.","L'échéancier vous signale tout seul qui est en retard, sans y penser.","Los vencimientos te avisan solos de quién va con retraso, sin pensarlo.","Terminarz sam ostrzeże, kto się spóźnia — nie musisz o tym pamiętać.","جدول الاستحقاقات ينبّهك وحده إلى المتأخرين دون أن تفكّر في الأمر."],

"Nessuno resta a terra e sai subito chi manca e chi chiamare.":["Nobody is left behind and you know at once who is missing and who to call.","Personne n'est laissé sur place et vous savez tout de suite qui manque et qui appeler.","Nadie se queda en tierra y sabes enseguida quién falta y a quién llamar.","Nikt nie zostaje na miejscu, a ty od razu wiesz, kogo brakuje i do kogo zadzwonić.","لا أحد يبقى على الأرض، وتعرف فوراً من ينقص ومن تتصل به."],

"Prima si conta quanto si spende, poi si decide quanto far pagare. Mai il contrario. Il programma ti dice anche quante persone servono per non rimetterci.":["First count what you spend, then decide what to charge. Never the other way round. The program also tells you how many people you need not to lose money.","On compte d'abord ce qu'on dépense, puis on décide le prix. Jamais l'inverse. Le logiciel indique aussi combien de personnes il faut pour ne pas perdre.","Primero se cuenta lo que se gasta, luego se decide cuánto cobrar. Nunca al revés. El programa también dice cuánta gente hace falta para no perder.","Najpierw liczysz, ile wydajesz, potem decydujesz, ile brać. Nigdy odwrotnie. Program powie też, ilu osób trzeba, by nie stracić.","أولاً تحسب كم تنفق، ثم تقرّر كم تطلب. لا العكس أبداً. والبرنامج يقول لك أيضاً كم شخصاً يلزم حتى لا تخسر."],

"Segna la partenza come conclusa, paga i fornitori, guarda il margine e l'IVA.":["Mark the departure as completed, pay the suppliers, look at the margin and the VAT.","Marquez le départ comme terminé, payez les fournisseurs, regardez la marge et la TVA.","Marca la salida como concluida, paga a los proveedores, mira el margen y el IVA.","Oznacz wyjazd jako zakończony, zapłać dostawcom, sprawdź marżę i VAT.","سجّل الرحلة كمنتهية، ادفع للمورّدين، وانظر إلى الهامش والضريبة."],
"Senza acconto la prenotazione non esiste: la gente cambia idea e tu hai già impegnato il bus.":["Without a deposit the booking does not exist: people change their minds and you have already committed the coach.","Sans acompte, la réservation n'existe pas : les gens changent d'avis et le car est déjà engagé.","Sin anticipo la reserva no existe: la gente cambia de idea y tú ya has comprometido el autocar.","Bez zaliczki rezerwacja nie istnieje: ludzie zmieniają zdanie, a ty masz już zamówiony autokar.","بدون عربون لا يوجد حجز: الناس يغيّرون رأيهم وأنت قد حجزت الحافلة."],
"Senza fornitori non puoi calcolare i costi né prenotare i servizi. È la base di tutto il resto.":["Without suppliers you cannot work out costs or book services. It is the basis for everything else.","Sans fournisseurs, impossible de calculer les coûts ni de réserver. C'est la base de tout le reste.","Sin proveedores no puedes calcular costes ni reservar servicios. Es la base de todo lo demás.","Bez dostawców nie policzysz kosztów ani nie zamówisz usług. To podstawa wszystkiego.","بدون مورّدين لا يمكنك حساب التكاليف ولا حجز الخدمات. إنها أساس كل شيء."],
"Serve al cliente per decidere, all'accompagnatore per lavorare e a te per la locandina.":["The client needs it to decide, the tour leader to work, and you for the poster.","Il sert au client pour décider, à l'accompagnateur pour travailler et à vous pour l'affiche.","Le sirve al cliente para decidir, al acompañante para trabajar y a ti para el cartel.","Klientowi służy do decyzji, pilotowi do pracy, a tobie na plakat.","يفيد الزبون ليقرّر، والمرافق ليعمل، وأنت لتصنع الملصق."],
"Si scrive una volta e si riusa per ogni data. Da qui nascono le partenze con due clic.":["Write it once and reuse it for every date. Departures are born from here with two clicks.","On l'écrit une fois et on le réutilise pour chaque date. Les départs en naissent en deux clics.","Se escribe una vez y se reutiliza para cada fecha. De aquí nacen las salidas con dos clics.","Piszesz raz i używasz przy każdym terminie. Stąd powstają wyjazdy w dwa kliknięcia.","يُكتب مرة ويُعاد استعماله لكل تاريخ. من هنا تولد الرحلات بنقرتين."],
"Si stampa tutto da una schermata sola, il giorno prima di partire.":["It all prints from a single screen, the day before departure.","Tout s'imprime depuis un seul écran, la veille du départ.","Se imprime todo desde una sola pantalla, el día antes de salir.","Wszystko drukuje się z jednego ekranu, dzień przed wyjazdem.","يُطبع كل شيء من شاشة واحدة، في اليوم السابق للانطلاق."],

"Un posto gratis ogni venticinque abbassa il costo di tutti. Se non lo conti, ti regali margine.":["One free place in twenty-five lowers everyone's cost. If you do not count it, you give away margin.","Une gratuité pour vingt-cinq baisse le coût de tous. Si vous ne la comptez pas, vous offrez de la marge.","Una plaza gratis cada veinticinco baja el coste de todos. Si no la cuentas, regalas margen.","Jedno miejsce gratis na dwadzieścia pięć obniża koszt wszystkim. Jeśli tego nie policzysz, oddajesz marżę.","مقعد مجاني لكل خمسة وعشرين يخفّض التكلفة على الجميع. إن لم تحسبه فأنت تهدي هامشك."],

function persona(sesso, minA, maxA){
  const f = sesso === "f";
  const anni = ri(minA, maxA);
  const nasc = iso(new Date(new Date().getFullYear() - anni, ri(0,11), ri(1,27)));
  const nome = f ? pick(NOMI_F) : pick(NOMI_M);
  const cog = pick(COGNOMI);
  const cit = pick(CITTA);

    id: uid("pe"), nome: nome, cognome: cog, sesso: f ? "f" : "m", nascita: nasc,

<script>
/* --- le pratiche, le richieste, la prima nota, le cose da fare --- */
function seedPratiche(db, T, PP, cliPriv, nextP){
  let prog = 1;
  const anno = new Date().getFullYear();
  const codice = ()=> "P" + anno + "-" + String(prog++).padStart(3,"0");

  function camere(ids, quanti){
    const R = [];
    let i = 0;
    if(quanti === 1){ R.push({ id:uid("rm"), tipo:"dus", ids:[ids[0]] }); return R; }
    while(i < ids.length){
      const resto = ids.length - i;
      if(resto === 1){ R.push({ id:uid("rm"), tipo:"dus", ids:[ids[i]] }); i += 1; }
      else if(resto === 3 && rnd() < 0.6){ R.push({ id:uid("rm"), tipo:"tpl", ids:ids.slice(i,i+3) }); i += 3; }
      else { R.push({ id:uid("rm"), tipo: rnd() < 0.25 ? "twn" : "dbl", ids:ids.slice(i,i+2) }); i += 2; }
    }
    return R;
  }

  function pratica(dep, cli, quanti, opt){
    opt = opt || {};
    const gente = [];
    for(let k=0;k<quanti;k++) gente.push(nextP());
    const pax = gente.map(p=>{
      const a = eta(p.nascita);
      const rid = a !== null && a < 18;
      return { id:uid("px"), personId:p.id, tipo: rid ? "ridotto" : "adulto", prezzo: rid ? dep.quotaRid : dep.quota, note:"" };
    });
    const pr = {
      id: uid("pr"), codice: codice(), depId: dep.id, clienteId: cli.id,
      creata: opt.creata || addDays(dep.inizio, -ri(40,110)),
      stato: opt.stato || "confermata",
      scadenzaOpzione: opt.scadenzaOpzione || "",
      pax: pax,
      camere: camere(gente.map(p=> p.id), quanti),
      extra: [{ id:uid("ex"), voce:"Quota di iscrizione e assicurazione medico-bagaglio", importo: db.meta.quotaIscrizione, qta: quanti }],
      sconto: cli.sconto ? 0 : (rnd() < 0.12 ? ri(1,4) * 10 : 0),
      scontoNota: "",
      pagamenti: [], posti: {}, appello: {},
      note: opt.note || "", venditore: rnd() < 0.5 ? "st_luca" : "st_marta"
    };
    if(rnd() < 0.18) pr.extra.push({ id:uid("ex"), voce:"Assicurazione annullamento", importo:45, qta:quanti });
    if(cli.sconto) pr.scontoNota = "Convenzione " + cli.nome + " −" + cli.sconto + "%";
    const totale = pratTotale(pr, dep);
    if(cli.sconto){ pr.sconto = Math.round(totale * cli.sconto / 100); }
    const t2 = pratTotale(pr, dep);
    const acc = Math.min(t2, dep.acconto * quanti);
    if(opt.stato === "opzione"){ /* niente soldi ancora */ }
    else {
      pr.pagamenti.push({ id:uid("pa"), data: pr.creata, importo: acc, modo: rnd() < 0.55 ? "bonifico" : "contanti", nota:"Acconto" });
      if(opt.saldata){
        pr.pagamenti.push({ id:uid("pa"), data: addDays(dep.inizio, -ri(22,40)), importo: Math.round((t2 - acc) * 100)/100, modo: rnd() < 0.6 ? "bonifico" : "carta", nota:"Saldo" });
        pr.stato = "saldata";
      }
    }
    if(opt.annullata){ pr.stato = "annullata"; pr.note = "Annullata dal cliente: " + pick(["motivi di salute","impegni di lavoro","lutto in famiglia"]) + ". Trattenuta penale."; }
    db.pratiche.push(pr);
    return pr;
  }

  const depSic = db.partenze.find(d=> d.id === "dp_sic");
  const depLou = db.partenze.find(d=> d.id === "dp_lou");
  const depMar = db.partenze.find(d=> d.id === "dp_mar");
  const depGre = db.partenze.find(d=> d.id === "dp_gre");
  const depPra = db.partenze.find(d=> d.id === "dp_pra");
  const depPug = db.partenze.find(d=> d.id === "dp_pug");

  const parr = db.clienti.find(c=> c.id === "cl_parr");
  const bocc = db.clienti.find(c=> c.id === "cl_bocc");
  let ic = 0;
  const nextC = ()=> cliPriv[ic++ % cliPriv.length];

  /* Sicilia — 39 posti su 48, quasi tutti saldati, due opzioni in scadenza */
  pratica(depSic, cral, 8, { saldata:true, note:"Gruppo CRAL, fattura unica al circolo." });
  pratica(depSic, bocc, 6, { saldata:true, note:"Chiedono tavolo unico a cena." });
  let n = 14;
  while(n < 37){ const q = ri(2,4); pratica(depSic, nextC(), q, { saldata: rnd() < 0.7 }); n += q; }
  pratica(depSic, nextC(), 2, { stato:"opzione", scadenzaOpzione: addDays(T,-2), note:"Opzione scaduta: richiamare oggi." });
  pratica(depSic, nextC(), 2, { stato:"opzione", scadenzaOpzione: addDays(T,1) });

  /* Lourdes — quasi pieno, gruppo parrocchiale */
  pratica(depLou, parr, 24, { saldata:true, note:"Comitiva parrocchiale, bonifico unico. Don Marco in singola." });
  n = 24;
  while(n < 50){ const q = ri(1,3); pratica(depLou, nextC(), q, { saldata: rnd() < 0.85 }); n += q; }
  pratica(depLou, nextC(), 2, { note:"Saldo ancora da incassare, sollecitato." });

  /* Marocco — in vendita, 22 su 40 */
  n = 0;
  while(n < 18){ const q = ri(2,4); pratica(depMar, nextC(), q, { saldata: rnd() < 0.25 }); n += q; }
  pratica(depMar, nextC(), 2, { stato:"opzione", scadenzaOpzione: addDays(T,3) });
  pratica(depMar, nextC(), 2, { stato:"opzione", scadenzaOpzione: addDays(T,6) });

  /* Grecia — sotto il minimo */
  n = 0;
  while(n < 7){ const q = ri(2,3); pratica(depGre, nextC(), q, {}); n += q; }
  pratica(depGre, nextC(), 2, { stato:"opzione", scadenzaOpzione: addDays(T,9) });

  /* Praga — appena aperta */
  n = 0;
  while(n < 12){ const q = ri(2,4); pratica(depPra, nextC(), q, {}); n += q; }
  pratica(depPra, nextC(), 2, { stato:"opzione", scadenzaOpzione: addDays(T,4) });

  /* Puglia — conclusa e tutta incassata */
  n = 0;
  while(n < 44){ const q = ri(2,4); pratica(depPug, nextC(), q, { saldata:true }); n += q; }
  pratica(depPug, nextC(), 2, { annullata:true });

  /* posti in bus assegnati dove il viaggio è vicino */
  [depLou, depSic].forEach(dep=>{
    let s = 3;
    db.pratiche.filter(p=> p.depId === dep.id && p.stato !== "annullata").forEach(pr=>{
      pr.pax.forEach(px=>{
        while(dep.bus.bloccati.indexOf(s) >= 0) s++;
        if(s <= dep.bus.file * 4){ pr.posti[px.personId] = s; s++; }
      });
    });
  });

  /* ---------- richieste in corso ---------- */
  db.richieste = [
    { id:uid("ri"), data: addDays(T,-2), nome:"Parrocchia S. Giuseppe — Sesto", ref:"don Paolo", tel:"02 2247 881", email:"parrocchia.sg@tiscali.it",
      dest:"Lourdes", pax:45, periodo:"settembre", budget:"550 a testa", canale:"passaparola", stato:"da preventivare",
      note:"Vogliono l'hotel vicino alla Grotta e il bus con pedana per due carrozzine." },
    { id:uid("ri"), data: addDays(T,-5), nome:"Liceo A. Manzoni — Como", ref:"prof.ssa Bianchi", tel:"031 552 900", email:"viaggi@liceomanzoni.edu.it",
      dest:"Grecia classica", pax:55, periodo:"marzo prossimo", budget:"gara con 3 preventivi", canale:"bando", stato:"preventivo inviato",
      note:"Serve preventivo formale con polizza e gratuità docenti 1 ogni 15." },
    { id:uid("ri"), data: addDays(T,-9), nome:"CRAL Banca Alpina", ref:"Sig. Meroni", tel:"02 8899 4412", email:"cral@bancalpina.it",
      dest:"Praga capodanno", pax:30, periodo:"dicembre", budget:"700", canale:"sito", stato:"in trattativa",
      note:"Hanno chiesto se il cenone è incluso. Rispondere con il programma dettagliato." },
    { id:uid("ri"), data: addDays(T,-14), nome:"Famiglia Ferrari", ref:"Anna Ferrari", tel:"338 220 1199", email:"anna.ferrari@gmail.com",
      dest:"Marocco", pax:4, periodo:"giugno", budget:"—", canale:"instagram", stato:"vinta",
      note:"Confermata: è diventata la pratica del tour Città Imperiali." },
    { id:uid("ri"), data: addDays(T,-21), nome:"Gruppo Alpini Valmadrera", ref:"Sergio Riva", tel:"340 771 0022", email:"alpini.valmadrera@gmail.com",
      dest:"Vienna mercatini", pax:40, periodo:"dicembre", budget:"600", canale:"passaparola", stato:"persa",
      note:"Sono andati con l'agenzia di Lecco: 40 € in meno a testa." }
  ];

  /* ---------- prima nota (quello che non passa dalle pratiche) ---------- */
  const m = ym(T);
  db.prima = [
    { id:uid("pn"), data: m + "-03", tipo:"uscita", cat:"affitto", importo:1450, modo:"bonifico", desc:"Affitto ufficio di via Garibaldi", depId:"" },
    { id:uid("pn"), data: m + "-05", tipo:"uscita", cat:"stipendi", importo:5200, modo:"bonifico", desc:"Stipendi del mese", depId:"" },
    { id:uid("pn"), data: m + "-07", tipo:"uscita", cat:"marketing", importo:380, modo:"carta", desc:"Volantini Sicilia e inserzione su Facebook", depId:"dp_sic" },
    { id:uid("pn"), data: m + "-10", tipo:"uscita", cat:"utenze", importo:210, modo:"addebito", desc:"Luce, telefono e linea", depId:"" },
    { id:uid("pn"), data: m + "-12", tipo:"entrata", cat:"provvigioni", importo:640, modo:"bonifico", desc:"Provvigioni biglietteria aerea", depId:"" },
    { id:uid("pn"), data: m + "-15", tipo:"uscita", cat:"assicurazioni", importo:520, modo:"bonifico", desc:"Rata polizza R.C. e fondo di garanzia", depId:"" },
    { id:uid("pn"), data: m + "-18", tipo:"uscita", cat:"software", importo:59, modo:"carta", desc:"Hosting sito e caselle di posta", depId:"" }
  ];

  /* ---------- cose da fare ---------- */
  db.cose = [
    { id:uid("cs"), testo:"Mandare i nomi definitivi a Royal Air Maroc", scad: addDays(T,38), fatto:false, depId:"dp_mar", chi:"st_luca" },
    { id:uid("cs"), testo:"Decidere se confermare la Grecia: siamo sotto il minimo", scad: addDays(T,45), fatto:false, depId:"dp_gre", chi:"st_marta" },
    { id:uid("cs"), testo:"Saldare l'hotel Athena di Agrigento", scad: addDays(T,-3), fatto:false, depId:"dp_sic", chi:"st_elena" },
    { id:uid("cs"), testo:"Preparare il foglio di viaggio per Sara (Sicilia)", scad: addDays(T,22), fatto:false, depId:"dp_sic", chi:"st_luca" },
    { id:uid("cs"), testo:"Prenotare il ristorante Da Nino per la cena tipica", scad: addDays(T,14), fatto:true, depId:"dp_sic", chi:"st_luca" },
    { id:uid("cs"), testo:"Rinnovare l'opzione voli Aegean per la Grecia", scad: addDays(T,18), fatto:false, depId:"dp_gre", chi:"st_marta" },
    { id:uid("cs"), testo:"Chiedere alla parrocchia l'elenco definitivo delle carrozzine", scad: addDays(T,4), fatto:false, depId:"dp_lou", chi:"st_yous" }
  ];
  return db;
}
