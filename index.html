    '<div class="' + (collegato ? "ok-box" : SYNC.stato === "muto" ? "danger" : "info") + ' mt">' +
      (collegato && DB.meta.demo ? esc(L("Collegato, ma qui c'è ancora l'agenzia di prova: i dati finti non vengono mandati al server."))
        : collegato ? esc(L("Collegato a")) + " " + esc(SYNC.url)
        : SYNC.stato === "muto" ? esc(L("Il server non risponde")) + (SYNC.errore ? " — " + esc(SYNC.errore) : "")
        : esc(L("Questo computer lavora da solo: i dati restano qui."))) +
    '</div>' +
    '<div class="grid g2 mt" style="gap:11px">' +
      campo("sy-url", L("Indirizzo del server"), SYNC.url, "text", { ph:"http://192.168.1.20:7070" }) +
      campo("sy-chiave", L("Parola d'ordine (se c'è)"), SYNC.chiave, "text") +
    '</div>' +
    '<div class="row wrap mt" style="gap:7px">' +
      '<button class="btn pri" data-act="sync-collega">' + ico("sincro") + esc(L("Collega")) + '</button>' +
      (collegato ? '<button class="btn" data-act="sync-adesso">' + esc(L("Aggiorna adesso")) + '</button>' +
        '<button class="btn" data-act="sync-tutto">' + esc(L("Manda tutto al server")) + '</button>' +
        '<button class="btn" data-act="sync-copia">' + ico("giu") + esc(L("Copia del server")) + '</button>' +
        '<button class="btn dang" data-act="sync-stacca">' + esc(L("Stacca")) + '</button>' : "") +
    '</div>' +
    '<div class="sep-line"></div>' +
    '<div class="small muted">' +
      '<b>' + esc(L("Come si accende il server")) + '</b><br>' +
      esc(L("Su un computer dell'ufficio che resta acceso, nella cartella del programma:")) +
      '<div class="mono" style="background:var(--fill-1);padding:7px 9px;border-radius:8px;margin:6px 0">node server.js</div>' +
      esc(L("Scrive lui gli indirizzi da mettere qui. Gli altri computer possono anche aprire direttamente quell'indirizzo nel browser: si collegano da soli.")) +
      '<br><br>' + esc(L("Il server tiene una copia dell'archivio ogni giorno, nella cartella copie. Va tenuto sulla rete dell'ufficio, non aperto su internet.")) +
    '</div>' +
  '</div>';
}
</script>
<script>
/* ============================================================
   11. LE LINGUE IN PIÙ — un file a parte, fuori dal programma
   Il programma ha già cinque lingue dentro di sé e funziona
   anche da solo. Chi vuole aggiungerne un'altra (o correggere
   una parola) mette un file accanto a index.html:

       lingue.js     — window.LINGUE = { ... }   (va bene anche
                       aprendo il programma con un doppio clic)
       lingue.json   — lo stesso, senza involucro (quando il
                       programma è su un sito o sul server)

   oppure lo porta a mano da Impostazioni.

   Se il file manca, è rotto o dice sciocchezze, non succede
   niente di male: si tiene quello che c'era e si va avanti.
   Le frasi senza traduzione restano in italiano.
   ============================================================ */
const LING_KEY = "tourista_lingue";
const LNG_RTL = { ar:true };
const LING = { esito:null, errore:"", dove:"", file:"" };

/* --- mettere in opera un pacchetto di lingue, con prudenza --- */
function lingueApplica(pacco, dove){
  const esito = { lingue:[], voci:0, saltate:0, errore:"", dove:dove || "" };
  try{
    if(!pacco || typeof pacco !== "object" || Array.isArray(pacco)){
      esito.errore = L("Il file non ha la forma giusta");
      return esito;
    }
    const elenco = Array.isArray(pacco.lingue) ? pacco.lingue : [];
    elenco.forEach(l => {
      if(!l || typeof l !== "object" || typeof l.id !== "string" || !/^[a-z]{2}(-[A-Za-z]{2,4})?$/.test(l.id)){
        esito.saltate++; return;
      }
      const id = l.id;
      if(LNG.indexOf(id) < 0) LNG.push(id);
      LNG_NOME[id] = String(l.nome || id);
      LNG_FLAG[id] = String(l.flag || "🌐").slice(0, 8);
      LNG_LOC[id]  = String(l.locale || id);
      if(Array.isArray(l.mesi)    && l.mesi.length    === 12) MESI_ALL[id]    = l.mesi.map(String);
      if(Array.isArray(l.mesi3)   && l.mesi3.length   === 12) MESI3_ALL[id]   = l.mesi3.map(String);
      if(Array.isArray(l.giorni)  && l.giorni.length  === 7)  GIORNI_ALL[id]  = l.giorni.map(String);
      if(Array.isArray(l.giorni2) && l.giorni2.length === 7)  GIORNI2_ALL[id] = l.giorni2.map(String);
      if(l.rtl) LNG_RTL[id] = true;
      if(esito.lingue.indexOf(id) < 0) esito.lingue.push(id);
    });
    const voci = (pacco.voci && typeof pacco.voci === "object") ? pacco.voci : {};
    Object.keys(voci).forEach(frase => {
      const t = voci[frase];
      if(!t || typeof t !== "object"){ esito.saltate++; return; }
      Object.keys(t).forEach(id => {
        const testo = t[id];
        if(typeof testo !== "string" || !testo.trim()) return;      /* le caselle vuote si lasciano stare */
        const i = LNG.indexOf(id);
        if(i < 1){ esito.saltate++; return; }                        /* l'italiano è la chiave, non si traduce */
        if(!Array.isArray(DIZ[frase])) DIZ[frase] = [];
        DIZ[frase][i-1] = testo;
        esito.voci++;
      });
    });
  }catch(e){
    esito.errore = e.message;
  }
  return esito;
}

/* --- quante frasi copre una lingua --- */
function copertura(id){
  const i = LNG.indexOf(id);
  if(i < 1) return { fatte:0, tutte:0 };
  const chiavi = Object.keys(DIZ);
  let fatte = 0;
  chiavi.forEach(k => { const a = DIZ[k]; if(a && typeof a[i-1] === "string" && a[i-1]) fatte++; });
  return { fatte:fatte, tutte:chiavi.length };
}
const lingueInPiu = () => LNG.slice(5);

/* --- il file portato a mano, che resta anche domani --- */
function lingueSalvate(){
  try{ return JSON.parse(localStorage.getItem(LING_KEY)); }catch(e){ return null; }
}
function lingueSalva(pacco){
  try{ localStorage.setItem(LING_KEY, JSON.stringify(pacco)); return true; }
  catch(e){ LING.errore = L("Il file è troppo grande per essere tenuto qui"); return false; }
}

/* --- leggere un file: va bene sia .json sia .js con l'involucro --- */
function lingueLeggiTesto(testo){
  const s = String(testo || "").trim();
  try{ return JSON.parse(s); }catch(e){}
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if(a >= 0 && b > a){
    try{ return JSON.parse(s.slice(a, b + 1)); }catch(e){}
  }
  return null;
}

/* --- all'accensione: prima il file accanto al programma, poi quello portato a mano --- */
function lingueAvvia(){
  const chiudi2 = () => {
    const salvato = lingueSalvate();
    if(salvato){
      const e = lingueApplica(salvato, L("portato a mano"));
      LING.esito = e; LING.errore = e.errore;
    }
    if(LNG_RTL[LANG]) document.documentElement.dir = "rtl";
    if(typeof render === "function") render();
  };
  /* lingue.js — funziona anche col doppio clic sul file */
  const s = document.createElement("script");
  s.src = "./lingue.js";
  s.onload = () => {
    if(window.LINGUE){
      const e = lingueApplica(window.LINGUE, "lingue.js");
      LING.esito = e; LING.errore = e.errore; LING.file = "lingue.js";
    }
    chiudi2();
  };
  s.onerror = () => {
    /* niente lingue.js: si prova lingue.json (quando il programma sta su un sito o sul server) */
    if(location.protocol.indexOf("http") !== 0){ chiudi2(); return; }
    fetch("./lingue.json").then(r => r.ok ? r.json() : null).then(p => {
      if(p){
        const e = lingueApplica(p, "lingue.json");
        LING.esito = e; LING.errore = e.errore; LING.file = "lingue.json";
      }
      chiudi2();
    }).catch(() => chiudi2());
  };
  document.head.appendChild(s);
}

/* --- il modello da riempire --- */
function lingueModello(id, nome, flag, locale){
  const i = LNG.indexOf(id);
  const voci = {};
  Object.keys(DIZ).sort((a,b) => a.localeCompare(b, "it")).forEach(k => {
    const a = DIZ[k];
    voci[k] = {};
    voci[k][id] = (i > 0 && a && typeof a[i-1] === "string") ? a[i-1] : "";
  });
  const base = LNG.indexOf(id) > 0 ? id : "en";
  return {
    "come si usa": "Riempi le caselle vuote. Metti questo file accanto a index.html col nome lingue.json, oppure caricalo da Impostazioni. Le frasi lasciate vuote restano in italiano.",
    lingue: [{
      id: id, nome: nome, flag: flag, locale: locale, rtl: !!LNG_RTL[id],
      mesi:    MESI_ALL[base]    || MESI_ALL.en,
      mesi3:   MESI3_ALL[base]   || MESI3_ALL.en,
      giorni:  GIORNI_ALL[base]  || GIORNI_ALL.en,
      giorni2: GIORNI2_ALL[base] || GIORNI2_ALL.en
    }],
    voci: voci
  };
}

/* --- i tasti --- */
ACT["lingue-aggiungi"] = function(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,.js,application/json,text/javascript";
  inp.onchange = () => {
    const f = inp.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      const pacco = lingueLeggiTesto(r.result);
      if(!pacco){
        LING.errore = L("Il file non si legge: non è né .json né .js con dentro un pacchetto di lingue");
        render(); toast(LING.errore, "err"); return;
      }
      const prova = lingueApplica(pacco, f.name);
      if(prova.errore || (!prova.lingue.length && !prova.voci)){
        LING.errore = prova.errore || L("Nel file non c'è nessuna lingua e nessuna frase");
        render(); toast(LING.errore, "err"); return;
      }
      LING.errore = ""; LING.esito = prova; LING.file = f.name;
      lingueSalva(pacco);
      render();
      toast(LN("{n} frasi caricate", { n: prova.voci }), "ok");
    };
    r.onerror = () => { LING.errore = L("Il file non si legge"); render(); };
    r.readAsText(f);
  };
  inp.click();
};
ACT["lingue-togli"] = function(){
  conferma(L("Tolgo le lingue aggiunte e torno alle cinque di partenza?"), () => {
    try{ localStorage.removeItem(LING_KEY); }catch(e){}
    location.reload();
  }, L("Togli"));
};
ACT["lingue-modello"] = function(){
  const suggerite = [
    ["de","Deutsch","🇩🇪","de-DE"], ["ar","العربية","🇩🇿","ar-DZ"], ["ro","Română","🇷🇴","ro-RO"],
    ["pt","Português","🇵🇹","pt-PT"], ["nl","Nederlands","🇳🇱","nl-NL"], ["ru","Русский","🇷🇺","ru-RU"],
    ["tr","Türkçe","🇹🇷","tr-TR"], ["uk","Українська","🇺🇦","uk-UA"], ["sq","Shqip","🇦🇱","sq-AL"]
  ];
  M_OK = () => {
    const id = String(V("lg-id")).trim().toLowerCase();
    if(!/^[a-z]{2}(-[A-Za-z]{2,4})?$/.test(id)){ toast(L("La sigla va scritta con due lettere, per esempio de"), "err"); return; }
    const p = lingueModello(id, V("lg-nome") || id, V("lg-flag") || "🌐", V("lg-loc") || id);
    scarica("lingue-" + id + ".json", JSON.stringify(p, null, 1));
    toast(L("Modello scaricato: riempilo e ricaricalo qui"), "ok");
  };
  modale(L("Modello per una lingua nuova"),
    '<p class="small muted">' + esc(L("Scarica un file con tutte le frasi del programma da tradurre. Quelle che lasci vuote restano in italiano, così puoi anche fermarti a metà.")) + '</p>' +
    campo("lg-scelta", L("Lingua"), "de", "select", { opts: suggerite.map(x => ({ v:x[0], l:x[2] + " " + x[1] })) }) +
    '<div class="grid g2" style="gap:11px">' +
      campo("lg-id", L("Sigla"), "de", "text", { hint:"de, ar, ro…" }) +
      campo("lg-nome", L("Nome della lingua"), "Deutsch") +
      campo("lg-flag", L("Bandiera"), "🇩🇪") +
      campo("lg-loc", L("Modo di scrivere numeri e date"), "de-DE", "text", { hint:"de-DE, ar-DZ…" }) +
    '</div>',
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + ico("giu") + esc(L("Scarica il modello")) + '</button>');
  const sel = document.getElementById("lg-scelta");
  if(sel) sel.onchange = () => {
    const x = suggerite.find(y => y[0] === sel.value) || suggerite[0];
    document.getElementById("lg-id").value = x[0];
    document.getElementById("lg-nome").value = x[1];
    document.getElementById("lg-flag").value = x[2];
    document.getElementById("lg-loc").value = x[3];
  };
};
ACT["lingue-controlla"] = function(){
  const righe = lingueInPiu().map(id => {
    const c = copertura(id);
    const manca = c.tutte - c.fatte;
    return '<div class="kv"><span>' + LNG_FLAG[id] + " " + esc(LNG_NOME[id]) + '</span>' +
      '<b>' + c.fatte + " / " + c.tutte + (manca ? ' <span class="chip a">' + LN("{n} da fare", { n:manca }) + '</span>' : ' <span class="chip g">' + esc(L("completa")) + '</span>') + '</b></div>';
  }).join("");
  modale(L("Come stanno le lingue"),
    (righe || '<div class="small muted">' + esc(L("Nessuna lingua aggiunta: ci sono solo le cinque di partenza.")) + '</div>') +
    (LING.esito ? '<div class="sep-line"></div><div class="small muted">' +
      esc(LN("Ultimo file: {f} — {v} frasi messe, {s} righe saltate.", {
        f: LING.file || LING.esito.dove || "—", v: LING.esito.voci, s: LING.esito.saltate })) + '</div>' : "") +
    (LING.errore ? '<div class="danger mt">' + esc(LING.errore) + '</div>' : ""),
    undefined, "slim");
};

/* --- il riquadro nelle impostazioni --- */
function cartaLingue(){
  const extra = lingueInPiu();
  return '<div class="sep-line"></div>' +
    '<h3 class="mb">' + esc(L("File delle lingue")) + '</h3>' +
    '<p class="small muted">' + esc(L("Le cinque lingue stanno dentro il programma. Per aggiungerne un'altra, o per cambiare una parola che non ti piace, metti un file lingue.json accanto a index.html oppure caricalo qui.")) + '</p>' +
    (extra.length ? '<div class="mt">' + extra.map(id => {
        const c = copertura(id);
        return '<div class="kv"><span>' + LNG_FLAG[id] + " " + esc(LNG_NOME[id]) + '</span>' +
          '<b class="small">' + c.fatte + " / " + c.tutte + '</b></div>';
      }).join("") + '</div>' : "") +
    (LING.errore ? '<div class="danger mt">' + esc(LING.errore) + '</div>' : "") +
    (!LING.errore && LING.file ? '<div class="ok-box mt">' + esc(LN("Caricato: {f}", { f: LING.file })) + '</div>' : "") +
    '<div class="row wrap mt" style="gap:7px">' +
      '<button class="btn" data-act="lingue-aggiungi">' + ico("su") + esc(L("Carica un file")) + '</button>' +
      '<button class="btn" data-act="lingue-modello">' + ico("giu") + esc(L("Scarica il modello")) + '</button>' +
      '<button class="btn ghost" data-act="lingue-controlla">' + esc(L("Controlla")) + '</button>' +
      (extra.length ? '<button class="btn dang" data-act="lingue-togli">' + esc(L("Togli")) + '</button>' : "") +
    '</div>';
}
</script>
<script>
/* ============================================================
   11. LA FATTURA — polacca, per uso interno
   Non manda niente a nessuno: fa il documento, lo stampa e lo
   tiene in archivio. Serve per dare la fattura al cliente e per
   passare i conti al commercialista.
   Per i pacchetti dell'agenzia usa la procedura del margine
   (art. 119 ustawy o VAT): la fattura non espone l'IVA e porta
   scritta la dicitura, come vuole la legge polacca.
   ============================================================ */
const FAT_TIPI = [
  { v:"faktura", l:"Fattura" },
  { v:"korekta", l:"Fattura di rettifica" },
  { v:"proforma", l:"Proforma" }
];
/* le aliquote polacche, più i casi senza IVA */
const FAT_ALIQUOTE = [
  { v:"marza", l:"procedura del margine (art. 119)", n:0 },
  { v:"23",    l:"23%", n:23 },
  { v:"8",     l:"8%",  n:8 },
  { v:"5",     l:"5%",  n:5 },
  { v:"0",     l:"0%",  n:0 },
  { v:"zw",    l:"esente (zw.)", n:0 },
  { v:"np",    l:"fuori campo (np.)", n:0 }
];
const FAT_PAG = [
  { v:"przelew",  l:"Bonifico" },
  { v:"gotowka",  l:"Contanti" },
  { v:"karta",    l:"Carta" },
  { v:"blik",     l:"BLIK" },
  { v:"pobranie", l:"Alla consegna" }
];
const FAT_STATI = ["bozza","emessa","pagata","stornata"];
const RIF_MARGINE = "Procedura marży dla biur podróży — art. 119 ustawy o VAT";

/* --- numeri --- */
const d2 = n => Math.round((Number(n) || 0) * 100) / 100;
const x2 = n => d2(n).toFixed(2);
const aliqN = v => { const a = FAT_ALIQUOTE.find(x=> x.v === String(v)); return a ? a.n : 0; };
const aliqLab = v => { const a = FAT_ALIQUOTE.find(x=> x.v === String(v)); return a ? L(a.l) : String(v); };
const senzaIva = v => ["marza","zw","np","0"].indexOf(String(v)) >= 0;

/* --- l'elenco --- */
function fatture(){ return (DB.fatture = DB.fatture || []); }
const fatById = id => byId(fatture(), id);
function fatAnno(f){ return String(f.data || today()).slice(0, 4); }
function fatNumeroNuovo(anno){
  const n = fatture().filter(f=> fatAnno(f) === String(anno))
    .map(f=> parseInt(String(f.numero).replace(/\D.*$/, ""), 10) || 0);
  return (n.length ? Math.max.apply(null, n) : 0) + 1;
}
const fatCodice = f => f.numero + "/" + fatAnno(f);

/* --- i conti --- */
function fatRigaNetto(r){ return d2(nz(r.qta || 1) * nz(r.prezzo)); }
function fatRigaIva(r){ return d2(fatRigaNetto(r) * aliqN(r.aliquota) / 100); }
function fatRiepiloghi(f){
  const m = {};
  (f.righe || []).forEach(r=>{
    const k = String(r.aliquota || "marza");
    if(!m[k]) m[k] = { aliquota: k, netto: 0, iva: 0 };
    m[k].netto = d2(m[k].netto + fatRigaNetto(r));
    m[k].iva   = d2(m[k].iva + fatRigaIva(r));
  });
  return Object.keys(m).map(k=> m[k]).sort((a,b)=> aliqN(a.aliquota) - aliqN(b.aliquota));
}
function fatNetto(f){ return d2(sum(fatRiepiloghi(f).map(r=> r.netto))); }
function fatIva(f){ return d2(sum(fatRiepiloghi(f).map(r=> r.iva))); }
function fatTotale(f){ return d2(fatNetto(f) + fatIva(f)); }
function fatConMargine(f){ return (f.righe || []).some(r=> String(r.aliquota) === "marza"); }

/* --- l'importo scritto in lettere, come si usa in Polonia --- */
const PL_U = ["zero","jeden","dwa","trzy","cztery","pięć","sześć","siedem","osiem","dziewięć",
  "dziesięć","jedenaście","dwanaście","trzynaście","czternaście","piętnaście","szesnaście","siedemnaście","osiemnaście","dziewiętnaście"];
const PL_D = ["","","dwadzieścia","trzydzieści","czterdzieści","pięćdziesiąt","sześćdziesiąt","siedemdziesiąt","osiemdziesiąt","dziewięćdziesiąt"];
const PL_S = ["","sto","dwieście","trzysta","czterysta","pięćset","sześćset","siedemset","osiemset","dziewięćset"];
function plTre(n){
  if(!n) return "";
  const s = Math.floor(n / 100), r = n % 100, d = Math.floor(r / 10), u = r % 10;
  let out = [];
  if(s) out.push(PL_S[s]);
  if(r < 20 && r) out.push(PL_U[r]);
  else { if(d) out.push(PL_D[d]); if(u) out.push(PL_U[u]); }
  return out.join(" ");
}
/* forma giusta di "tysiąc" e "złoty": in polacco cambia col numero */
function plForma(n, a, b, c){
  const u = n % 10, d = n % 100;
  if(n === 1) return a;
  if(u >= 2 && u <= 4 && !(d >= 12 && d <= 14)) return b;
  return c;
}
function plSlownie(v){
  const tot = Math.round(nz(v) * 100);
  let zl = Math.floor(tot / 100), gr = tot % 100;
  if(zl === 0) return "zero złotych " + String(gr).padStart(2,"0") + "/100";
  const parti = [];
  const mln = Math.floor(zl / 1000000), tys = Math.floor((zl % 1000000) / 1000), res = zl % 1000;
  /* in polacco non si dice "jeden tysiąc": si dice "tysiąc" e basta */
  if(mln) parti.push((mln === 1 ? "" : plTre(mln) + " ") + plForma(mln, "milion", "miliony", "milionów"));
  if(tys) parti.push((tys === 1 ? "" : plTre(tys) + " ") + plForma(tys, "tysiąc", "tysiące", "tysięcy"));
  if(res) parti.push(plTre(res));
  return parti.join(" ") + " " + plForma(zl, "złoty", "złote", "złotych") + " " + String(gr).padStart(2,"0") + "/100";
}

/* --- il controllo prima di stampare --- */
function fatProblemi(f){
  const p = [], a = DB.meta.agenzia || {};
  const nip = s => /^\d{10}$/.test(String(s || "").replace(/[^0-9]/g, ""));
  if(!a.nome) p.push(L("Manca il nome dell'agenzia (Impostazioni)"));
  if(!nip(a.piva)) p.push(L("Il NIP dell'agenzia deve avere dieci cifre (Impostazioni)"));
  if(!a.indirizzo) p.push(L("Manca l'indirizzo dell'agenzia (Impostazioni)"));
  if(!a.comune) p.push(L("Manca il comune dell'agenzia (Impostazioni)"));

  const c = f.cliente || {};
  if(!c.nome) p.push(L("Manca il nome o la ragione sociale del cliente"));
  if(!c.indirizzo) p.push(L("Manca l'indirizzo del cliente"));
  if(!c.comune) p.push(L("Manca il comune del cliente"));
  if(c.azienda && !nip(c.nip)) p.push(L("Per un'azienda serve il NIP di dieci cifre"));

  if(!f.numero) p.push(L("Manca il numero della fattura"));
  if(!f.data) p.push(L("Manca la data della fattura"));
  if(!f.dataVendita) p.push(L("Manca la data della prestazione"));
  if(!(f.righe || []).length) p.push(L("La fattura non ha nessuna riga"));
  (f.righe || []).forEach((r, i)=>{
    if(!String(r.desc || "").trim()) p.push(LN("La riga {n} non ha la descrizione", { n: i + 1 }));
  });
  if(fatTotale(f) <= 0 && f.tipo !== "korekta") p.push(L("Il totale della fattura è zero"));
  return p;
}

/* --- fare una fattura --- */
function fatDaCliente(c){
  if(!c) return { nome:"", nazione:"PL" };
  return {
    nome: c.nome || "", azienda: c.tipo !== "privato",
    nip: c.nip || c.piva || "", indirizzo: c.indirizzo || "",
    cap: c.cap || "", comune: c.comune || c.citta || "",
    nazione: c.nazione || "PL", email: c.email || ""
  };
}
function fatNuovaDaPratica(pr){
  const dep = depById(pr.depId), cli = cliById(pr.clienteId);
  const anno = String(today()).slice(0, 4);
  const quanti = (pr.pax || []).length;
  return {
    id: uid("fa"), numero: fatNumeroNuovo(anno), data: today(),
    dataVendita: dep ? dep.fine : today(), tipo: "faktura",
    clienteId: pr.clienteId, praticaId: pr.id,
    cliente: fatDaCliente(cli),
    righe: [{
      id: uid("fr"),
      desc: (dep ? dep.titolo + " — " + L("partenza") + " " + dLong(dep.inizio) : L("Viaggio di gruppo")) +
        (quanti ? " — " + LN("{n} persone", { n: quanti }) : ""),
      qta: 1, prezzo: d2(pratTotale(pr, dep)), aliquota: "marza"
    }],
    nota: "", causale: L("Pratica") + " " + pr.codice,
    pagamento: { modo:"przelew", scadenza: pratScadenzaSaldo(pr, dep) || "",
                 iban: (DB.meta.agenzia || {}).iban || "" },
    stato: "bozza", perche: "", creata: today()
  };
}

/* --- la schermata: l'elenco --- */
let F_FAT = "tutte";
VISTE.fatture = function(){
  const tutte = fatture().slice().sort((a,b)=> (b.data + String(b.numero).padStart(6,"0")).localeCompare(a.data + String(a.numero).padStart(6,"0")));
  const F = F_FAT === "tutte" ? tutte : tutte.filter(f=> f.stato === F_FAT);
  const anno = String(today()).slice(0, 4);
  const diQuestAnno = tutte.filter(f=> fatAnno(f) === anno && f.tipo !== "proforma");
  const giro = d2(sum(diQuestAnno.filter(f=> f.tipo === "faktura").map(f=> fatTotale(f)))) -
               d2(sum(diQuestAnno.filter(f=> f.tipo === "korekta").map(f=> fatTotale(f))));
  const daPagare = d2(sum(tutte.filter(f=> f.stato === "emessa").map(f=> fatTotale(f))));

  intesta(L("Fatture"), LN("{n} nel {anno}", { n: diQuestAnno.length, anno: anno }),
    '<button class="btn pri" data-act="fat-nuova">' + ico("piu") + '<span class="nowrap">' + esc(L("Nuova fattura")) + '</span></button>');

  if(!tutte.length) return '<div class="stack">' +
    vuoto(L("Nessuna fattura, per ora"),
      '<button class="btn pri mt" data-act="fat-nuova">' + esc(L("Fai la prima fattura")) + '</button>') +
    '<div class="card pad"><h3>' + esc(L("Come funziona")) + '</h3>' +
      '<ol class="small" style="padding-left:18px;line-height:1.7">' +
        '<li>' + esc(L("Parti da una pratica già confermata: i dati del viaggio e l'importo li mette lui.")) + '</li>' +
        '<li>' + esc(L("Controlla i dati del cliente: nome, indirizzo e NIP se è un'azienda.")) + '</li>' +
        '<li>' + esc(L("Stampa la fattura e dalla al cliente. Una copia resta qui in archivio.")) + '</li>' +
        '<li>' + esc(L("Quando il cliente paga, segna la fattura come pagata.")) + '</li>' +
      '</ol>' +
      '<p class="small muted mt">' + esc(L("È una fattura per uso interno: il programma non la manda a nessun ufficio. Quando servirà il KSeF si aggiunge.")) + '</p>' +
    '</div></div>';

  return '<div class="stack">' +
    '<div class="grid g3">' +
      kpi(L("Fatturato") + " " + anno, eur(giro, 0), esc(LN("{n} documenti", { n: diQuestAnno.length }))) +
      kpi(L("Da incassare"), eur(daPagare, 0), esc(LN("{n} fatture aperte", { n: tutte.filter(f=> f.stato === "emessa").length }))) +
      kpi(L("Bozze"), String(tutte.filter(f=> f.stato === "bozza").length), esc(L("ancora da emettere"))) +
    '</div>' +
    '<div class="row wrap"><div class="btn-group">' +
      ["tutte"].concat(FAT_STATI).map(s=>
        '<button class="' + (F_FAT === s ? "on" : "") + '" data-ch="f-fat" data-v="' + esc(s) + '">' + esc(L(s)) + '</button>').join("") +
    '</div></div>' +
    '<div class="card scroll-x"><table class="tbl"><thead><tr>' +
      '<th>' + esc(L("Numero")) + '</th><th>' + esc(L("Data")) + '</th><th>' + esc(L("Cliente")) + '</th>' +
      '<th class="num">' + esc(L("Totale")) + '</th><th>' + esc(L("Stato")) + '</th></tr></thead><tbody>' +
      (F.length ? F.map(f=>
        '<tr data-go="fattura/' + f.id + '" style="cursor:pointer">' +
          '<td><b>' + esc(fatCodice(f)) + '</b>' +
            (f.tipo !== "faktura" ? ' <span class="chip ' + (f.tipo === "korekta" ? "r" : "") + '">' + esc(L((FAT_TIPI.find(t=> t.v === f.tipo) || {}).l || f.tipo)) + '</span>' : "") + '</td>' +
          '<td class="nowrap">' + esc(dShort(f.data)) + "/" + esc(fatAnno(f)) + '</td>' +
          '<td class="trunc">' + esc((f.cliente || {}).nome || "—") + '</td>' +
          '<td class="num">' + eur(fatTotale(f)) + '</td>' +
          '<td><span class="chip ' + (f.stato === "pagata" ? "g" : f.stato === "stornata" ? "r" : f.stato === "emessa" ? "b" : "") + '">' +
            esc(L(f.stato)) + '</span></td>' +
        '</tr>').join("")
        : '<tr><td colspan="5" class="muted center pad">' + esc(L("Niente con questo filtro")) + '</td></tr>') +
    '</tbody></table></div>' +
  '</div>';
};

/* --- la schermata: una fattura --- */
VISTE.fattura = function(id){
  const f = fatById(id);
  if(!f) return vuoto(L("Questa fattura non c'è più"), '<button class="btn mt" data-go="fatture">' + esc(L("Torna alle fatture")) + '</button>');
  const problemi = fatProblemi(f);
  const riep = fatRiepiloghi(f);
  const c = f.cliente || {};
  const pronta = !problemi.length;

  intesta(esc(L("Fattura")) + " " + fatCodice(f), (c.nome || ""),
    '<button class="btn ' + (pronta ? "pri" : "") + '" data-act="stampa" data-doc="fattura" data-id="' + f.id + '">' + ico("stampa") + '<span class="nowrap">' + esc(L("Stampa")) + '</span></button>');

  return '<div class="stack">' +
    (problemi.length
      ? '<div class="card pad"><div class="danger">' + esc(LN("Manca ancora qualcosa ({n})", { n: problemi.length })) + '</div>' +
        '<ul class="small mt">' + problemi.map(p=> "<li>" + esc(p) + "</li>").join("") + '</ul></div>'
      : '<div class="card pad"><div class="ok-box">' + esc(L("La fattura è a posto")) + '</div>' +
        '<div class="small muted mt">' + esc(L("Puoi stamparla e darla al cliente.")) + '</div></div>') +

    '<div class="grid g2">' +
      '<div class="card pad">' +
        '<div class="row mb"><h3 style="flex:1">' + esc(L("Il documento")) + '</h3>' +
          '<button class="btn ghost sm" data-act="fat-testa" data-id="' + f.id + '">' + esc(L("Modifica")) + '</button></div>' +
        riga(L("Tipo"), esc(L((FAT_TIPI.find(t=> t.v === f.tipo) || FAT_TIPI[0]).l))) +
        riga(L("Numero"), esc(fatCodice(f))) +
        riga(L("Data della fattura"), esc(dLong(f.data))) +
        riga(L("Data della prestazione"), esc(f.dataVendita ? dLong(f.dataVendita) : "—")) +
        riga(L("Stato"), '<span class="chip ' + (f.stato === "pagata" ? "g" : f.stato === "stornata" ? "r" : "") + '">' + esc(L(f.stato)) + '</span>') +
        (f.causale ? riga(L("Causale"), esc(f.causale)) : "") +
      '</div>' +
      '<div class="card pad">' +
        '<div class="row mb"><h3 style="flex:1">' + esc(L("Il cliente")) + '</h3>' +
          '<button class="btn ghost sm" data-act="fat-cliente" data-id="' + f.id + '">' + esc(L("Modifica")) + '</button></div>' +
        riga(L("Nome"), esc(c.nome || "—")) +
        (c.nip ? riga("NIP", esc(c.nip)) : "") +
        riga(L("Indirizzo"), esc(c.indirizzo || "—")) +
        riga(L("Comune"), esc([c.cap, c.comune].filter(Boolean).join(" ") || "—")) +
        (c.nazione && c.nazione !== "PL" ? riga(L("Nazione"), esc(c.nazione)) : "") +
        (c.email ? riga("Email", esc(c.email)) : "") +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="row pad" style="padding-bottom:0"><h3 style="flex:1">' + esc(L("Le righe")) + '</h3>' +
        '<button class="btn sm" data-act="fat-riga" data-id="' + f.id + '">' + ico("piu") + esc(L("Aggiungi riga")) + '</button></div>' +
      '<div class="scroll-x"><table class="tbl"><thead><tr><th>' + esc(L("Descrizione")) + '</th>' +
        '<th class="num">' + esc(L("Qtà")) + '</th><th class="num">' + esc(L("Prezzo")) + '</th>' +
        '<th class="num">' + esc(L("Netto")) + '</th><th>' + esc(L("IVA")) + '</th>' +
        '<th class="num">' + esc(L("Lordo")) + '</th><th></th></tr></thead><tbody>' +
        (f.righe || []).map(r=>
          '<tr><td>' + esc(r.desc) + '</td>' +
            '<td class="num">' + esc(String(r.qta || 1)) + '</td>' +
            '<td class="num">' + eur(r.prezzo) + '</td>' +
            '<td class="num">' + eur(fatRigaNetto(r)) + '</td>' +
            '<td><span class="chip">' + esc(aliqLab(r.aliquota)) + '</span></td>' +
            '<td class="num"><b>' + eur(fatRigaNetto(r) + fatRigaIva(r)) + '</b></td>' +
            '<td class="num nowrap">' +
              '<button class="btn ghost sm" data-act="fat-riga" data-id="' + f.id + '" data-r="' + r.id + '">' + ico("matita") + '</button>' +
              '<button class="btn ghost sm" data-act="fat-riga-via" data-id="' + f.id + '" data-r="' + r.id + '">' + ico("cestino") + '</button>' +
            '</td></tr>').join("") +
      '</tbody></table></div>' +
      '<div class="pad">' +
        riep.map(r=> riga(LN("Netto {a}", { a: aliqLab(r.aliquota) }),
          eur(r.netto) + (r.iva ? '  <span class="muted">+ ' + eur(r.iva) + " " + esc(L("di IVA")) + '</span>' : ""))).join("") +
        riga(L("Totale da pagare"), "<b>" + eur(fatTotale(f)) + "</b>", "tot") +
        '<div class="small muted mt">' + esc(L("In lettere")) + ': ' + esc(plSlownie(fatTotale(f))) + '</div>' +
        (fatConMargine(f) ? '<div class="small muted mt">' + esc(RIF_MARGINE) + '</div>' : "") +
      '</div>' +
    '</div>' +

    '<div class="card pad">' +
      '<div class="row mb"><h3 style="flex:1">' + esc(L("Il pagamento")) + '</h3>' +
        '<button class="btn ghost sm" data-act="fat-pag" data-id="' + f.id + '">' + esc(L("Modifica")) + '</button></div>' +
      riga(L("Modo"), esc(L((FAT_PAG.find(x=> x.v === (f.pagamento || {}).modo) || FAT_PAG[0]).l))) +
      ((f.pagamento || {}).scadenza ? riga(L("Scadenza"), esc(dLong(f.pagamento.scadenza))) : "") +
      ((f.pagamento || {}).iban ? riga(L("Conto"), '<span class="mono tiny">' + esc(f.pagamento.iban) + '</span>') : "") +
    '</div>' +

    '<div class="card pad">' +
      '<h3>' + esc(L("A che punto è")) + '</h3>' +
      '<div class="btn-group mt">' + FAT_STATI.map(s=>
        '<button class="' + (f.stato === s ? "on" : "") + '" data-act="fat-stato" data-id="' + f.id + '" data-v="' + esc(s) + '">' + esc(L(s)) + '</button>').join("") + '</div>' +
      (f.perche ? '<div class="small muted mt">' + esc(f.perche) + '</div>' : "") +
      '<div class="row mt">' +
        (f.tipo === "faktura" ? '<button class="btn sm" data-act="fat-nota" data-id="' + f.id + '">' + esc(L("Fai la fattura di rettifica")) + '</button>' : "") +
        '<div class="sp"></div>' +
        '<button class="btn ghost sm" data-act="fat-via" data-id="' + f.id + '">' + esc(L("Elimina")) + '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
};

/* --- le azioni --- */
ACT["fat-nuova"] = function(){
  const pronte = DB.pratiche.filter(p=> p.stato === "confermata" || p.stato === "saldata");
  M_OK = ()=>{
    const pid = V("fn-pr");
    let f;
    if(pid){
      const pr = praById(pid);
      if(!pr){ toast(L("Pratica non trovata"), "err"); return; }
      f = fatNuovaDaPratica(pr);
    } else {
      const anno = String(today()).slice(0, 4);
      f = { id: uid("fa"), numero: fatNumeroNuovo(anno), data: today(), dataVendita: today(), tipo:"faktura",
        clienteId:"", praticaId:"", cliente: { nome:"", nazione:"PL" },
        righe: [], nota:"", causale:"",
        pagamento: { modo:"przelew", scadenza:"", iban:(DB.meta.agenzia||{}).iban || "" },
        stato:"bozza", perche:"", creata: today() };
    }
    fatture().push(f); save(); vai("fattura", f.id);
    toast(L("Fattura creata"), "ok");
  };
  modale(L("Nuova fattura"),
    campo("fn-pr", L("Da quale pratica?"), "", "select", {
      opts: [{ v:"", l: L("— nessuna, la scrivo a mano —") }].concat(pronte.map(p=>{
        const d = depById(p.depId);
        return { v: p.id, l: p.codice + " · " + nomeC(p.clienteId) + " · " + (d ? d.titolo : "") + " · " + eur(pratTotale(p, d), 0) };
      })),
      hint: L("Partendo da una pratica, importo e descrizione li scrive lui.") }),
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Crea")) + '</button>');
};

ACT["fat-testa"] = function(e, el){
  const f = fatById(el.dataset.id);
  M_OK = ()=>{
    f.tipo = V("ft-tipo"); f.numero = V("ft-num");
    f.data = V("ft-data"); f.dataVendita = V("ft-datav");
    f.causale = V("ft-cau");
    save(); render(); toast(L("Salvato"), "ok");
  };
  modale(L("Il documento"),

<script>
/* ============================================================
   12. I PREVENTIVI PER LE COMITIVE
   Il preventivo si fa prima che la partenza esista: si mettono
   i costi, si dice quanto si vuole guadagnare e lui dice quanto
   chiedere a testa, quante persone servono per non rimetterci
   e come cambia il prezzo se il gruppo cresce o cala.
   Quando il gruppo dice di sì, diventa una partenza vera.
   ============================================================ */
const STATI_PRE = ["bozza","inviato","accettato","perso"];

function preventivi(){ return (DB.preventivi = DB.preventivi || []); }
const preById = id => byId(preventivi(), id);

function preNumeroNuovo(){
  const anno = String(today()).slice(0, 4);
  const n = preventivi().filter(p=> String(p.data).slice(0,4) === anno)
    .map(p=> parseInt(String(p.numero).replace(/\D.*$/, ""), 10) || 0);
  return (n.length ? Math.max.apply(null, n) : 0) + 1;
}
const preCodice = p => "P" + String(p.data).slice(0,4) + "-" + String(p.numero).padStart(3, "0");

/* i conti sono gli stessi delle partenze: un preventivo ha costi, quota e posti */
function prePrezzoConsigliato(p){
  const costo = costoPP(p, nz(p.pax) || 1);
  const q = costo * (1 + nz(p.ricarico) / 100);
  return Math.ceil(q / 5) * 5;         /* arrotondato ai 5 € sopra */
}
function preMargine(p, n){
  const quanti = n === undefined ? nz(p.pax) : n;
  return d2(nz(p.quota) * quanti - costoTot(p, quanti));
}
function preScala(p){
  /* come cambia il conto se il gruppo cresce o cala */
  const base = nz(p.pax) || 1;
  const punti = [];
  [-10, -5, 0, 5, 10].forEach(k=>{
    const n = base + k;
    if(n < 2 || punti.some(x=> x.n === n)) return;
    punti.push({ n:n, costo: costoPP(p, n), quota: nz(p.quota), margine: preMargine(p, n) });
  });
  return punti;
}

/* --- fare un preventivo --- */
function preNuovo(base){
  const b = base || {};
  return Object.assign({
    id: uid("pv"), numero: preNumeroNuovo(), data: today(),
    richiestaId: "", clienteId: "",
    cliente: { nome:"", ref:"", tel:"", email:"" },
    titolo: "", dest: "", flag: "🌍", giorni: 5, notti: 4, mezzo: "bus",
    quando: "", partenzaDa: (DB.meta.agenzia || {}).comune || "",
    pax: 40, posti: 40, costi: [], ricarico: nz(DB.meta.ricarico) || 28, quota: 0,
    incluso: [], nonIncluso: [], note: "",
    validoFino: addDays(today(), 30), stato: "bozza", creato: today()
  }, b);
}
function preDaRichiesta(r){
  const p = preNuovo({
    richiestaId: r.id,
    cliente: { nome: r.nome, ref: r.ref || "", tel: r.tel || "", email: r.email || "" },
    titolo: r.dest, dest: r.dest, pax: nz(r.pax) || 30, posti: nz(r.pax) || 30,
    quando: r.periodo || "", note: r.note || ""
  });
  return p;
}
/* dal catalogo: si copiano titolo, giorni e mezzo di un viaggio già pronto */
function preDaPacchetto(p, pk){
  p.titolo = pk.nome; p.dest = pk.dest; p.flag = pk.flag || "🌍";
  p.giorni = nz(pk.giorni) || p.giorni; p.notti = nz(pk.notti) || p.notti;
  p.mezzo = pk.mezzo || p.mezzo;
  return p;
}

/* --- l'elenco --- */
let F_PRE = "tutti";
VISTE.preventivi = function(){
  const tutti = preventivi().slice().sort((a,b)=> (b.data + String(b.numero)).localeCompare(a.data + String(a.numero)));
  const P = F_PRE === "tutti" ? tutti : tutti.filter(p=> p.stato === F_PRE);
  const aperti = tutti.filter(p=> p.stato === "bozza" || p.stato === "inviato");
  const vinti = tutti.filter(p=> p.stato === "accettato");
  const persi = tutti.filter(p=> p.stato === "perso");
  const resa = (vinti.length + persi.length) ? Math.round(vinti.length / (vinti.length + persi.length) * 100) : 0;

  intesta(L("Preventivi"), LN("{n} aperti", { n: aperti.length }),
    '<button class="btn pri" data-act="pre-nuovo">' + ico("piu") + '<span class="nowrap">' + esc(L("Nuovo preventivo")) + '</span></button>');

  if(!tutti.length) return '<div class="stack">' +
    vuoto(L("Nessun preventivo, per ora"),
      '<button class="btn pri mt" data-act="pre-nuovo">' + esc(L("Fai il primo preventivo")) + '</button>') +
    '<div class="card pad"><h3>' + esc(L("A che serve")) + '</h3>' +
      '<p class="small muted">' + esc(L("Quando una comitiva chiede «quanto ci costa?», il viaggio non esiste ancora. Qui metti i costi che ti danno i fornitori, dici quanto vuoi guadagnare e lui ti dice la quota da chiedere, quante persone servono per non rimetterci e come cambia tutto se il gruppo cresce o cala.")) + '</p>' +
      '<p class="small muted mt">' + esc(L("Quando il gruppo dice di sì, il preventivo diventa una partenza vera con un clic: costi e quota si portano dietro.")) + '</p>' +
    '</div></div>';

  return '<div class="stack">' +
    '<div class="grid g3">' +
      kpi(L("Aperti"), String(aperti.length), esc(L("in attesa di risposta"))) +
      kpi(L("Vinti"), String(vinti.length), esc(LN("su {n} chiusi", { n: vinti.length + persi.length }))) +
      kpi(L("Ne vinciamo"), resa + "%", esc(L("dei preventivi chiusi"))) +
    '</div>' +
    '<div class="row wrap"><div class="btn-group">' +
      ["tutti"].concat(STATI_PRE).map(s=>
        '<button class="' + (F_PRE === s ? "on" : "") + '" data-ch="f-pre" data-v="' + esc(s) + '">' + esc(L(s)) + '</button>').join("") +
    '</div></div>' +
    '<div class="grid g-auto">' +
      (P.length ? P.map(p=>{
        const scaduto = p.stato === "inviato" && p.validoFino && toGo(p.validoFino) < 0;
        return '<div class="card pad" data-go="preventivo/' + p.id + '" style="cursor:pointer">' +
          '<div class="row mb"><span style="font-size:22px">' + esc(p.flag || "🌍") + '</span>' +
            '<div style="min-width:0;flex:1"><b class="trunc" style="display:block">' + esc(p.titolo || p.dest || L("senza titolo")) + '</b>' +
            '<span class="tiny dim">' + esc(preCodice(p)) + ' · ' + esc((p.cliente || {}).nome || "—") + '</span></div>' +
            '<span class="chip ' + (p.stato === "accettato" ? "g" : p.stato === "perso" ? "n" : p.stato === "inviato" ? "b" : "a") + '">' + esc(L(p.stato)) + '</span></div>' +
          '<div class="row wrap" style="gap:6px">' +
            '<span class="chip">' + nz(p.pax) + ' ' + esc(L("pax")) + '</span>' +
            '<span class="chip">' + esc(LN("{n} giorni", { n: nz(p.giorni) })) + '</span>' +
            (p.quota ? '<span class="chip b">' + eur(p.quota, 0) + ' ' + esc(L("a testa")) + '</span>' : '<span class="chip a">' + esc(L("quota da mettere")) + '</span>') +
          '</div>' +
          (scaduto ? '<div class="chip r mt">' + esc(L("scaduto")) + '</div>'
                   : (p.validoFino ? '<div class="tiny dim mt">' + esc(L("valido fino al")) + ' ' + esc(dLong(p.validoFino)) + '</div>' : "")) +
        '</div>';
      }).join("") : vuoto(L("Niente con questo filtro"))) +
    '</div>' +
  '</div>';
};

/* --- il preventivo --- */
VISTE.preventivo = function(id){
  const p = preById(id);
  if(!p) return vuoto(L("Questo preventivo non c'è più"),
    '<button class="btn mt" data-go="preventivi">' + esc(L("Torna ai preventivi")) + '</button>');
  const n = nz(p.pax) || 1;
  const costo = costoPP(p, n);
  const consigliata = prePrezzoConsigliato(p);
  const quota = nz(p.quota);
  const marg = preMargine(p);
  const margPct = quota * n ? marg / (quota * n) * 100 : 0;
  const pari = pareggio(p);
  const gr = gratuita(p, n);

  intesta(esc(p.titolo || p.dest || L("Preventivo")), preCodice(p) + " · " + ((p.cliente || {}).nome || ""),
    '<button class="btn" data-act="pre-copia" data-id="' + p.id + '">' + ico("copia") + '<span class="nowrap">' + esc(L("Duplica")) + '</span></button>' +
    '<button class="btn" data-act="stampa" data-doc="preventivo" data-id="' + p.id + '">' + ico("stampa") + '<span class="nowrap">' + esc(L("Stampa")) + '</span></button>' +
    (p.stato === "accettato" && !p.depId
      ? '<button class="btn pri" data-act="pre-parte" data-id="' + p.id + '">' + ico("mappa") + '<span class="nowrap">' + esc(L("Apri la partenza")) + '</span></button>'
      : ''));

  return '<div class="stack">' +
    (p.depId ? '<div class="card pad"><div class="ok-box">' + esc(L("Questo preventivo è diventato una partenza")) + '</div>' +
      '<button class="btn mt" data-go="partenza/' + p.depId + '">' + esc(L("Vai alla partenza")) + ' →</button></div>' : "") +

    '<div class="grid g3">' +
      kpi(L("Costo a persona"), eur(costo, 0), esc(LN("con {n} persone", { n:n }))) +
      kpi(L("Quota consigliata"), eur(consigliata, 0), esc(LN("ricarico {n}%", { n: nz(p.ricarico) }))) +
      kpi(quota ? L("Margine") : L("Quota da mettere"),
        quota ? eur(marg, 0) : "—",
        quota ? esc(Math.round(margPct) + "% " + L("sul venduto")) : esc(L("mettila qui sotto")), quota && marg > 0 ? "br" : "") +
    '</div>' +

    '<div class="grid g2" style="align-items:start">' +
      '<div class="stack">' +

        '<div class="card">' +
          '<div class="card-h">' + ico("mappa") + '<h3>' + esc(L("Il viaggio")) + '</h3><div class="sp"></div>' +
            '<button class="btn ghost sm" data-act="pre-testa" data-id="' + p.id + '">' + esc(L("Modifica")) + '</button></div>' +

ACT["pre-nuovo"] = function(){

ACT["pre-stato"] = function(e, el){
  const p = preById(el.dataset.id);
  const s = el.dataset.v;
  if(s === "perso"){
    M_OK = ()=>{
      p.stato = "perso"; p.perche = V("ps-perche");
      const r = (DB.richieste || []).find(x=> x.id === p.richiestaId);
      if(r) r.stato = "persa";
      save(); render(); toast(L("Segnato come perso"), "ok");
    };
    modale(L("Perché l'abbiamo perso"),
      campo("ps-perche", L("Che cosa è successo"), p.perche || "", "textarea", { rows:3,
        ph: L("per esempio: 40 € in meno a testa dall'agenzia di Lecco") }),
      '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
      '<button class="btn pri" data-act="ok">' + esc(L("Salva")) + '</button>', "slim");
    return;
  }
  p.stato = s;
  if(s !== "perso") p.perche = "";
  const r = (DB.richieste || []).find(x=> x.id === p.richiestaId);
  if(r){
    if(s === "inviato") r.stato = "preventivo inviato";

  }
  save(); render();
  if(s === "accettato") toast(L("Bene: adesso puoi aprire la partenza"), "ok");
};

ACT["pre-parte"] = function(e, el){

  M_OK = ()=>{

    const d = {
      id: uid("dp"), pacchettoId: "", titolo: p.titolo || p.dest, dest: p.dest, flag: p.flag || "🌍",
      inizio: inizio, fine: fine, stato: "vendita",
      posti: Math.max(nz(p.pax), VN("pp-posti")), minimo: nz(p.pax),
      quota: nz(p.quota), mezzo: p.mezzo, partenzaDa: p.partenzaDa || "",
      accompagnatore: "", note: p.note || "",
      costi: (p.costi || []).map(c=> Object.assign({}, c, { id: uid("co") })),
      supplementi: [], bus: { file: Math.ceil(Math.max(nz(p.pax), VN("pp-posti")) / 4), bloccati: [] },
      incluso: (p.incluso || []).slice(), nonIncluso: (p.nonIncluso || []).slice(),
      programma: [], creata: today()
    };
    DB.partenze.push(d);
    p.depId = d.id;

    toast(L("Partenza aperta: adesso puoi vendere i posti"), "ok");

  modale(L("Apri la partenza"),
    '<p class="small muted">' + esc(L("Costi, quota e cosa comprende si portano dietro da soli. Servono solo le date.")) + '</p>' +
    '<div class="grid g2" style="gap:11px">' +

    '<button class="btn pri" data-act="ok">' + esc(L("Apri la partenza")) + '</button>');

/* dalla richiesta: fa il preventivo con i dati già dentro */
ACT["pre-da-richiesta"] = function(e, el){
  const r = (DB.richieste || []).find(x=> x.id === el.dataset.id);
  if(!r) return;
  const gia = preventivi().find(p=> p.richiestaId === r.id);
  chiudi();
  if(gia) return vai("preventivo", gia.id);
  const p = preDaRichiesta(r);
  preventivi().push(p); save(); vai("preventivo", p.id);
  toast(L("Preventivo creato dalla richiesta"), "ok");
};

/* --- il foglio da mandare al gruppo --- */
DOC.preventivo = function(id){
  const p = preById(id), c = p.cliente || {};
  const n = nz(p.pax) || 1;
  const gr = gratuita(p, n);
  return testa(L("Preventivo") + " " + preCodice(p), dLong(p.data)) +
    '<div class="box"><b>' + esc(c.nome || "") + '</b>' +
      (c.ref ? '<br>' + esc(L("Riferimento")) + ": " + esc(c.ref) : "") +
      (c.tel ? '<br>' + esc(c.tel) : "") + (c.email ? " · " + esc(c.email) : "") + '</div>' +
    '<h2>' + esc(p.titolo || p.dest) + '</h2>' +
    '<div class="cols2">' +
      '<div><b>' + esc(L("Destinazione")) + ':</b> ' + esc(p.dest || "—") + '<br>' +
        '<b>' + esc(L("Durata")) + ':</b> ' + esc(LN("{n} giorni", { n: nz(p.giorni) })) + " / " + esc(LN("{n} notti", { n: nz(p.notti) })) + '<br>' +
        '<b>' + esc(L("Quando")) + ':</b> ' + esc(p.quando || "—") + '</div>' +
      '<div><b>' + esc(L("Mezzo")) + ':</b> ' + esc(L(p.mezzo)) + '<br>' +
        '<b>' + esc(L("Partenza da")) + ':</b> ' + esc(p.partenzaDa || "—") + '<br>' +
        '<b>' + esc(L("Persone previste")) + ':</b> ' + n + '</div>' +
    '</div>' +
    '<h2>' + esc(L("La quota")) + '</h2>' +
    '<table><tr><th>' + esc(L("Persone")) + '</th><th style="text-align:right">' + esc(L("Quota a persona")) + '</th></tr>' +
      preScala(p).filter(x=> x.n >= Math.max(2, n - 10)).map(x=>
        '<tr><td>' + x.n + (x.n === n ? " — " + esc(L("gruppo previsto")) : "") + '</td>' +
        '<td style="text-align:right"><b>' + eur(nz(p.quota) || prePrezzoConsigliato(p)) + '</b></td></tr>').join("") +
    '</table>' +
    (gr.length ? '<p class="small">' + esc(gr.map(g=> LN("{n} gratuità su: {v}", { n:g.n, v:g.voce })).join(" · ")) + '</p>' : "") +
    ((p.incluso || []).length ? '<h2>' + esc(L("La quota comprende")) + '</h2><ul>' +
      (p.incluso || []).map(x=> "<li>" + esc(x) + "</li>").join("") + '</ul>' : "") +
    ((p.nonIncluso || []).length ? '<h2>' + esc(L("La quota non comprende")) + '</h2><ul>' +
      (p.nonIncluso || []).map(x=> "<li>" + esc(x) + "</li>").join("") + '</ul>' : "") +
    (p.note ? '<h2>' + esc(L("Note")) + '</h2><p>' + esc(p.note) + '</p>' : "") +
    (p.validoFino ? '<p class="small"><b>' + esc(L("Preventivo valido fino al")) + " " + esc(dLong(p.validoFino)) + '</b></p>' : "") +
    coda(L("Preventivo senza impegno. Le quote sono calcolate sul numero di persone indicato: se il gruppo cambia, la quota cambia."));
};
</script>
<script>
/* ============================================================
   9. L'AVVIO E I COLLEGAMENTI
   ============================================================ */
document.addEventListener("click", function(e){
  const a = e.target.closest("[data-act]");
  if(a){
    const f = ACT[a.dataset.act];
    if(f){ e.preventDefault(); f(e, a); return; }
  }
  const b = e.target.closest("button[data-ch]");
  if(b){
    const f = CH[b.dataset.ch];
    if(f){ e.preventDefault(); f(e, b); return; }
  }
  const g = e.target.closest("[data-go]");
  if(g){
    e.preventDefault();
    const p = String(g.dataset.go).split("/");
    vai(p[0], p[1], p[2]);
  }
});
let T_CERCA = null;
document.addEventListener("input", function(e){
  const el = e.target.closest("input[data-ch]");
  if(!el || el.type !== "search") return;
  const f = CH[el.dataset.ch];
  if(!f) return;
  clearTimeout(T_CERCA);
  T_CERCA = setTimeout(()=> f(e, el), 280);
});
document.addEventListener("change", function(e){
  const el = e.target.closest("[data-ch]");
  if(!el || el.tagName === "BUTTON" || el.type === "search") return;
  const f = CH[el.dataset.ch];
  if(f) f(e, el);
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && document.getElementById("modal").classList.contains("on")) chiudi();
  if(e.key === "Enter" && (e.metaKey || e.ctrlKey) && document.getElementById("modal").classList.contains("on")){
    const ok = document.querySelector('#m-f [data-act="ok"]');
    if(ok) ok.click();
  }
  if(e.key === "/" && !/input|textarea|select/i.test((document.activeElement||{}).tagName || "")){
    const s = document.querySelector('#view input[type="search"]');
    if(s){ e.preventDefault(); s.focus(); }
  }
});
window.addEventListener("hashchange", function(){ leggiHash(); render(); });

function dopoRender(){ /* gancio per chi verrà dopo */ }

function boot(){
  DB = load();
  if(!DB){ DB = buildSeed(); DB.meta.lingua = "it"; save(); }
  /* la lingua: quella scelta, altrimenti quella del telefono, altrimenti italiano */
  let l = DB.meta.lingua || (navigator.language || "it").slice(0,2).toLowerCase();
  if(LNG.indexOf(l) < 0) l = "it";
  LANG = l;
  DB.meta.lingua = l;
  document.documentElement.lang = l;
  document.documentElement.setAttribute("data-skin", DB.meta.skin || "chiaro");
  leggiHash();
  render();
  if(typeof lingueAvvia === "function") lingueAvvia();
  if(typeof syncAvvia === "function") syncAvvia();
  if(conPin()) blocca();
  /* la prima volta si comincia dai primi passi */
  if(!DB.partenze.length && !location.hash) vai("guida");
}
boot();

/* funziona anche senza linea */
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
