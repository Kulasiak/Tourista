<script>
/* ============================================================
   3. I CONTI — quanto costa, quanto rende, chi deve pagare
   ============================================================ */
let DB = null;
let LINK = { view:"cruscotto", id:"", tab:"" };

/* --- salvataggio --- */
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast(L("Memoria piena: esporta una copia di sicurezza"), "err"); }
  if(typeof syncPush === "function") syncPush();
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return (d && d.meta && d.partenze) ? d : null;
  }catch(e){ return null; }
}

/* --- ricerche --- */
const byId = (arr, id) => (arr || []).find(x=> x.id === id) || null;
const depById  = id => byId(DB.partenze, id);
const praById  = id => byId(DB.pratiche, id);
const perById  = id => byId(DB.persone, id);
const cliById  = id => byId(DB.clienti, id);
const forById  = id => byId(DB.fornitori, id);
const staById  = id => byId(DB.staff, id);
const pacById  = id => byId(DB.pacchetti, id);
const nomeP    = id => { const p = perById(id); return p ? p.nome + " " + p.cognome : "—"; };
const cognP    = id => { const p = perById(id); return p ? p.cognome + " " + p.nome : "—"; };
const nomeF    = id => { const f = forById(id); return f ? f.nome : "—"; };
const nomeS    = id => { const s = staById(id); return s ? s.nome : "—"; };
const nomeC    = id => { const c = cliById(id); return c ? c.nome : "—"; };

/* --- camere --- */
const CAMERE = {
  sng:{ cap:1, lab:"Singola",  sup:"sing" },
  dus:{ cap:1, lab:"Doppia uso singola", sup:"sing" },
  dbl:{ cap:2, lab:"Doppia matrimoniale" },
  twn:{ cap:2, lab:"Doppia a due letti" },
  tpl:{ cap:3, lab:"Tripla", sup:"rid" },
  qdr:{ cap:4, lab:"Quadrupla", sup:"rid" }
};
const camLab = t => L((CAMERE[t] || {}).lab || t);
const camCap = t => (CAMERE[t] || {}).cap || 1;

/* --- stati --- */
const STATI_DEP = {
  bozza:      { lab:"Bozza",       c:"n" },
  vendita:    { lab:"In vendita",  c:"b" },
  confermata: { lab:"Confermata",  c:"g" },
  viaggio:    { lab:"In viaggio",  c:"v" },
  conclusa:   { lab:"Conclusa",    c:"n" },
  annullata:  { lab:"Annullata",   c:"r" }
};
const STATI_PRA = {
  opzione:    { lab:"Opzione",    c:"a" },
  confermata: { lab:"Confermata", c:"b" },
  saldata:    { lab:"Saldata",    c:"g" },
  annullata:  { lab:"Annullata",  c:"r" }
};
function depStato(d){
  if(d.stato === "annullata" || d.stato === "bozza") return d.stato;
  if(d.stato === "conclusa" || toGo(d.fine) < 0) return "conclusa";
  if(toGo(d.inizio) <= 0 && toGo(d.fine) >= 0) return "viaggio";
  return d.stato;
}
function depChip(d){
  const s = depStato(d), o = STATI_DEP[s] || STATI_DEP.bozza;
  return '<span class="chip ' + o.c + '">' + esc(L(o.lab)) + '</span>';
}
function praChip(p){
  const o = STATI_PRA[p.stato] || STATI_PRA.confermata;
  return '<span class="chip ' + o.c + '">' + esc(L(o.lab)) + '</span>';
}

/* --- partenze --- */
const depPratiche = d => DB.pratiche.filter(p=> p.depId === d.id);
const depVive     = d => depPratiche(d).filter(p=> p.stato !== "annullata");
function depPaxList(d){
  const out = [];
  depVive(d).forEach(p=> p.pax.forEach(x=> out.push({ pax:x, pra:p })));
  return out;
}
const depVenduti = d => depPaxList(d).length;
const depLiberi  = d => Math.max(0, nz(d.posti) - depVenduti(d));
const depPct     = d => nz(d.posti) ? Math.round(depVenduti(d) / d.posti * 100) : 0;
const depGiorni  = d => days(d.inizio, d.fine) + 1;

/* --- costi di una partenza --- */
function costiFissi(d){ return sum((d.costi||[]).filter(c=> c.tipo === "fisso").map(c=> c.importo)); }
function costoPaxUnit(d, n){
  /* le gratuità (una ogni tot paganti) abbassano il costo di ciascuno */
  return sum((d.costi||[]).filter(c=> c.tipo === "pax").map(c=>{
    const gratis = c.ogni && n ? Math.floor(n / c.ogni) : 0;
    return nz(c.importo) * Math.max(0, n - gratis) / (n || 1);
  }));
}
function costoTot(d, n){ return costiFissi(d) + costoPaxUnit(d, n) * n; }
function costoPP(d, n){ return n > 0 ? costoTot(d, n) / n : 0; }
function gratuita(d, n){
  return (d.costi||[]).filter(c=> c.tipo === "pax" && c.ogni).map(c=> ({ voce:c.voce, n: Math.floor(n / c.ogni), ogni:c.ogni })).filter(x=> x.n > 0);
}
function pareggio(d){
  const q = nz(d.quota);
  for(let n = 1; n <= nz(d.posti); n++) if(n * q >= costoTot(d, n)) return n;
  return null;
}
function depRicavi(d){ return sum(depVive(d).map(p=> pratTotale(p, d))); }
function depCosti(d){
  const n = depVenduti(d);
  const extra = sum((DB.prima||[]).filter(x=> x.depId === d.id && x.tipo === "uscita").map(x=> x.importo));
  return costoTot(d, n) + extra;
}
function depMargine(d){ return depRicavi(d) - depCosti(d); }
function depMarginePct(d){ const r = depRicavi(d); return r ? depMargine(d) / r * 100 : 0; }
function depIncassato(d){ return sum(depVive(d).map(pratPagato)); }
function depDaIncassare(d){ return Math.max(0, depRicavi(d) - depIncassato(d)); }
function prezzoConsigliato(d, n){
  const c = costoPP(d, n || nz(d.minimo) || 1);
  const r = nz(DB.meta.ricarico);
  return Math.ceil((c / (1 - r/100)) / 10) * 10;
}

/* --- pratiche --- */
function pratSupplementi(pr, d){
  d = d || depById(pr.depId);
  if(!d) return 0;
  return sum((pr.camere||[]).map(r=>{
    const k = CAMERE[r.tipo] || {};
    const q = (r.ids||[]).length;
    if(k.sup === "sing") return nz(d.supSingola) * q;
    if(k.sup === "rid")  return -nz(d.ridTripla) * q;
    return 0;
  }));
}
function pratExtra(pr){ return sum((pr.extra||[]).map(e=> nz(e.importo) * (nz(e.qta) || 1))); }
function pratQuote(pr){ return sum((pr.pax||[]).map(p=> p.prezzo)); }
function pratTotale(pr, d){
  return Math.max(0, pratQuote(pr) + pratSupplementi(pr, d) + pratExtra(pr) - nz(pr.sconto));
}
function pratPagato(pr){ return sum((pr.pagamenti||[]).map(p=> p.importo)); }
function pratResiduo(pr, d){ return Math.round((pratTotale(pr, d) - pratPagato(pr)) * 100) / 100; }
function pratAccontoDovuto(pr, d){
  d = d || depById(pr.depId);
  return Math.min(pratTotale(pr, d), nz(d && d.acconto) * (pr.pax||[]).length);
}
function pratScadenzaSaldo(pr, d){
  d = d || depById(pr.depId);
  return d ? addDays(d.inizio, -nz(DB.meta.saldoGiorni)) : "";
}
function pratInRitardo(pr, d){
  d = d || depById(pr.depId);
  if(!d || pr.stato === "annullata" || pratResiduo(pr, d) <= 0) return false;
  return toGo(pratScadenzaSaldo(pr, d)) < 0;
}
function pratPax(pr){ return (pr.pax||[]).length; }
function pratSenzaCamera(pr){
  const dentro = {};
  (pr.camere||[]).forEach(r=> (r.ids||[]).forEach(i=> dentro[i] = 1));
  return (pr.pax||[]).filter(p=> !dentro[p.personId]);
}
function praticheDi(personId){
  return DB.pratiche.filter(p=> (p.pax||[]).some(x=> x.personId === personId));
}
function personeDi(dep){
  const out = [];
  depVive(dep).forEach(p=> p.pax.forEach(x=>{
    const per = perById(x.personId);
    if(per) out.push({ p:per, pra:p, pax:x });
  }));
  return out.sort((a,b)=> (a.p.cognome + a.p.nome).localeCompare(b.p.cognome + b.p.nome, "it"));
}

/* --- camere di tutta la partenza --- */
function roomingDi(dep){
  const out = [];
  depVive(dep).forEach(pr=> (pr.camere||[]).forEach(r=> out.push({ r:r, pra:pr })));
  const ordine = ["sng","dus","dbl","twn","tpl","qdr"];
  return out.sort((a,b)=> ordine.indexOf(a.r.tipo) - ordine.indexOf(b.r.tipo));
}
function roomingConta(dep){
  const c = {};
  roomingDi(dep).forEach(x=> c[x.r.tipo] = (c[x.r.tipo]||0) + 1);
  return c;
}
function senzaCamera(dep){
  const out = [];
  depVive(dep).forEach(pr=> pratSenzaCamera(pr).forEach(px=> out.push({ pax:px, pra:pr })));
  return out;
}

/* --- posti in bus --- */
function postiOccupati(dep){
  const m = {};
  depVive(dep).forEach(pr=>{
    Object.keys(pr.posti || {}).forEach(pid=>{
      const s = pr.posti[pid];
      if(s) m[s] = { personId:pid, pra:pr };
    });
  });
  return m;
}
function senzaPosto(dep){
  const out = [];
  depVive(dep).forEach(pr=> (pr.pax||[]).forEach(px=>{
    if(!(pr.posti && pr.posti[px.personId])) out.push({ pax:px, pra:pr });
  }));
  return out;
}

/* --- documenti dei passeggeri --- */
function docStato(p, quando){
  if(!p.docScad) return { c:"n", lab:"Documento mancante", bad:true };
  const g = days(quando || today(), p.docScad);
  if(g < 0)   return { c:"r", lab:"Documento scaduto", bad:true };
  if(g < 90)  return { c:"a", lab:"Documento in scadenza", bad:true };
  return { c:"g", lab:"Documento valido", bad:false };
}

/* --- fornitori --- */
function forniture(){
  const out = [];
  DB.partenze.forEach(d=> (d.fornitura||[]).forEach(f=> out.push({ f:f, dep:d })));
  return out;
}
function fResiduo(f){ return Math.max(0, nz(f.importo) - nz(f.acconto)); }

/* --- il denaro in scadenza --- */
function incassiAttesi(){
  const out = [];
  DB.pratiche.forEach(pr=>{
    if(pr.stato === "annullata") return;
    const d = depById(pr.depId);
    if(!d || depStato(d) === "conclusa" || depStato(d) === "annullata") return;
    const res = pratResiduo(pr, d);
    if(res <= 0.5) return;
    const pagato = pratPagato(pr);
    const acc = pratAccontoDovuto(pr, d);
    const scad = pagato < acc - 0.5 ? addDays(pr.creata, nz(DB.meta.giorniOpzione)) : pratScadenzaSaldo(pr, d);
    out.push({ pra:pr, dep:d, importo:res, scad:scad, tipo: pagato < acc - 0.5 ? "acconto" : "saldo" });
  });
  return out.sort((a,b)=> a.scad.localeCompare(b.scad));
}
function pagamentiAttesi(){
  const out = [];
  forniture().forEach(x=>{
    if(depStato(x.dep) === "annullata") return;
    const res = fResiduo(x.f);
    if(res <= 0.5 || x.f.stato === "saldato") return;
    out.push({ f:x.f, dep:x.dep, importo:res, scad:x.f.saldoData || x.dep.inizio });
  });
  return out.sort((a,b)=> String(a.scad).localeCompare(String(b.scad)));
}

/* --- il riquadro "da sistemare adesso" --- */
function allarmi(){
  const A = [];
  const T = today();

  DB.pratiche.filter(p=> p.stato === "opzione").forEach(pr=>{
    const g = toGo(pr.scadenzaOpzione);
    if(pr.scadenzaOpzione && g <= 2)
      A.push({ p: g < 0 ? 0 : 1, cls: g < 0 ? "r" : "a", ico:"orologio",
        t: LN("Opzione {c} {stato}", { c:pr.codice, stato: g < 0 ? L("scaduta") : (g === 0 ? L("scade oggi") : L("scade domani")) }),
        s: nomeC(pr.clienteId) + " — " + pratPax(pr) + " " + L("posti") + " · " + (depById(pr.depId)||{}).titolo,
        go:{ view:"pratica", id:pr.id } });
  });

  incassiAttesi().forEach(x=>{
    if(toGo(x.scad) < 0)
      A.push({ p:0, cls:"r", ico:"soldi",
        t: LN("{tipo} scaduto: {imp}", { tipo: cap(L(x.tipo)), imp: eur(x.importo) }),
        s: x.pra.codice + " · " + nomeC(x.pra.clienteId) + " — " + L("scaduto il") + " " + dIT(x.scad),
        go:{ view:"pratica", id:x.pra.id } });
  });

  pagamentiAttesi().forEach(x=>{
    if(toGo(x.scad) <= 3)
      A.push({ p: toGo(x.scad) < 0 ? 0 : 1, cls: toGo(x.scad) < 0 ? "r" : "a", ico:"palazzo",
        t: LN("Da pagare a {chi}: {imp}", { chi: nomeF(x.f.fornitoreId), imp: eur(x.importo) }),
        s: x.dep.titolo + " — " + esc(x.f.voce) + " · " + quando(x.scad),
        go:{ view:"partenza", id:x.dep.id, tab:"fornitori" } });
  });

  DB.partenze.forEach(d=>{
    const st = depStato(d);
    if(st !== "vendita" && st !== "confermata") return;
    const g = toGo(d.inizio);
    const v = depVenduti(d);
    if(v < nz(d.minimo) && g <= 60)
      A.push({ p:1, cls:"a", ico:"allerta",
        t: LN("{tit}: sotto il minimo", { tit:d.titolo }),
        s: LN("{v} iscritti su {m} necessari — si parte fra {g} giorni", { v:v, m:d.minimo, g:g }),
        go:{ view:"partenza", id:d.id } });
    if(g >= 0 && g <= 21){
      const nc = senzaCamera(d).length;
      if(nc) A.push({ p:1, cls:"b", ico:"letto",
        t: LN("{n} passeggeri senza camera", { n:nc }), s: d.titolo + " — " + quando(d.inizio),
        go:{ view:"partenza", id:d.id, tab:"rooming" } });
      personeDi(d).forEach(x=>{
        const s = docStato(x.p, d.fine);
        if(s.bad && (s.c === "r" || !x.p.docScad))
          A.push({ p:1, cls:"r", ico:"tessera",
            t: L(s.lab) + ": " + x.p.nome + " " + x.p.cognome, s: d.titolo + " — " + quando(d.inizio),
            go:{ view:"passeggero", id:x.p.id } });
      });
      if(!d.accompagnatore) A.push({ p:1, cls:"a", ico:"bandiera",
        t: L("Manca l'accompagnatore"), s: d.titolo + " — " + quando(d.inizio), go:{ view:"partenza", id:d.id } });
    }
    if(depLiberi(d) === 0 && (d.listaAttesa||[]).length)
      A.push({ p:2, cls:"b", ico:"gente",
        t: LN("{tit}: pieno, {n} in lista d'attesa", { tit:d.titolo, n:d.listaAttesa.length }),
        s: L("Valutare un secondo bus o una seconda data"), go:{ view:"partenza", id:d.id } });
  });

  (DB.cose||[]).filter(c=> !c.fatto && toGo(c.scad) <= 2).forEach(c=>{
    A.push({ p: toGo(c.scad) < 0 ? 0 : 2, cls: toGo(c.scad) < 0 ? "r" : "b", ico:"spunta",
      t:c.testo, s: (c.depId ? (depById(c.depId)||{}).titolo + " — " : "") + quando(c.scad),
      go: c.depId ? { view:"partenza", id:c.depId } : { view:"agenda" } });
  });

  (DB.richieste||[]).filter(r=> r.stato === "da preventivare").forEach(r=>{
    A.push({ p:2, cls:"b", ico:"megafono", t: LN("Richiesta da preventivare: {chi}", { chi:r.nome }),
      s: r.dest + " — " + r.pax + " " + L("persone") + " · " + quando(r.data), go:{ view:"richieste" } });
  });

  return A.sort((a,b)=> a.p - b.p);
}

/* --- numeri del cruscotto --- */
function kpiMese(){
  const m = ym(today());
  let inc = 0, out = 0;
  DB.pratiche.forEach(pr=> (pr.pagamenti||[]).forEach(p=>{ if(ym(p.data) === m) inc += nz(p.importo); }));
  (DB.prima||[]).forEach(x=>{ if(ym(x.data) === m){ if(x.tipo === "uscita") out += nz(x.importo); else inc += nz(x.importo); } });
  return { inc:inc, out:out };
}
function prossimePartenze(n){
  return DB.partenze
    .filter(d=> depStato(d) !== "conclusa" && depStato(d) !== "annullata")
    .sort((a,b)=> a.inizio.localeCompare(b.inizio))
    .slice(0, n || 99);
}
function inViaggio(){ return DB.partenze.filter(d=> depStato(d) === "viaggio"); }

<script>
/* ============================================================
   5. LE SCHERMATE
   ============================================================ */
const VISTE = {};

/* colori delle copertine: ogni destinazione ha sempre i suoi */
const GRAD = [
  ["#0E6E7A","#17A79A"], ["#C2600F","#E3A93A"], ["#15588F","#3196D6"], ["#6B4E9E","#A87BD4"],
  ["#1E7A55","#57B87E"], ["#B23A2B","#E0793F"], ["#8A6A1E","#CDA92C"], ["#0B4F63","#2C8FA6"],
  ["#7A2E5C","#C05B96"], ["#2F6B57","#6FAE86"]
];
function grad(s){
  const k = String(s || "x").split("").reduce((a,c)=> a + c.charCodeAt(0), 0) % GRAD.length;
  return "linear-gradient(135deg," + GRAD[k][0] + " 0%," + GRAD[k][1] + " 100%)";
}
function conta(d){
  const g = toGo(d.inizio);
  if(depStato(d) === "viaggio") return { t: L("in viaggio"), c:"v" };
  if(depStato(d) === "conclusa") return { t: L("conclusa"), c:"n" };
  if(g === 0) return { t: L("si parte oggi"), c:"r" };
  if(g < 0)  return { t: quando(d.inizio), c:"n" };
  return { t: "−" + g + " " + L("giorni"), c: g <= 14 ? "a" : "b" };
}

/* la scheda di una partenza, quella che si vede ovunque */
function depCard(d){
  const v = depVenduti(d), lib = depLiberi(d), p = depPct(d);
  const c = conta(d);
  const cls = p >= 90 ? "g" : p >= 60 ? "" : p >= 35 ? "a" : "r";
  return '<div class="dep" data-go="partenza/' + d.id + '">' +
    '<div style="height:64px;background:' + grad(d.dest + d.id) + ';position:relative;display:flex;align-items:center;padding:0 15px;gap:10px">' +
      '<span style="font-size:30px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))">' + bandiera(d) + '</span>' +
      '<div style="color:#fff;min-width:0">' +
        '<div style="font-weight:750;font-size:15px;letter-spacing:-.01em;text-shadow:0 1px 3px rgba(0,0,0,.3)" class="trunc">' + esc(d.titolo) + '</div>' +
        '<div style="font-size:11.5px;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.3)">' + esc(d.codice) + ' · ' + esc(d.dest) + '</div>' +
      '</div>' +
      '<div class="sp"></div>' +
      '<span class="chip ' + c.c + '" style="background:rgba(255,255,255,.92)">' + esc(c.t) + '</span>' +

/* ---------- CRUSCOTTO ---------- */
VISTE.cruscotto = function(){
  const T = today();
  const ora = new Date().getHours();
  const saluto = ora < 12 ? "Buongiorno" : ora < 18 ? "Buon pomeriggio" : "Buonasera";
  const A = allarmi();
  const k = kpiMese();
  const pross = prossimePartenze(6);
  const viag = inViaggio();

  /* numeri in testa */
  const paxAnno = DB.pratiche.filter(p=> p.stato !== "annullata").reduce((a,p)=> a + pratPax(p), 0);
  const daInc = sum(incassiAttesi().map(x=> x.importo));
  const daPag = sum(pagamentiAttesi().map(x=> x.importo));
  const attive = DB.partenze.filter(d=> ["vendita","confermata","viaggio"].indexOf(depStato(d)) >= 0).length;

  /* incassi degli ultimi sei mesi */
  const mesi = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    const key = iso(d).slice(0,7);
    let tot = 0;
    DB.pratiche.forEach(pr=> (pr.pagamenti||[]).forEach(p=>{ if(ym(p.data) === key) tot += nz(p.importo); }));
    mesi.push({ k:key, lab: MESI3()[d.getMonth()], v:tot });
  }
  const maxM = Math.max(1, ...mesi.map(m=> m.v));

  intesta(L("Cruscotto"), dLong(T),
    '<button class="btn pri" data-act="nuova-partenza">' + ico("piu") + '<span class="nowrap">' + esc(L("Nuova partenza")) + '</span></button>');

  return '' +
  '<div class="stack">' +

    /* saluto */
    '<div class="row wrap" style="gap:8px">' +
      '<div><h1 class="serif">' + esc(L(saluto)) + '</h1>' +
      '<div class="muted small">' + esc(LN("{n} viaggi aperti · {p} passeggeri in archivio · {a} cose da sistemare",
        { n:attive, p:paxAnno, a:A.length })) + '</div></div>' +
    '</div>' +

    /* i numeri */
    '<div class="grid g4 keep2">' +
      kpi(L("Incassato questo mese"), eur(k.inc, 0), '<span style="color:var(--green)">' + ico("su","") + '</span> ' + esc(L("dalle pratiche")), "br") +
      kpi(L("Da incassare"), eur(daInc, 0), esc(LN("{n} scadenze", { n: incassiAttesi().length }))) +
      kpi(L("Da pagare ai fornitori"), eur(daPag, 0), esc(LN("{n} fatture aperte", { n: pagamentiAttesi().length }))) +
      kpi(L("Posti venduti in totale"), num(DB.partenze.reduce((a,d)=> a + depVenduti(d), 0)),
        esc(LN("su {n} disponibili", { n: DB.partenze.reduce((a,d)=> a + nz(d.posti), 0) }))) +
    '</div>' +

    (viag.length ?
    '<div class="card pad" style="background:linear-gradient(135deg,var(--violet-soft),transparent);border-color:var(--violet)">' +
      '<div class="row"><span style="font-size:22px">🧳</span><div><b>' + esc(L("In viaggio adesso")) + '</b>' +
      '<div class="small muted">' + viag.map(d=> esc(d.titolo) + " — " + esc(LN("giorno {g} di {t}", { g: days(d.inizio, today()) + 1, t: depGiorni(d) }))).join(" · ") + '</div></div>' +
      '<div class="sp"></div>' +
      viag.map(d=> '<button class="btn sm" data-go="partenza/' + d.id + '/appello">' + esc(L("Appello")) + '</button>').join("") +
      '</div></div>' : "") +

    '<div class="grid" style="grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)">' +

      /* colonna sinistra: partenze */
      '<div class="stack">' +
        '<div class="card">' +
          '<div class="card-h">' + ico("mappa") + '<h3>' + esc(L("Prossime partenze")) + '</h3><div class="sp"></div>' +
            '<button class="btn ghost sm" data-go="partenze">' + esc(L("tutte")) + ico("avanti") + '</button></div>' +
          '<div class="card-b">' +
            (pross.length ? '<div class="grid g-wide">' + pross.map(depCard).join("") + '</div>'
                          : vuoto(L("Nessuna partenza in programma"))) +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<div class="card-h">' + ico("grafico") + '<h3>' + esc(L("Incassi degli ultimi sei mesi")) + '</h3></div>' +
          '<div class="card-b">' +
            '<div class="row" style="align-items:flex-end;gap:12px;height:150px">' +
            mesi.map(m=>
              '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">' +
                '<span class="tiny" style="font-weight:700">' + (m.v ? eur(m.v,0).replace(/\s/g," ") : "—") + '</span>' +
                '<div style="width:100%;max-width:52px;height:' + Math.max(4, m.v / maxM * 96) + 'px;border-radius:7px 7px 3px 3px;background:' +
                  (m.k === ym(today()) ? "linear-gradient(180deg,var(--brand),var(--brand-2))" : "var(--fill-2)") + '"></div>' +
                '<span class="tiny dim">' + esc(m.lab) + '</span>' +
              '</div>').join("") +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      /* colonna destra: da sistemare + agenda */
      '<div class="stack">' +
        '<div class="card">' +
          '<div class="card-h">' + ico("allerta") + '<h3>' + esc(L("Da sistemare adesso")) + '</h3>' +
            '<div class="sp"></div><span class="chip ' + (A.filter(a=>a.p===0).length ? "r" : "g") + '">' + A.length + '</span></div>' +
          '<div class="card-b">' +
            (A.length ? A.slice(0,9).map((a,i)=>
              '<div class="todo ' + a.cls + '" data-go="' + a.go.view + (a.go.id ? "/" + a.go.id : "") + (a.go.tab ? "/" + a.go.tab : "") + '">' +
                '<div class="t-i">' + ico(a.ico) + '</div>' +
                '<div style="min-width:0"><div class="t-t">' + esc(a.t) + '</div><div class="t-s">' + esc(a.s) + '</div></div>' +
              '</div>').join("") + (A.length > 9 ? '<div class="tiny dim center">+ ' + (A.length - 9) + ' ' + esc(L("altre")) + '</div>' : "")
            : '<div class="ok-box">' + esc(L("Tutto in ordine. Non c'è niente in sospeso.")) + '</div>') +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<div class="card-h">' + ico("spunta") + '<h3>' + esc(L("Cose da fare")) + '</h3><div class="sp"></div>' +
            '<button class="btn ghost sm" data-act="nuova-cosa">' + ico("piu") + '</button></div>' +
          '<div class="card-b">' +
            (DB.cose.filter(c=> !c.fatto).slice(0,6).map(c=>
              '<label class="check" style="padding:6px 0;border-bottom:1px solid var(--sep)">' +
                '<input type="checkbox" data-ch="cosa" data-id="' + c.id + '">' +
                '<span style="flex:1"><span style="font-weight:600">' + esc(c.testo) + '</span>' +
                '<span class="tiny ' + (toGo(c.scad) < 0 ? "" : "dim") + '" style="display:block;' + (toGo(c.scad) < 0 ? "color:var(--red)" : "") + '">' +
                esc(quando(c.scad)) + (c.chi ? " · " + esc(nomeS(c.chi)) : "") + '</span></span>' +
              '</label>').join("") || '<div class="empty small">' + esc(L("Niente da fare, per ora")) + '</div>') +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<div class="card-h">' + ico("megafono") + '<h3>' + esc(L("Richieste aperte")) + '</h3><div class="sp"></div>' +
            '<button class="btn ghost sm" data-go="richieste">' + ico("avanti") + '</button></div>' +
          '<div>' +
            (DB.richieste.filter(r=> ["da preventivare","preventivo inviato","in trattativa"].indexOf(r.stato) >= 0).slice(0,4).map(r=>
              '<div class="list-i" data-act="richiesta" data-id="' + r.id + '">' +
                '<div class="av b">' + esc(initials(r.nome, r.nome.split(" ")[1] || "")) + '</div>' +
                '<div style="min-width:0;flex:1"><div class="li-t trunc">' + esc(r.nome) + '</div>' +
                '<div class="li-s">' + esc(r.dest) + ' · ' + r.pax + ' ' + esc(L("persone")) + '</div></div>' +
                '<span class="chip ' + (r.stato === "da preventivare" ? "a" : "b") + '">' + esc(L(r.stato)) + '</span>' +
              '</div>').join("") || '<div class="empty small">' + esc(L("Nessuna richiesta aperta")) + '</div>') +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
};

/* ---------- AGENDA ---------- */
VISTE.agenda = function(){
  const T = today();
  const cose = (DB.cose||[]).slice().sort((a,b)=> (a.fatto - b.fatto) || String(a.scad).localeCompare(String(b.scad)));
  const fatte = cose.filter(c=> c.fatto), aperte = cose.filter(c=> !c.fatto);

  /* calendario del mese con le partenze */
  const oggi = new Date();
  const primo = new Date(oggi.getFullYear(), oggi.getMonth(), 1);
  const giorni = new Date(oggi.getFullYear(), oggi.getMonth()+1, 0).getDate();
  const off = (primo.getDay() + 6) % 7;
  const celle = [];
  for(let i=0;i<off;i++) celle.push('<div class="c-d out"></div>');
  for(let g=1;g<=giorni;g++){
    const dd = iso(new Date(oggi.getFullYear(), oggi.getMonth(), g));
    const dep = DB.partenze.filter(d=> dd >= d.inizio && dd <= d.fine);
    const parte = DB.partenze.filter(d=> d.inizio === dd);
    celle.push('<div class="c-d' + (dep.length ? " has" : "") + (dd === T ? " today" : "") + '"' +
      (parte.length ? ' data-go="partenza/' + parte[0].id + '"' : "") +
      ' title="' + esc(dep.map(d=> d.titolo).join(", ")) + '">' + g +
      (dep.length ? '<span class="pip"></span>' : "") + '</div>');
  }

  intesta(L("Agenda"), LN("{n} cose da fare", { n: aperte.length }),
    '<button class="btn pri" data-act="nuova-cosa">' + ico("piu") + esc(L("Nuova")) + '</button>');

  return '<div class="grid" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)">' +
    '<div class="stack">' +
      '<div class="card">' +
        '<div class="card-h">' + ico("spunta") + '<h3>' + esc(L("Da fare")) + '</h3></div>' +
        '<div>' + (aperte.length ? aperte.map(cosaRiga).join("") : vuoto(L("Niente in sospeso"))) + '</div>' +
      '</div>' +
      (fatte.length ? '<div class="card"><div class="card-h">' + ico("spunta") + '<h3>' + esc(L("Fatte")) + '</h3>' +
        '<div class="sp"></div><button class="btn ghost sm" data-act="pulisci-cose">' + esc(L("Svuota")) + '</button></div>' +
        '<div style="opacity:.55">' + fatte.slice(0,12).map(cosaRiga).join("") + '</div></div>' : "") +
    '</div>' +
    '<div class="stack">' +
      '<div class="card pad">' +
        '<h3 style="margin-bottom:10px">' + esc(cap(mese(T))) + '</h3>' +
        '<div class="cal">' + GIORNI2().slice(1).concat(GIORNI2()[0]).map(g=> '<div class="c-h">' + esc(g) + '</div>').join("") + celle.join("") + '</div>' +
        '<div class="tiny dim mt">' + esc(L("I giorni colorati sono giorni di viaggio.")) + '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-h">' + ico("orologio") + '<h3>' + esc(L("Prossime scadenze")) + '</h3></div>' +
        '<div>' +
          incassiAttesi().slice(0,5).map(x=>
            '<div class="list-i" data-go="pratica/' + x.pra.id + '">' +
              '<div class="av g">' + ico("soldi") + '</div>' +
              '<div style="flex:1;min-width:0"><div class="li-t">' + esc(cap(L(x.tipo))) + ' ' + esc(x.pra.codice) + '</div>' +
              '<div class="li-s trunc">' + esc(nomeC(x.pra.clienteId)) + '</div></div>' +
              '<div class="right"><b>' + eur(x.importo,0) + '</b><div class="tiny ' + (toGo(x.scad) < 0 ? "" : "dim") + '" style="' + (toGo(x.scad)<0?"color:var(--red)":"") + '">' + esc(quando(x.scad)) + '</div></div>' +
            '</div>').join("") +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
};
function cosaRiga(c){
  const rit = !c.fatto && toGo(c.scad) < 0;
  return '<div class="list-i" style="cursor:default">' +
    '<input type="checkbox" data-ch="cosa" data-id="' + c.id + '"' + (c.fatto ? " checked" : "") + '>' +
    '<div style="flex:1;min-width:0">' +
      '<div class="li-t"' + (c.fatto ? ' style="text-decoration:line-through"' : "") + '>' + esc(c.testo) + '</div>' +
      '<div class="li-s">' + (c.depId ? esc((depById(c.depId)||{}).titolo || "") + " · " : "") +
        '<span style="' + (rit ? "color:var(--red);font-weight:700" : "") + '">' + esc(quando(c.scad)) + '</span>' +
        (c.chi ? " · " + esc(nomeS(c.chi)) : "") + '</div>' +
    '</div>' +
    '<button class="btn ghost sm" data-act="del-cosa" data-id="' + c.id + '">' + ico("cestino") + '</button>' +
  '</div>';
}
</script>
<script>
/* ---------- ELENCO PARTENZE ---------- */
let F_DEP = { q:"", stato:"tutte" };
VISTE.partenze = function(){
  let L1 = DB.partenze.slice().sort((a,b)=> a.inizio.localeCompare(b.inizio));
  if(F_DEP.stato === "aperte") L1 = L1.filter(d=> ["vendita","confermata","viaggio"].indexOf(depStato(d)) >= 0);
  else if(F_DEP.stato !== "tutte") L1 = L1.filter(d=> depStato(d) === F_DEP.stato);
  if(F_DEP.q){
    const q = F_DEP.q.toLowerCase();
    L1 = L1.filter(d=> (d.titolo + " " + d.dest + " " + d.codice).toLowerCase().indexOf(q) >= 0);
  }
  const tot = { posti: sum(L1.map(d=> d.posti)), venduti: sum(L1.map(depVenduti)), ric: sum(L1.map(depRicavi)), mar: sum(L1.map(depMargine)) };

  intesta(L("Partenze"), LN("{n} viaggi", { n:L1.length }),
    '<button class="btn pri" data-act="nuova-partenza">' + ico("piu") + '<span class="nowrap">' + esc(L("Nuova partenza")) + '</span></button>');

  return '<div class="stack">' +
    '<div class="grid g4 keep2">' +
      kpi(L("Posti venduti"), num(tot.venduti) + '<span class="muted" style="font-size:16px"> / ' + num(tot.posti) + '</span>',
        pct(tot.posti ? tot.venduti/tot.posti*100 : 0) + " " + esc(L("di riempimento")), "br") +
      kpi(L("Giro d'affari"), eur(tot.ric,0), esc(L("quote vendute"))) +
      kpi(L("Margine atteso"), eur(tot.mar,0), pct(tot.ric ? tot.mar/tot.ric*100 : 0)) +
      kpi(L("In vendita"), num(DB.partenze.filter(d=> depStato(d) === "vendita").length),
        esc(LN("{n} confermate", { n: DB.partenze.filter(d=> depStato(d) === "confermata").length }))) +
    '</div>' +

    '<div class="row wrap">' +
      '<div class="search" style="flex:1;min-width:200px">' + ico("cerca") +
        '<input type="search" id="q-dep" placeholder="' + esc(L("Cerca destinazione, codice…")) + '" value="' + esc(F_DEP.q) + '" data-ch="q-dep">' +
      '</div>' +
      '<div class="btn-group">' +
        [["tutte","Tutte"],["aperte","Aperte"],["vendita","In vendita"],["confermata","Confermate"],["conclusa","Concluse"]].map(x=>
          '<button class="' + (F_DEP.stato === x[0] ? "on" : "") + '" data-ch="f-dep" data-v="' + x[0] + '">' + esc(L(x[1])) + '</button>').join("") +
      '</div>' +
    '</div>' +

    (L1.length ? '<div class="grid g-wide">' + L1.map(depCard).join("") + '</div>'
      : vuoto(L("Nessuna partenza con questi filtri"),
        '<button class="btn pri mt" data-act="nuova-partenza">' + esc(L("Crea la prima partenza")) + '</button>')) +
  '</div>';
};

/* ---------- SCHEDA DI UNA PARTENZA ---------- */
VISTE.partenza = function(id, scheda){
  const d = depById(id);
  if(!d) return vuoto(L("Partenza non trovata"));
  scheda = scheda || "riepilogo";
  const v = depVenduti(d);
  const c = conta(d);

  intesta(d.titolo, d.codice + " · " + periodo(d.inizio, d.fine),
    '<button class="btn ghost ico" data-go="partenze" title="' + esc(L("Indietro")) + '">' + ico("indietro") + '</button>' +
    '<button class="btn" data-act="stampe-dep" data-id="' + d.id + '">' + ico("stampa") + '<span class="nowrap">' + esc(L("Documenti")) + '</span></button>' +
    '<button class="btn pri" data-act="nuova-pratica" data-id="' + d.id + '">' + ico("piu") + '<span class="nowrap">' + esc(L("Nuova pratica")) + '</span></button>');

  const schede = [
    { v:"riepilogo", lab:"Riepilogo" },
    { v:"programma", lab:"Programma", n:(d.programma||[]).length },
    { v:"costi",     lab:"Costi e quota" },
    { v:"pratiche",  lab:"Pratiche", n: depVive(d).length },
    { v:"rooming",   lab:"Rooming", n: roomingDi(d).length },
    { v:"bus",       lab: d.mezzo === "volo" ? "Posti" : "Posti in bus" },
    { v:"appello",   lab:"Appello", n:v },
    { v:"fornitori", lab:"Fornitori", n:(d.fornitura||[]).length }
  ];

  return '' +
    /* intestazione grande */
    '<div class="card mb" style="overflow:hidden">' +
      '<div style="background:' + grad(d.dest + d.id) + ';padding:18px 20px;color:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap">' +
        '<span style="font-size:44px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))">' + bandiera(d) + '</span>' +
        '<div style="min-width:0">' +
          '<div style="font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:-.02em;text-shadow:0 1px 4px rgba(0,0,0,.25)">' + esc(d.titolo) + '</div>' +
          '<div style="opacity:.92;font-size:13.5px;text-shadow:0 1px 3px rgba(0,0,0,.25)">' + esc(periodo(d.inizio, d.fine)) + ' · ' + esc(LN("{n} giorni", { n: depGiorni(d) })) + ' · ' + esc(d.dest) + '</div>' +
        '</div>' +
        '<div class="sp"></div>' +
        '<div class="row" style="gap:8px">' +
          '<span class="chip big ' + c.c + '" style="background:rgba(255,255,255,.94)">' + esc(c.t) + '</span>' +
          '<span class="chip big" style="background:rgba(255,255,255,.94);color:var(--txt)">' + esc(L(STATI_DEP[depStato(d)].lab)) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="card-b row wrap" style="gap:18px">' +
        anello(depPct(d), v + '<span style="font-size:12px;opacity:.6">/' + d.posti + '</span>', L("posti")) +
        '<div style="flex:1;min-width:200px">' +
          riga(L("Quota a persona"), eur(d.quota)) +
          riga(L("Incassato"), eur(depIncassato(d),0) + ' <span class="tiny dim">/ ' + eur(depRicavi(d),0) + '</span>') +
          riga(L("Margine atteso"), '<span style="color:' + (depMargine(d) > 0 ? "var(--green)" : "var(--red)") + '">' + eur(depMargine(d),0) + ' · ' + pct(depMarginePct(d)) + '</span>') +
        '</div>' +
        '<div style="flex:1;min-width:200px">' +
          riga(L("Minimo per partire"), d.minimo + " " + L("iscritti") + (v >= nz(d.minimo) ? ' <span class="chip g">' + esc(L("raggiunto")) + '</span>' : ' <span class="chip a">−' + (d.minimo - v) + '</span>')) +
          riga(L("Accompagnatore"), d.accompagnatore ? esc(nomeS(d.accompagnatore)) : '<span class="chip a">' + esc(L("da assegnare")) + '</span>') +
          riga(L("Punto di pareggio"), pareggio(d) ? LN("{n} paganti", { n: pareggio(d) }) : "—") +
        '</div>' +
      '</div>' +
    '</div>' +

    tab(schede, scheda, "partenza/" + d.id) +
    (SCHEDE_DEP[scheda] ? SCHEDE_DEP[scheda](d) : "");
};

const SCHEDE_DEP = {};

/* --- riepilogo --- */
SCHEDE_DEP.riepilogo = function(d){
  const att = d.listaAttesa || [];
  const pk = pacById(d.pacchettoId);
  return '<div class="grid" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)">' +
    '<div class="stack">' +
      '<div class="card">' +
        '<div class="card-h">' + ico("mappa") + '<h3>' + esc(L("Il viaggio")) + '</h3><div class="sp"></div>' +
          '<button class="btn ghost sm" data-act="mod-partenza" data-id="' + d.id + '">' + ico("matita") + esc(L("Modifica")) + '</button></div>' +
        '<div class="card-b">' +
          riga(L("Codice"), '<span class="mono">' + esc(d.codice) + '</span>') +
          riga(L("Destinazione"), esc(d.dest)) +
          riga(L("Andata"), esc(dLong(d.inizio))) +
          riga(L("Ritorno"), esc(dLong(d.fine))) +
          riga(L("Mezzo"), esc(L(d.mezzo === "bus" ? "Bus granturismo" : d.mezzo === "volo" ? "Volo di linea" : d.mezzo))) +
          riga(L("Ritrovo e partenza"), esc(d.partenzaDa || "—")) +
          riga(L("Posti"), d.posti + " · " + esc(LN("minimo {n}", { n:d.minimo }))) +

        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-h">' + ico("soldi") + '<h3>' + esc(L("Come sta andando")) + '</h3></div>' +
        '<div class="card-b">' +
          '<div class="grid g3" style="gap:10px">' +
            kpi(L("Venduto"), eur(depRicavi(d),0)) +
            kpi(L("Incassato"), eur(depIncassato(d),0)) +
            kpi(L("Da incassare"), eur(depDaIncassare(d),0)) +
          '</div>' +
          '<div class="mt">' +
            '<div class="row small muted mb"><span>' + esc(L("Quota media a persona")) + '</span><div class="sp"></div><b>' +
              eur(depVenduti(d) ? depRicavi(d)/depVenduti(d) : 0) + '</b></div>' +
            '<div class="split">' +
              (function(){
                const r = depRicavi(d) || 1, co = Math.min(depCosti(d), r), ma = Math.max(0, r - co);
                return '<i style="flex:' + co + ';background:var(--grey)">' + (co/r > .18 ? esc(L("costi")) + " " + eur(co,0) : "") + '</i>' +
                       '<i style="flex:' + Math.max(ma,0.0001) + ';background:var(--green)">' + (ma/r > .12 ? esc(L("margine")) + " " + eur(ma,0) : "") + '</i>';
              })() +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="stack">' +
      '<div class="card">' +
        '<div class="card-h">' + ico("bandiera") + '<h3>' + esc(L("Chi accompagna")) + '</h3></div>' +
        '<div class="card-b">' +
          '<div class="f"><label>' + esc(L("Accompagnatore")) + '</label><select data-ch="dep-acc" data-id="' + d.id + '">' +
            '<option value="">— ' + esc(L("da assegnare")) + ' —</option>' +
            DB.staff.filter(s=> s.ruolo === "accompagnatore" || s.ruolo === "titolare").map(s=>
              '<option value="' + s.id + '"' + (d.accompagnatore === s.id ? " selected" : "") + '>' + esc(s.nome) + '</option>').join("") +
          '</select></div>' +
          (d.accompagnatore ? (function(){ const s = staById(d.accompagnatore); return s ?
            '<div class="row mt">' + '<div class="av lg">' + esc(initials(s.nome.split(" ")[0], s.nome.split(" ")[1] || "")) + '</div>' +
            '<div><b>' + esc(s.nome) + '</b><div class="small muted">' + esc(s.tel) + '</div>' +
            '<div class="tiny dim">' + esc(s.note || "") + '</div></div></div>' : ""; })() : "") +
          '<button class="btn wide mt" data-act="stampa" data-doc="foglio" data-id="' + d.id + '">' + ico("stampa") + esc(L("Foglio di viaggio")) + '</button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-h">' + ico("gente") + '<h3>' + esc(L("Lista d'attesa")) + '</h3><div class="sp"></div>' +
          '<button class="btn ghost sm" data-act="nuova-attesa" data-id="' + d.id + '">' + ico("piu") + '</button></div>' +
        '<div>' + (att.length ? att.map(a=>
          '<div class="list-i" style="cursor:default"><div class="av a">' + ico("orologio") + '</div>' +
          '<div style="flex:1;min-width:0"><div class="li-t">' + esc(a.nome) + '</div>' +
          '<div class="li-s">' + esc(a.tel) + ' · ' + a.pax + ' ' + esc(L("posti")) + (a.note ? " · " + esc(a.note) : "") + '</div></div>' +
          '<button class="btn ghost sm" data-act="del-attesa" data-id="' + d.id + '" data-x="' + a.id + '">' + ico("cestino") + '</button></div>').join("")
          : '<div class="empty small">' + esc(L("Nessuno in attesa")) + '</div>') + '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-h">' + ico("ingranaggio") + '<h3>' + esc(L("Azioni")) + '</h3></div>' +
        '<div class="card-b stack" style="gap:8px">' +
          (depStato(d) === "vendita" ? '<button class="btn wide" data-act="dep-stato" data-id="' + d.id + '" data-v="confermata">' + ico("spunta") + esc(L("Conferma la partenza")) + '</button>' : "") +
          (depStato(d) === "confermata" ? '<button class="btn wide" data-act="dep-stato" data-id="' + d.id + '" data-v="vendita">' + esc(L("Rimetti in vendita")) + '</button>' : "") +
          (depStato(d) === "conclusa" ? "" : '<button class="btn wide" data-act="dep-stato" data-id="' + d.id + '" data-v="conclusa">' + esc(L("Segna come conclusa")) + '</button>') +
          '<button class="btn wide" data-act="dup-partenza" data-id="' + d.id + '">' + ico("copia") + esc(L("Duplica per un'altra data")) + '</button>' +
          '<button class="btn wide" data-act="stampa" data-doc="locandina" data-id="' + d.id + '">' + ico("stampa") + esc(L("Locandina da appendere")) + '</button>' +
          '<button class="btn wide" data-act="testo-promo" data-id="' + d.id + '">' + ico("copia") + esc(L("Testo per WhatsApp")) + '</button>' +
          '<button class="btn wide dang" data-act="del-partenza" data-id="' + d.id + '">' + ico("cestino") + esc(L("Elimina la partenza")) + '</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
};

/* --- programma --- */
SCHEDE_DEP.programma = function(d){

  return '<div class="grid" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">' +
    '<div class="card">' +
      '<div class="card-h">' + ico("mappa") + '<h3>' + esc(L("Programma giorno per giorno")) + '</h3><div class="sp"></div>' +
        '<button class="btn sm pri" data-act="nuovo-giorno" data-id="' + d.id + '">' + ico("piu") + esc(L("Giorno")) + '</button></div>' +
      '<div class="card-b">' +
        (pg.length ? '<div class="tl">' + pg.map((g,i)=>
          '<div class="tl-i">' +
            '<div class="row" style="align-items:baseline">' +
              '<span class="tl-d">' + esc(LN("Giorno {n}", { n:g.g || (i+1) })) + ' · ' + esc(dDay(addDays(d.inizio, (g.g || i+1) - 1))) + '</span>' +
              '<div class="sp"></div>' +
              '<button class="btn ghost sm" data-act="mod-giorno" data-id="' + d.id + '" data-x="' + i + '">' + ico("matita") + '</button>' +
              '<button class="btn ghost sm" data-act="del-giorno" data-id="' + d.id + '" data-x="' + i + '">' + ico("cestino") + '</button>' +
            '</div>' +
            '<div class="tl-t">' + esc(g.titolo) + '</div>' +
            '<div class="tl-x">' + esc(g.testo) + '</div>' +
            '<div class="pill-row" style="margin-top:6px">' +
              (g.pasti ? '<span class="chip">' + esc(L("pasti")) + ': ' + esc(g.pasti) + '</span>' : "") +
              (g.hotel ? '<span class="chip b">' + ico("letto") + esc(nomeF(g.hotel)) + '</span>' : "") +
            '</div>' +
          '</div>').join("") + '</div>'
        : vuoto(L("Programma ancora vuoto"), '<button class="btn pri mt" data-act="nuovo-giorno" data-id="' + d.id + '">' + esc(L("Aggiungi il primo giorno")) + '</button>')) +
      '</div>' +
    '</div>' +
    '<div class="stack">' +
      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("A cosa serve")) + '</h3>' +
        '<p class="small muted">' + esc(L("Il programma finisce sul foglio di viaggio dell'accompagnatore, sulla locandina e sulla conferma che si consegna al cliente. Scrivilo una volta sola: si stampa da tre parti diverse.")) + '</p>' +
        '<button class="btn wide mt" data-act="stampa" data-doc="programma" data-id="' + d.id + '">' + ico("stampa") + esc(L("Stampa il programma")) + '</button>' +
        '<button class="btn wide mt" data-act="copia-programma" data-id="' + d.id + '">' + ico("copia") + esc(L("Copia come testo")) + '</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-h">' + ico("letto") + '<h3>' + esc(L("Hotel del viaggio")) + '</h3></div>' +
        '<div>' + (function(){
          const hs = {};
          pg.forEach(g=>{ if(g.hotel) hs[g.hotel] = (hs[g.hotel]||0) + 1; });
          const ks = Object.keys(hs);
          return ks.length ? ks.map(k=>{ const f = forById(k); return f ?
            '<div class="list-i" data-go="fornitore/' + f.id + '"><div class="av b">' + ico("letto") + '</div>' +
            '<div style="flex:1"><div class="li-t">' + esc(f.nome) + '</div><div class="li-s">' + esc(f.citta) + ' · ' + esc(LN("{n} notti", { n:hs[k] })) + '</div></div>' +
            ico("avanti") + '</div>' : ""; }).join("")
            : '<div class="empty small">' + esc(L("Nessun hotel indicato nel programma")) + '</div>';
        })() + '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
};

/* --- costi e quota --- */
SCHEDE_DEP.costi = function(d){
  const n = depVenduti(d) || nz(d.minimo) || 1;
  const scaglioni = [nz(d.minimo), Math.round(nz(d.posti) * .75), nz(d.posti)].filter((x,i,a)=> x > 0 && a.indexOf(x) === i).sort((a,b)=> a-b);
  if(depVenduti(d) && scaglioni.indexOf(depVenduti(d)) < 0) scaglioni.push(depVenduti(d));
  scaglioni.sort((a,b)=> a-b);
  const gr = gratuita(d, n);

  return '<div class="grid" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">' +
    '<div class="stack">' +
      '<div class="card">' +
        '<div class="card-h">' + ico("borsello") + '<h3>' + esc(L("Cosa ci costa")) + '</h3><div class="sp"></div>' +
          '<button class="btn sm pri" data-act="nuovo-costo" data-id="' + d.id + '">' + ico("piu") + esc(L("Voce di costo")) + '</button></div>' +
        '<div class="scroll-x"><table class="tbl"><thead><tr>' +
          '<th>' + esc(L("Voce")) + '</th><th>' + esc(L("Fornitore")) + '</th><th>' + esc(L("Tipo")) + '</th>' +
          '<th class="num">' + esc(L("Importo")) + '</th><th class="num">' + esc(LN("A {n} pax", { n:n })) + '</th><th></th></tr></thead><tbody>' +
          (d.costi||[]).map(c=>{
            const gratis = c.tipo === "pax" && c.ogni ? Math.floor(n / c.ogni) : 0;
            const tot = c.tipo === "fisso" ? nz(c.importo) : nz(c.importo) * Math.max(0, n - gratis);
            return '<tr class="clickable" data-act="mod-costo" data-id="' + d.id + '" data-x="' + c.id + '">' +
              '<td><b>' + esc(c.voce) + '</b>' + (c.ogni ? '<div class="tiny dim">' + esc(LN("1 gratuità ogni {n}", { n:c.ogni })) + (gratis ? " · " + LN("{n} gratis", { n:gratis }) : "") + '</div>' : "") + '</td>' +
              '<td class="small muted">' + esc(c.fornitoreId ? nomeF(c.fornitoreId) : "—") + '</td>' +
              '<td><span class="chip ' + (c.tipo === "fisso" ? "v" : "b") + '">' + esc(L(c.tipo === "fisso" ? "fisso" : "a persona")) + '</span></td>' +
              '<td class="num">' + eur(c.importo) + '</td>' +
              '<td class="num"><b>' + eur(tot,0) + '</b></td>' +
              '<td class="right"><button class="btn ghost sm" data-act="del-costo" data-id="' + d.id + '" data-x="' + c.id + '">' + ico("cestino") + '</button></td></tr>';
          }).join("") +
        '</tbody><tfoot><tr style="border-top:2px solid var(--sep-2)">' +
          '<td colspan="4"><b>' + esc(LN("Costo totale con {n} partecipanti", { n:n })) + '</b></td>' +
          '<td class="num"><b>' + eur(costoTot(d, n),0) + '</b></td><td></td></tr></tfoot></table></div>' +
        (gr.length ? '<div class="card-b"><div class="ok-box">' + ico("stella") + " " +
          esc(gr.map(g=> LN("{n} gratuità su: {v}", { n:g.n, v:g.voce })).join(" · ")) + '</div></div>' : "") +
      '</div>' +

      '<div class="card">' +
        '<div class="card-h">' + ico("grafico") + '<h3>' + esc(L("Quanto costa a testa, al variare del gruppo")) + '</h3></div>' +
        '<div class="scroll-x"><table class="tbl"><thead><tr>' +
          '<th>' + esc(L("Partecipanti")) + '</th><th class="num">' + esc(L("Costo a persona")) + '</th>' +
          '<th class="num">' + esc(L("Quota di vendita")) + '</th><th class="num">' + esc(L("Margine a persona")) + '</th><th class="num">' + esc(L("Margine totale")) + '</th></tr></thead><tbody>' +
          scaglioni.map(s=>{
            const cpp = costoPP(d, s), mar = nz(d.quota) - cpp;
            return '<tr' + (s === depVenduti(d) ? ' style="background:var(--brand-soft)"' : "") + '>' +
              '<td><b>' + s + '</b>' + (s === nz(d.minimo) ? ' <span class="chip a">' + esc(L("minimo")) + '</span>' : "") +
                (s === depVenduti(d) ? ' <span class="chip br">' + esc(L("adesso")) + '</span>' : "") +
                (s === nz(d.posti) ? ' <span class="chip g">' + esc(L("pieno")) + '</span>' : "") + '</td>' +
              '<td class="num">' + eur(cpp) + '</td><td class="num">' + eur(d.quota) + '</td>' +
              '<td class="num" style="color:' + (mar > 0 ? "var(--green)" : "var(--red)") + '">' + eur(mar) + '</td>' +
              '<td class="num"><b>' + eur(mar * s, 0) + '</b></td></tr>';
          }).join("") +
        '</tbody></table></div>' +
      '</div>' +
    '</div>' +

    '<div class="stack">' +
      '<div class="card">' +
        '<div class="card-h">' + ico("soldi") + '<h3>' + esc(L("La quota")) + '</h3><div class="sp"></div>' +
          '<button class="btn ghost sm" data-act="mod-partenza" data-id="' + d.id + '">' + ico("matita") + '</button></div>' +
        '<div class="card-b">' +
          riga(L("Quota adulto"), eur(d.quota)) +
          riga(L("Quota ridotta (under 18)"), eur(d.quotaRid)) +
          riga(L("Supplemento singola"), eur(d.supSingola)) +
          riga(L("Riduzione in tripla"), "− " + eur(d.ridTripla)) +
          riga(L("Acconto alla firma"), eur(d.acconto)) +
          '<div class="sep-line"></div>' +
          riga(L("Costo a persona adesso"), eur(costoPP(d, n))) +
          riga(L("Margine a persona"), '<span style="color:' + (nz(d.quota) - costoPP(d,n) > 0 ? "var(--green)" : "var(--red)") + '">' + eur(nz(d.quota) - costoPP(d, n)) + '</span>') +
          riga(L("Ricarico"), pct(nz(d.quota) ? (nz(d.quota) - costoPP(d,n)) / nz(d.quota) * 100 : 0), "tot") +
        '</div>' +
      '</div>' +

      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Prezzo consigliato")) + '</h3>' +
        '<div class="row" style="align-items:baseline;gap:8px">' +
          '<div style="font-size:32px;font-weight:800;letter-spacing:-.03em">' + eur(prezzoConsigliato(d, nz(d.minimo)), 0) + '</div>' +
          '<span class="muted small">' + esc(LN("con {n} iscritti e {r}% di ricarico", { n: d.minimo, r: DB.meta.ricarico })) + '</span>' +
        '</div>' +
        '<div class="small muted mt">' + esc(L("Calcolato sul minimo: se parti in meno, ci rimetti; se parti in più, il margine cresce.")) + '</div>' +
        '<button class="btn wide mt" data-act="usa-prezzo" data-id="' + d.id + '">' + esc(L("Usa questo prezzo")) + '</button>' +
      '</div>' +

      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Punto di pareggio")) + '</h3>' +
        (pareggio(d) ?
          '<div class="row"><div style="font-size:32px;font-weight:800;letter-spacing:-.03em">' + pareggio(d) + '</div>' +
          '<div class="small muted">' + esc(L("paganti per coprire tutti i costi")) + '</div></div>' +
          barra(Math.min(100, depVenduti(d) / pareggio(d) * 100), depVenduti(d) >= pareggio(d) ? "g" : "a") +
          '<div class="small mt ' + (depVenduti(d) >= pareggio(d) ? "" : "") + '">' +
            (depVenduti(d) >= pareggio(d)
              ? '<span class="chip g">' + esc(LN("superato di {n}", { n: depVenduti(d) - pareggio(d) })) + '</span>'
              : '<span class="chip a">' + esc(LN("mancano {n} iscritti", { n: pareggio(d) - depVenduti(d) })) + '</span>') +
          '</div>'
        : '<div class="danger">' + esc(L("Con questa quota non si arriva mai al pareggio: alza il prezzo o taglia i costi.")) + '</div>') +
      '</div>' +
    '</div>' +
  '</div>';
};
</script>
<script>
/* --- pratiche della partenza --- */
SCHEDE_DEP.pratiche = function(d){
  const P = depPratiche(d).sort((a,b)=> String(b.creata).localeCompare(String(a.creata)));
  return '<div class="card">' +
    '<div class="card-h">' + ico("scheda") + '<h3>' + esc(LN("{n} pratiche · {p} passeggeri", { n: depVive(d).length, p: depVenduti(d) })) + '</h3>' +
      '<div class="sp"></div>' +
      '<button class="btn sm" data-act="stampa" data-doc="elenco" data-id="' + d.id + '">' + ico("stampa") + esc(L("Elenco")) + '</button>' +
      '<button class="btn sm pri" data-act="nuova-pratica" data-id="' + d.id + '">' + ico("piu") + esc(L("Nuova")) + '</button></div>' +
    '<div class="scroll-x"><table class="tbl"><thead><tr>' +
      '<th>' + esc(L("Pratica")) + '</th><th>' + esc(L("Cliente")) + '</th><th class="num">' + esc(L("Pax")) + '</th>' +
      '<th>' + esc(L("Camere")) + '</th><th class="num">' + esc(L("Totale")) + '</th><th class="num">' + esc(L("Pagato")) + '</th>' +
      '<th class="num">' + esc(L("Residuo")) + '</th><th>' + esc(L("Stato")) + '</th></tr></thead><tbody>' +
      (P.length ? P.map(p=>{
        const res = pratResiduo(p, d), rit = pratInRitardo(p, d);
        return '<tr class="clickable" data-go="pratica/' + p.id + '">' +
          '<td><b class="mono">' + esc(p.codice) + '</b><div class="tiny dim">' + esc(dIT(p.creata)) + '</div></td>' +
          '<td class="trunc" style="max-width:190px">' + esc(nomeC(p.clienteId)) + '</td>' +
          '<td class="num">' + pratPax(p) + '</td>' +
          '<td class="small muted">' + esc((p.camere||[]).map(r=> r.tipo.toUpperCase()).join(" ") || "—") + '</td>' +
          '<td class="num">' + eur(pratTotale(p, d),0) + '</td>' +
          '<td class="num">' + eur(pratPagato(p),0) + '</td>' +
          '<td class="num"' + (rit ? ' style="color:var(--red);font-weight:700"' : "") + '>' + (res > 0.5 ? eur(res,0) : "—") + '</td>' +
          '<td>' + praChip(p) + (rit ? ' <span class="chip r">' + esc(L("in ritardo")) + '</span>' : "") + '</td></tr>';
      }).join("") : '<tr><td colspan="8">' + vuoto(L("Nessuna pratica su questa partenza")) + '</td></tr>') +
    '</tbody></table></div></div>';
};

/* --- rooming list --- */
SCHEDE_DEP.rooming = function(d){
  const R = roomingDi(d), fuori = senzaCamera(d), conta = roomingConta(d);
  const tot = Object.keys(conta).map(k=> conta[k] + " " + camLab(k)).join(" · ");
  return '<div class="grid" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)">' +
    '<div class="card">' +
      '<div class="card-h">' + ico("letto") + '<h3>' + esc(L("Rooming list")) + '</h3><div class="sp"></div>' +
        '<button class="btn sm" data-act="stampa" data-doc="rooming" data-id="' + d.id + '">' + ico("stampa") + esc(L("Per l'hotel")) + '</button></div>' +
      '<div class="card-b">' +
        (R.length ? '<div class="grid g-auto">' + R.map((x,i)=>{
          const cap = camCap(x.r.tipo), n = (x.r.ids||[]).length;
          return '<div class="room ' + (n === cap ? "full" : n > cap ? "over" : "") + '">' +
            '<div class="r-h"><span class="chip ' + (x.r.tipo === "dus" || x.r.tipo === "sng" ? "a" : "b") + '">' + esc(camLab(x.r.tipo)) + '</span>' +
              '<div class="sp"></div><span class="tiny dim">' + esc(x.pra.codice) + '</span>' +
              '<button class="btn ghost sm" data-act="mod-camera" data-id="' + x.pra.id + '" data-x="' + x.r.id + '">' + ico("matita") + '</button></div>' +
            (x.r.ids||[]).map(id=> paxAvatar(id)).join("") +

/* --- posti in bus --- */
let SEL_PAX = null;
SCHEDE_DEP.bus = function(d){
  const occ = postiOccupati(d), liberi = senzaPosto(d);
  const file = nz(d.bus && d.bus.file) || 12;
  const bloccati = (d.bus && d.bus.bloccati) || [];
  let html = "";
  for(let f = 0; f < file; f++){
    const base = f * 4;
    html += '<div class="bus-row">' +
      [1,2].map(k=> seatHtml(d, base + k, occ, bloccati)).join("") +
      '<div class="aisle">' + (f+1) + '</div>' +
      [3,4].map(k=> seatHtml(d, base + k, occ, bloccati)).join("") +
      '</div>';
  }
  return '<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">' +
    '<div class="card">' +
      '<div class="card-h">' + ico("bus") + '<h3>' + esc(d.mezzo === "volo" ? L("Posti assegnati") : L("Piantina del bus")) + '</h3>' +
        '<div class="sp"></div>' +
        '<button class="btn ghost sm" data-act="config-bus" data-id="' + d.id + '">' + ico("ingranaggio") + '</button>' +
        '<button class="btn sm" data-act="stampa" data-doc="bus" data-id="' + d.id + '">' + ico("stampa") + '</button></div>' +
      '<div class="card-b center">' +
        (SEL_PAX ? '<div class="info mb">' + esc(LN("Tocca un posto libero per {chi}", { chi: nomeP(SEL_PAX.personId) })) +
          ' <button class="btn ghost sm" data-act="annulla-sel">' + esc(L("annulla")) + '</button></div>' : "") +
        '<div class="bus"><div class="b-front">' + esc(L("autista")) + ' · ' + esc(L("porta")) + '</div>' + html + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="stack">' +
      '<div class="card pad">' +
        '<div class="row"><h3>' + esc(L("Da sistemare")) + '</h3><div class="sp"></div>' +
          '<span class="chip ' + (liberi.length ? "a" : "g") + '">' + liberi.length + '</span></div>' +
        '<div class="small muted mb">' + esc(L("Tocca una persona e poi il posto sulla piantina.")) + '</div>' +
        (liberi.length ? liberi.map(x=>
          '<div class="pax-chip" data-act="sel-pax" data-id="' + x.pra.id + '" data-x="' + x.pax.personId + '" style="cursor:pointer' +
            (SEL_PAX && SEL_PAX.personId === x.pax.personId ? ";outline:2px solid var(--accent)" : "") + '">' +
          avatar(perById(x.pax.personId) || {}, "sm") + '<span>' + esc(nomeP(x.pax.personId)) + '</span>' +
          '<span class="tiny dim" style="margin-left:auto">' + esc(x.pra.codice) + '</span></div>').join("")
        : '<div class="ok-box">' + esc(L("Tutti hanno un posto.")) + '</div>') +
        '<button class="btn wide mt" data-act="posti-auto" data-id="' + d.id + '">' + ico("sincro") + esc(L("Assegna in automatico")) + '</button>' +
        '<button class="btn wide mt" data-act="posti-azzera" data-id="' + d.id + '">' + esc(L("Azzera i posti")) + '</button>' +
      '</div>' +
      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Come funziona")) + '</h3>' +
        '<p class="small muted">' + esc(L("I posti bloccati (autista, accompagnatore, guida) si impostano dall'ingranaggio. Chi ha problemi a stare in fondo va sistemato davanti: la piantina si stampa e si consegna all'autista.")) + '</p>' +
      '</div>' +
    '</div>' +
  '</div>';
};
function seatHtml(d, n, occ, bloccati){
  if(bloccati.indexOf(n) >= 0) return '<div class="seat block">' + n + '</div>';
  const o = occ[n];
  if(o){
    const p = perById(o.personId);
    return '<div class="seat taken" data-act="posto" data-id="' + d.id + '" data-x="' + n + '" title="' + esc(nomeP(o.personId)) + '">' +
      '<b>' + n + '</b><span>' + esc((p ? p.cognome : "").slice(0,7)) + '</span></div>';
  }
  return '<div class="seat free" data-act="posto" data-id="' + d.id + '" data-x="' + n + '"><b>' + n + '</b></div>';
}

    '<div class="card">' +
      '<div class="card-h">' + ico("spunta") + '<h3>' + esc(L("Appello alla partenza")) + '</h3><div class="sp"></div>' +
        '<span class="chip ' + (presenti === gente.length && gente.length ? "g" : "a") + '">' + presenti + " / " + gente.length + '</span>' +
        '<button class="btn sm" data-act="stampa" data-doc="appello" data-id="' + d.id + '">' + ico("stampa") + '</button></div>' +
      '<div>' + (gente.length ? gente.map(x=>{
        const ok = x.pra.appello && x.pra.appello[x.p.id];
        const posto = x.pra.posti && x.pra.posti[x.p.id];
        return '<label class="list-i" style="cursor:pointer">' +
          '<input type="checkbox" data-ch="appello" data-id="' + x.pra.id + '" data-x="' + x.p.id + '"' + (ok ? " checked" : "") + '>' +
          avatar(x.p) +
          '<div style="flex:1;min-width:0"><div class="li-t' + (ok ? '" style="opacity:.55' : "") + '">' + esc(x.p.cognome + " " + x.p.nome) + '</div>' +
          '<div class="li-s">' + esc(x.pra.codice) + (x.p.tel ? " · " + esc(x.p.tel) : "") +
            (x.p.mobilita ? ' · <span style="color:var(--amber)">' + esc(x.p.mobilita) + '</span>' : "") + '</div></div>' +
          (posto ? '<span class="chip b">' + esc(L("posto")) + ' ' + posto + '</span>' : "") +
        '</label>';
      }).join("") : vuoto(L("Nessun passeggero"))) + '</div>' +
    '</div>' +
    '<div class="stack">' +
      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Chi manca")) + '</h3>' +
        (function(){
          const m = gente.filter(x=> !(x.pra.appello && x.pra.appello[x.p.id]));
          return m.length ? m.map(x=> '<div class="row" style="padding:4px 0"><span class="dot" style="background:var(--red)"></span>' +
            '<span>' + esc(x.p.cognome + " " + x.p.nome) + '</span><div class="sp"></div>' +
            (x.p.tel ? '<a class="btn ghost sm" href="tel:' + esc(x.p.tel.replace(/\s/g,"")) + '">' + ico("telefono") + '</a>' : "") + '</div>').join("")
            : '<div class="ok-box">' + esc(L("Ci sono tutti. Si parte.")) + '</div>';
        })() +
        '<button class="btn wide mt" data-act="appello-azzera" data-id="' + d.id + '">' + esc(L("Azzera l'appello")) + '</button>' +
      '</div>' +
      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Note utili in partenza")) + '</h3>' +
        (function(){
          const note = [];
          gente.forEach(x=>{
            if(x.p.diete) note.push({ n:x.p.cognome + " " + x.p.nome, t: L("dieta") + ": " + x.p.diete });
            if(x.p.mobilita) note.push({ n:x.p.cognome + " " + x.p.nome, t: L("mobilità") + ": " + x.p.mobilita });
          });
          return note.length ? note.map(n=> '<div class="kv"><span>' + esc(n.n) + '</span><b class="small">' + esc(n.t) + '</b></div>').join("")
            : '<div class="small muted">' + esc(L("Nessuna segnalazione particolare.")) + '</div>';
        })() +
      '</div>' +
    '</div>' +
  '</div>';
};

/* --- fornitori della partenza --- */
SCHEDE_DEP.fornitori = function(d){
  const F = d.fornitura || [];
  const tot = sum(F.map(f=> f.importo)), pag = sum(F.map(f=> f.acconto));
  return '<div class="grid" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)">' +
    '<div class="card">' +
      '<div class="card-h">' + ico("palazzo") + '<h3>' + esc(L("Servizi prenotati")) + '</h3><div class="sp"></div>' +
        '<button class="btn sm pri" data-act="nuova-fornitura" data-id="' + d.id + '">' + ico("piu") + esc(L("Servizio")) + '</button></div>' +
      '<div class="scroll-x"><table class="tbl"><thead><tr>' +
        '<th>' + esc(L("Fornitore")) + '</th><th>' + esc(L("Servizio")) + '</th><th class="num">' + esc(L("Importo")) + '</th>' +
        '<th class="num">' + esc(L("Pagato")) + '</th><th>' + esc(L("Scadenza")) + '</th><th>' + esc(L("Stato")) + '</th><th></th></tr></thead><tbody>' +
        (F.length ? F.map(f=>{
          const rit = fResiduo(f) > 0 && f.saldoData && toGo(f.saldoData) < 0;
          return '<tr class="clickable" data-act="mod-fornitura" data-id="' + d.id + '" data-x="' + f.id + '">' +
            '<td><b>' + esc(nomeF(f.fornitoreId)) + '</b></td>' +
            '<td class="small muted">' + esc(f.voce) + '</td>' +
            '<td class="num">' + eur(f.importo,0) + '</td>' +
            '<td class="num">' + eur(f.acconto,0) + '</td>' +
            '<td class="small' + (rit ? '" style="color:var(--red);font-weight:700' : "") + '">' + (f.saldoData ? esc(dIT(f.saldoData)) : "—") + '</td>' +
            '<td><span class="chip ' + (f.stato === "saldato" ? "g" : f.stato === "acconto" ? "b" : f.stato === "opzione" ? "v" : "a") + '">' + esc(L(f.stato)) + '</span></td>' +
            '<td class="right">' + (fResiduo(f) > 0 ? '<button class="btn sm" data-act="paga-fornitura" data-id="' + d.id + '" data-x="' + f.id + '">' + esc(L("Paga")) + '</button>' : ico("spunta")) + '</td></tr>';
        }).join("") : '<tr><td colspan="7">' + vuoto(L("Nessun servizio prenotato")) + '</td></tr>') +
      '</tbody></table></div>' +
    '</div>' +
    '<div class="stack">' +
      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Impegni con i fornitori")) + '</h3>' +
        riga(L("Totale servizi"), eur(tot,0)) +
        riga(L("Già pagato"), eur(pag,0)) +
        riga(L("Ancora da pagare"), '<span style="color:' + (tot - pag > 0 ? "var(--red)" : "var(--green)") + '">' + eur(tot - pag, 0) + '</span>', "tot") +
        barra(tot ? pag/tot*100 : 0, "g") +
        '<div class="sep-line"></div>' +
        riga(L("Incassato dai clienti"), eur(depIncassato(d),0)) +
        riga(L("Cassa della partenza"), '<b style="color:' + (depIncassato(d) - pag >= 0 ? "var(--green)" : "var(--red)") + '">' + eur(depIncassato(d) - pag, 0) + '</b>') +
        '<div class="tiny dim mt">' + esc(L("Quanto hai in mano meno quanto hai già dato via.")) + '</div>' +
      '</div>' +
      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Contatti del viaggio")) + '</h3>' +
        (function(){
          const ids = {};
          F.forEach(f=> ids[f.fornitoreId] = 1);
          (d.programma||[]).forEach(g=>{ if(g.hotel) ids[g.hotel] = 1; });
          (d.costi||[]).forEach(c=>{ if(c.fornitoreId) ids[c.fornitoreId] = 1; });
          const ks = Object.keys(ids).filter(k=> forById(k));
          return ks.length ? ks.map(k=>{ const f = forById(k);
            return '<div class="list-i" data-go="fornitore/' + f.id + '" style="padding-left:0;padding-right:0">' +
              '<div class="av ' + ["b","a","v","g"][f.nome.length % 4] + '">' + esc(initials(f.nome, f.nome.split(" ")[1] || f.nome[1])) + '</div>' +
              '<div style="flex:1;min-width:0"><div class="li-t trunc">' + esc(f.nome) + '</div><div class="li-s">' + esc(L(f.tipo)) + ' · ' + esc(f.tel) + '</div></div>' +
              ico("avanti") + '</div>'; }).join("")
            : '<div class="small muted">—</div>';
        })() +
      '</div>' +
    '</div>' +
  '</div>';
};
</script>
<script>
/* ---------- ELENCO PRATICHE ---------- */
let F_PRA = { q:"", stato:"tutte" };
VISTE.pratiche = function(){
  let P = DB.pratiche.slice().sort((a,b)=> String(b.creata).localeCompare(String(a.creata)));
  if(F_PRA.stato === "ritardo") P = P.filter(p=> pratInRitardo(p));
  else if(F_PRA.stato !== "tutte") P = P.filter(p=> p.stato === F_PRA.stato);
  if(F_PRA.q){
    const q = F_PRA.q.toLowerCase();
    P = P.filter(p=> (p.codice + " " + nomeC(p.clienteId) + " " + ((depById(p.depId)||{}).titolo || "") + " " +
      (p.pax||[]).map(x=> nomeP(x.personId)).join(" ")).toLowerCase().indexOf(q) >= 0);
  }
  const tot = sum(P.filter(p=> p.stato !== "annullata").map(p=> pratTotale(p)));
  const inc = sum(P.filter(p=> p.stato !== "annullata").map(pratPagato));

  intesta(L("Pratiche"), LN("{n} pratiche", { n:P.length }),
    '<button class="btn pri" data-act="nuova-pratica">' + ico("piu") + '<span class="nowrap">' + esc(L("Nuova pratica")) + '</span></button>');

  return '<div class="stack">' +
    '<div class="grid g4 keep2">' +
      kpi(L("Valore pratiche"), eur(tot,0), esc(LN("{n} attive", { n: P.filter(p=> p.stato !== "annullata").length })), "br") +
      kpi(L("Incassato"), eur(inc,0), pct(tot ? inc/tot*100 : 0)) +
      kpi(L("Da incassare"), eur(Math.max(0, tot-inc),0)) +
      kpi(L("In ritardo"), num(DB.pratiche.filter(p=> pratInRitardo(p)).length), esc(L("saldi scaduti"))) +
    '</div>' +
    '<div class="row wrap">' +
      '<div class="search" style="flex:1;min-width:200px">' + ico("cerca") +
        '<input type="search" id="q-pra" placeholder="' + esc(L("Cerca codice, cliente, passeggero…")) + '" value="' + esc(F_PRA.q) + '" data-ch="q-pra">' +
      '</div>' +
      '<div class="btn-group">' +
        [["tutte","Tutte"],["opzione","Opzioni"],["confermata","Confermate"],["saldata","Saldate"],["ritardo","In ritardo"]].map(x=>
          '<button class="' + (F_PRA.stato === x[0] ? "on" : "") + '" data-ch="f-pra" data-v="' + x[0] + '">' + esc(L(x[1])) + '</button>').join("") +
      '</div>' +
    '</div>' +
    '<div class="card scroll-x"><table class="tbl"><thead><tr>' +
      '<th>' + esc(L("Pratica")) + '</th><th>' + esc(L("Cliente")) + '</th><th>' + esc(L("Viaggio")) + '</th>' +
      '<th class="num">' + esc(L("Pax")) + '</th><th class="num">' + esc(L("Totale")) + '</th><th class="num">' + esc(L("Residuo")) + '</th>' +
      '<th>' + esc(L("Scadenza")) + '</th><th>' + esc(L("Stato")) + '</th></tr></thead><tbody>' +
      (P.length ? P.slice(0,180).map(p=>{
        const d = depById(p.depId), res = pratResiduo(p, d), rit = pratInRitardo(p, d);
        const scad = p.stato === "opzione" ? p.scadenzaOpzione : pratScadenzaSaldo(p, d);
        return '<tr class="clickable" data-go="pratica/' + p.id + '">' +
          '<td><b class="mono">' + esc(p.codice) + '</b><div class="tiny dim">' + esc(dIT(p.creata)) + '</div></td>' +
          '<td class="trunc" style="max-width:180px">' + esc(nomeC(p.clienteId)) + '</td>' +
          '<td class="trunc small" style="max-width:190px">' + (d ? esc(bandiera(d) + " " + d.titolo) + '<div class="tiny dim">' + esc(dIT(d.inizio)) + '</div>' : "—") + '</td>' +
          '<td class="num">' + pratPax(p) + '</td>' +
          '<td class="num">' + eur(pratTotale(p, d),0) + '</td>' +
          '<td class="num"' + (rit ? ' style="color:var(--red);font-weight:700"' : "") + '>' + (res > 0.5 ? eur(res,0) : "—") + '</td>' +
          '<td class="small' + (scad && toGo(scad) < 0 && res > 0.5 ? '" style="color:var(--red)' : "") + '">' + (scad ? esc(dShort(scad)) : "—") + '</td>' +
          '<td>' + praChip(p) + '</td></tr>';
      }).join("") : '<tr><td colspan="8">' + vuoto(L("Nessuna pratica")) + '</td></tr>') +
    '</tbody></table></div>' +
  '</div>';
};

/* ---------- SCHEDA PRATICA ---------- */
VISTE.pratica = function(id){
  const p = praById(id);
  if(!p) return vuoto(L("Pratica non trovata"));
  const d = depById(p.depId);
  const cli = cliById(p.clienteId);
  const tot = pratTotale(p, d), pag = pratPagato(p), res = pratResiduo(p, d);
  const scadSaldo = pratScadenzaSaldo(p, d);
  const rit = pratInRitardo(p, d);

  intesta(p.codice, cli ? cli.nome : "",
    '<button class="btn ghost ico" data-go="pratiche">' + ico("indietro") + '</button>' +
    '<button class="btn" data-act="stampe-pratica" data-id="' + p.id + '">' + ico("stampa") + '<span class="nowrap">' + esc(L("Stampe")) + '</span></button>' +
    (res > 0.5 ? '<button class="btn pri" data-act="incassa" data-id="' + p.id + '">' + ico("soldi") + '<span class="nowrap">' + esc(L("Incassa")) + '</span></button>' : ""));

  return '<div class="grid" style="grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)">' +

    '<div class="stack">' +
      /* testa */
      '<div class="card">' +
        '<div class="card-b row wrap" style="gap:14px">' +
          '<div style="flex:1;min-width:220px">' +
            '<div class="row"><span class="mono" style="font-size:17px;font-weight:800">' + esc(p.codice) + '</span>' + praChip(p) +
              (rit ? '<span class="chip r">' + esc(L("saldo in ritardo")) + '</span>' : "") + '</div>' +
            '<div class="mt small muted">' + esc(L("Cliente")) + '</div>' +
            '<div class="row"><b style="font-size:15px">' + esc(cli ? cli.nome : "—") + '</b>' +
              (cli ? '<button class="btn ghost sm" data-go="cliente/' + cli.id + '">' + ico("avanti") + '</button>' : "") + '</div>' +
            (cli && cli.tel ? '<div class="small muted">' + esc(cli.tel) + (cli.email ? " · " + esc(cli.email) : "") + '</div>' : "") +
          '</div>' +
          (d ? '<div style="flex:1;min-width:220px;border-left:1px solid var(--sep);padding-left:14px">' +
            '<div class="small muted">' + esc(L("Viaggio")) + '</div>' +
            '<div class="row" data-go="partenza/' + d.id + '" style="cursor:pointer"><span style="font-size:20px">' + bandiera(d) + '</span>' +
              '<b>' + esc(d.titolo) + '</b>' + ico("avanti") + '</div>' +
            '<div class="small muted">' + esc(periodo(d.inizio, d.fine)) + '</div>' +
            '<div class="tiny dim">' + esc(d.partenzaDa || "") + '</div>' +
          '</div>' : "") +
        '</div>' +
      '</div>' +

      /* passeggeri */
      '<div class="card">' +
        '<div class="card-h">' + ico("gente") + '<h3>' + esc(LN("{n} passeggeri", { n: pratPax(p) })) + '</h3><div class="sp"></div>' +
          '<button class="btn sm pri" data-act="add-pax" data-id="' + p.id + '">' + ico("piu") + esc(L("Aggiungi")) + '</button></div>' +
        '<div class="scroll-x"><table class="tbl"><thead><tr>' +
          '<th>' + esc(L("Passeggero")) + '</th><th>' + esc(L("Nato il")) + '</th><th>' + esc(L("Documento")) + '</th>' +
          '<th>' + esc(L("Camera")) + '</th><th class="num">' + esc(L("Quota")) + '</th><th></th></tr></thead><tbody>' +
          (p.pax||[]).map(x=>{
            const per = perById(x.personId) || {};
            const st = docStato(per, d ? d.fine : today());

          ((p.camere||[]).length ? '<div class="grid g-auto">' + p.camere.map(r=>{
            const cap = camCap(r.tipo), n = (r.ids||[]).length;

              '<div class="r-h"><span class="chip ' + (cap === 1 ? "a" : "b") + '">' + esc(camLab(r.tipo)) + '</span><div class="sp"></div>' +
                '<button class="btn ghost sm" data-act="mod-camera" data-id="' + p.id + '" data-x="' + r.id + '">' + ico("matita") + '</button>' +
                '<button class="btn ghost sm" data-act="del-camera" data-id="' + p.id + '" data-x="' + r.id + '">' + ico("cestino") + '</button></div>' +
              (r.ids||[]).map(i=> paxAvatar(i)).join("") +
              (n < cap ? '<div class="tiny" style="color:var(--amber)">' + esc(LN("{n} letto libero", { n: cap-n })) + '</div>' : "") +
            '</div>';
          }).join("") + '</div>' : '<div class="warn">' + esc(L("Nessuna camera assegnata: l'hotel non può confermare.")) + '</div>') +
          (pratSenzaCamera(p).length ? '<div class="mt small muted">' + esc(L("Senza camera")) + ': ' +
            pratSenzaCamera(p).map(x=> esc(nomeP(x.personId))).join(", ") + '</div>' : "") +
        '</div>' +
      '</div>' +

      /* pagamenti */
      '<div class="card">' +
        '<div class="card-h">' + ico("soldi") + '<h3>' + esc(L("Pagamenti")) + '</h3><div class="sp"></div>' +
          '<button class="btn sm pri" data-act="incassa" data-id="' + p.id + '">' + ico("piu") + esc(L("Registra incasso")) + '</button></div>' +
        '<div class="card-b">' +
          ((p.pagamenti||[]).length ? p.pagamenti.map(pg=>
            '<div class="mv"><div class="av g sm">' + ico("spunta") + '</div>' +
              '<div><b>' + esc(pg.nota || L("Pagamento")) + '</b><div class="tiny dim">' + esc(dIT(pg.data)) + ' · ' + esc(L(pg.modo)) + '</div></div>' +
              '<div class="m-a in">+ ' + eur(pg.importo) + '</div>' +
              '<button class="btn ghost sm" data-act="del-pagamento" data-id="' + p.id + '" data-x="' + pg.id + '">' + ico("cestino") + '</button>' +
            '</div>').join("") : '<div class="small muted">' + esc(L("Nessun pagamento ancora")) + '</div>') +
          '<div class="sep-line"></div>' +
          riga(L("Totale pratica"), eur(tot)) +
          riga(L("Pagato"), eur(pag)) +
          riga(L("Residuo"), '<span style="color:' + (res > 0.5 ? "var(--red)" : "var(--green)") + '">' + eur(res) + '</span>', "tot") +
          (res > 0.5 && scadSaldo ? '<div class="' + (rit ? "danger" : "info") + ' mt">' +
            esc(rit ? LN("Saldo scaduto il {d}", { d: dIT(scadSaldo) }) : LN("Saldo entro il {d} ({q})", { d: dIT(scadSaldo), q: quando(scadSaldo) })) +
            ' <button class="btn sm" data-act="promemoria" data-id="' + p.id + '" style="margin-left:8px">' + esc(L("Promemoria")) + '</button></div>' : "") +
        '</div>' +
      '</div>' +
    '</div>' +

    /* colonna destra */
    '<div class="stack">' +
      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Il conto")) + '</h3>' +
        riga(LN("Quote ({n})", { n: pratPax(p) }), eur(pratQuote(p))) +
        (pratSupplementi(p, d) ? riga(L("Supplementi camera"), eur(pratSupplementi(p, d))) : "") +
        (p.extra||[]).map(e=> riga(e.voce + (nz(e.qta) > 1 ? " ×" + e.qta : ""), eur(nz(e.importo) * (nz(e.qta)||1)))).join("") +
        (nz(p.sconto) ? riga(L("Sconto") + (p.scontoNota ? " — " + p.scontoNota : ""), '<span style="color:var(--green)">− ' + eur(p.sconto) + '</span>') : "") +
        riga(L("Totale"), eur(tot), "tot") +
        '<div class="row mt" style="gap:6px">' +
          '<button class="btn sm" data-act="add-extra" data-id="' + p.id + '">' + ico("piu") + esc(L("Extra")) + '</button>' +
          '<button class="btn sm" data-act="sconto" data-id="' + p.id + '">' + esc(L("Sconto")) + '</button>' +
        '</div>' +
      '</div>' +

      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Stato della pratica")) + '</h3>' +
        '<div class="f"><select data-ch="pra-stato" data-id="' + p.id + '">' +
          Object.keys(STATI_PRA).map(k=> '<option value="' + k + '"' + (p.stato === k ? " selected" : "") + '>' + esc(L(STATI_PRA[k].lab)) + '</option>').join("") +
        '</select></div>' +
        (p.stato === "opzione" ? '<div class="warn mt">' +
          esc(p.scadenzaOpzione ? LN("Opzione fino al {d} ({q})", { d: dIT(p.scadenzaOpzione), q: quando(p.scadenzaOpzione) }) : L("Opzione senza scadenza")) +
          '<div class="mt"><button class="btn sm" data-act="proroga" data-id="' + p.id + '">' + esc(L("Proroga")) + '</button> ' +
          '<button class="btn sm pri" data-act="conferma-pratica" data-id="' + p.id + '">' + esc(L("Conferma")) + '</button></div></div>' : "") +
        '<div class="sep-line"></div>' +
        riga(L("Aperta il"), dIT(p.creata)) +
        riga(L("Venditore"), p.venditore ? nomeS(p.venditore) : "—") +
        '<div class="f mt"><label>' + esc(L("Note interne")) + '</label>' +
          '<textarea data-ch="pra-note" data-id="' + p.id + '" rows="3">' + esc(p.note || "") + '</textarea></div>' +
      '</div>' +

      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Stampe e invii")) + '</h3>' +
        '<div class="stack" style="gap:7px">' +
          '<button class="btn wide" data-act="stampa" data-doc="conferma" data-id="' + p.id + '">' + ico("scheda") + esc(L("Conferma di prenotazione")) + '</button>' +
          '<button class="btn wide" data-act="stampa" data-doc="ricevuta" data-id="' + p.id + '">' + ico("stampa") + esc(L("Ricevuta di pagamento")) + '</button>' +
          '<button class="btn wide" data-act="stampa" data-doc="estratto" data-id="' + p.id + '">' + ico("soldi") + esc(L("Estratto conto")) + '</button>' +
          '<button class="btn wide" data-act="promemoria" data-id="' + p.id + '">' + ico("copia") + esc(L("Messaggio al cliente")) + '</button>' +
          (puo("fatture") ? '<button class="btn wide" data-act="fat-da-pratica" data-id="' + p.id + '">' + ico("tessera") + esc(L("Fattura")) + '</button>' : "") +
        '</div>' +
        '<div class="sep-line"></div>' +
        '<button class="btn wide dang" data-act="del-pratica" data-id="' + p.id + '">' + ico("cestino") + esc(L("Elimina la pratica")) + '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
};
