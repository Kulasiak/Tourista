<script>
/* ---------- PASSEGGERI ---------- */
let F_PER = { q:"", filtro:"tutti" };
VISTE.passeggeri = function(){
  let P = DB.persone.slice();
  const conViaggi = {};
  DB.pratiche.forEach(pr=>{ if(pr.stato !== "annullata") (pr.pax||[]).forEach(x=> conViaggi[x.personId] = (conViaggi[x.personId]||0) + 1); });
  if(F_PER.filtro === "attivi") P = P.filter(p=> conViaggi[p.id]);
  else if(F_PER.filtro === "doc") P = P.filter(p=> docStato(p).bad && conViaggi[p.id]);
  else if(F_PER.filtro === "note") P = P.filter(p=> p.diete || p.mobilita);
  if(F_PER.q){
    const q = F_PER.q.toLowerCase();
    P = P.filter(p=> (p.nome + " " + p.cognome + " " + (p.tel||"") + " " + (p.email||"") + " " + (p.citta||"")).toLowerCase().indexOf(q) >= 0);
  }
  P.sort((a,b)=> (a.cognome + a.nome).localeCompare(b.cognome + b.nome, "it"));

  intesta(L("Passeggeri"), LN("{n} in archivio", { n: DB.persone.length }),
    '<button class="btn pri" data-act="nuova-persona">' + ico("piu") + '<span class="nowrap">' + esc(L("Nuovo passeggero")) + '</span></button>');

  return '<div class="stack">' +
    '<div class="grid g4 keep2">' +
      kpi(L("In archivio"), num(DB.persone.length), "", "br") +
      kpi(L("Con un viaggio aperto"), num(Object.keys(conViaggi).length)) +
      kpi(L("Documenti da controllare"), num(DB.persone.filter(p=> docStato(p).bad && conViaggi[p.id]).length), esc(L("scaduti o mancanti"))) +
      kpi(L("Con esigenze particolari"), num(DB.persone.filter(p=> p.diete || p.mobilita).length), esc(L("diete, mobilità"))) +
    '</div>' +
    '<div class="row wrap">' +
      '<div class="search" style="flex:1;min-width:200px">' + ico("cerca") +
        '<input type="search" id="q-per" placeholder="' + esc(L("Cerca nome, telefono, città…")) + '" value="' + esc(F_PER.q) + '" data-ch="q-per">' +
      '</div>' +
      '<div class="btn-group">' +
        [["tutti","Tutti"],["attivi","In viaggio"],["doc","Documenti"],["note","Esigenze"]].map(x=>
          '<button class="' + (F_PER.filtro === x[0] ? "on" : "") + '" data-ch="f-per" data-v="' + x[0] + '">' + esc(L(x[1])) + '</button>').join("") +
      '</div>' +
    '</div>' +
    '<div class="card scroll-x"><table class="tbl"><thead><tr>' +
      '<th>' + esc(L("Passeggero")) + '</th><th>' + esc(L("Nato il")) + '</th><th>' + esc(L("Documento")) + '</th>' +
      '<th>' + esc(L("Contatti")) + '</th><th>' + esc(L("Note")) + '</th><th class="num">' + esc(L("Viaggi")) + '</th></tr></thead><tbody>' +
      (P.length ? P.slice(0,220).map(p=>{
        const st = docStato(p);
        return '<tr class="clickable" data-go="passeggero/' + p.id + '">' +
          '<td><div class="row">' + avatar(p, "sm") + '<b>' + esc(p.cognome + " " + p.nome) + '</b></div></td>' +
          '<td class="small">' + (p.nascita ? esc(dIT(p.nascita)) + ' <span class="dim">(' + eta(p.nascita) + ')</span>' : "—") + '</td>' +
          '<td><span class="chip ' + st.c + '">' + esc(p.doc || L("manca")) + (p.docScad ? " " + dt(p.docScad).getFullYear() : "") + '</span></td>' +
          '<td class="small muted">' + esc(p.tel || "—") + '</td>' +
          '<td class="small">' + (p.diete || p.mobilita ? '<span class="chip a">' + esc([p.diete, p.mobilita].filter(Boolean).join(" · ")) + '</span>' : "") + '</td>' +
          '<td class="num">' + (conViaggi[p.id] || praticheDi(p.id).length || "—") + '</td></tr>';
      }).join("") : '<tr><td colspan="6">' + vuoto(L("Nessun passeggero")) + '</td></tr>') +
    '</tbody></table></div>' +
  '</div>';
};

/* ---------- SCHEDA PASSEGGERO ---------- */
VISTE.passeggero = function(id){
  const p = perById(id);
  if(!p) return vuoto(L("Passeggero non trovato"));
  const pr = praticheDi(id).sort((a,b)=> String(b.creata).localeCompare(String(a.creata)));
  const st = docStato(p);

  intesta(p.nome + " " + p.cognome, p.citta || "",
    '<button class="btn ghost ico" data-go="passeggeri">' + ico("indietro") + '</button>' +
    '<button class="btn" data-act="mod-persona" data-id="' + p.id + '">' + ico("matita") + esc(L("Modifica")) + '</button>');

  return '<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)">' +
    '<div class="stack">' +
      '<div class="card pad">' +
        '<div class="row mb">' + avatar(p, "lg") +
          '<div><h2>' + esc(p.nome + " " + p.cognome) + '</h2>' +
          '<div class="muted small">' + (p.nascita ? esc(dLong(p.nascita)) + " · " + eta(p.nascita) + " " + esc(L("anni")) : "") + '</div></div>' +
        '</div>' +
        riga(L("Telefono"), p.tel ? '<a href="tel:' + esc(p.tel.replace(/\s/g,"")) + '">' + esc(p.tel) + '</a>' : "—") +
        riga(L("Email"), p.email ? '<a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a>' : "—") +
        riga(L("Indirizzo"), esc([p.indirizzo, p.citta].filter(Boolean).join(", ") || "—")) +
        riga(L("Codice fiscale"), esc(p.cf || "—")) +
        '<div class="sep-line"></div>' +
        riga(L("Documento"), '<span class="chip ' + st.c + '">' + esc(p.doc || L("manca")) + '</span>') +
        riga(L("Numero"), '<span class="mono">' + esc(p.docNum || "—") + '</span>') +
        riga(L("Scadenza"), p.docScad ? esc(dIT(p.docScad)) : "—") +
        riga(L("Cittadinanza"), esc(p.nazione || "—")) +
        (st.bad ? '<div class="' + (st.c === "r" ? "danger" : "warn") + ' mt">' + esc(L(st.lab)) + '</div>' : "") +
        (p.diete || p.mobilita ? '<div class="warn mt">' + esc([p.diete, p.mobilita].filter(Boolean).join(" · ")) + '</div>' : "") +
        (p.note ? '<div class="info mt">' + esc(p.note) + '</div>' : "") +
      '</div>' +
    '</div>' +
    '<div class="stack">' +
      '<div class="card">' +
        '<div class="card-h">' + ico("valigia") + '<h3>' + esc(L("I suoi viaggi")) + '</h3><div class="sp"></div>' +
          '<span class="chip">' + pr.length + '</span></div>' +
        '<div>' + (pr.length ? pr.map(x=>{
          const d = depById(x.depId);
          return '<div class="list-i" data-go="pratica/' + x.id + '">' +
            '<span style="font-size:22px">' + (d ? bandiera(d) : "🌍") + '</span>' +
            '<div style="flex:1;min-width:0"><div class="li-t trunc">' + esc(d ? d.titolo : "—") + '</div>' +
            '<div class="li-s">' + esc(d ? dIT(d.inizio) : "") + ' · ' + esc(x.codice) + '</div></div>' +
            praChip(x) + '</div>';
        }).join("") : '<div class="empty small">' + esc(L("Non ha ancora viaggiato con noi")) + '</div>') + '</div>' +
      '</div>' +
      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Azioni")) + '</h3>' +
        '<button class="btn wide" data-act="nuova-pratica-per" data-id="' + p.id + '">' + ico("piu") + esc(L("Iscrivilo a un viaggio")) + '</button>' +
        '<button class="btn wide mt dang" data-act="del-persona" data-id="' + p.id + '">' + ico("cestino") + esc(L("Elimina dall'archivio")) + '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
};

/* ---------- CLIENTI ---------- */
let F_CLI = "tutti";
VISTE.clienti = function(){
  let C = DB.clienti.slice();
  if(F_CLI !== "tutti") C = C.filter(c=> c.tipo === F_CLI);
  const val = {};
  DB.pratiche.forEach(p=>{ if(p.stato !== "annullata") val[p.clienteId] = (val[p.clienteId]||0) + pratTotale(p); });
  C.sort((a,b)=> (val[b.id]||0) - (val[a.id]||0));

  intesta(L("Clienti"), LN("{n} in rubrica", { n: DB.clienti.length }),
    '<button class="btn pri" data-act="nuovo-cliente">' + ico("piu") + '<span class="nowrap">' + esc(L("Nuovo cliente")) + '</span></button>');

  return '<div class="stack">' +
    '<div class="row wrap">' +
      '<div class="btn-group">' +
        [["tutti","Tutti"],["comitiva","Comitive"],["scuola","Scuole"],["privato","Privati"]].map(x=>
          '<button class="' + (F_CLI === x[0] ? "on" : "") + '" data-ch="f-cli" data-v="' + x[0] + '">' + esc(L(x[1])) + '</button>').join("") +
      '</div>' +
    '</div>' +
    '<div class="grid g-auto">' +
      C.slice(0,60).map(c=>{
        const n = DB.pratiche.filter(p=> p.clienteId === c.id && p.stato !== "annullata").length;
        return '<div class="card pad" data-go="cliente/' + c.id + '" style="cursor:pointer">' +
          '<div class="row mb">' +
            '<div class="av lg ' + (c.tipo === "comitiva" ? "v" : c.tipo === "scuola" ? "b" : "") + '">' +
              (c.tipo === "privato" ? esc(initials(c.nome.split(" ")[1] || c.nome, c.nome.split(" ")[0])) : ico("gente")) + '</div>' +
            '<div style="min-width:0"><b class="trunc" style="display:block">' + esc(c.nome) + '</b>' +
            '<span class="chip ' + (c.tipo === "comitiva" ? "v" : c.tipo === "scuola" ? "b" : "n") + '">' + esc(L(c.tipo)) + '</span></div>' +
          '</div>' +
          (c.ref ? '<div class="small muted">' + esc(L("Riferimento")) + ': ' + esc(c.ref) + '</div>' : "") +
          '<div class="small muted">' + esc(c.tel || "") + '</div>' +
          '<div class="row mt"><span class="chip">' + esc(LN("{n} pratiche", { n:n })) + '</span>' +
            '<div class="sp"></div><b>' + eur(val[c.id] || 0, 0) + '</b></div>' +
          (c.sconto ? '<div class="chip g mt">−' + c.sconto + '% ' + esc(L("convenzione")) + '</div>' : "") +
        '</div>';
      }).join("") +
    '</div>' +
  '</div>';
};

VISTE.cliente = function(id){
  const c = cliById(id);
  if(!c) return vuoto(L("Cliente non trovato"));
  const P = DB.pratiche.filter(p=> p.clienteId === id).sort((a,b)=> String(b.creata).localeCompare(String(a.creata)));
  const speso = sum(P.filter(p=> p.stato !== "annullata").map(p=> pratTotale(p)));
  const pax = sum(P.filter(p=> p.stato !== "annullata").map(pratPax));

  intesta(c.nome, L(c.tipo),
    '<button class="btn ghost ico" data-go="clienti">' + ico("indietro") + '</button>' +
    '<button class="btn" data-act="mod-cliente" data-id="' + c.id + '">' + ico("matita") + esc(L("Modifica")) + '</button>' +
    '<button class="btn pri" data-act="nuova-pratica-cli" data-id="' + c.id + '">' + ico("piu") + esc(L("Nuova pratica")) + '</button>');

  return '<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)">' +
    '<div class="stack">' +
      '<div class="card pad">' +
        '<div class="row mb"><div class="av lg ' + (c.tipo === "comitiva" ? "v" : "b") + '">' + ico("gente") + '</div>' +
          '<div><h2 style="font-size:19px">' + esc(c.nome) + '</h2><span class="chip">' + esc(L(c.tipo)) + '</span></div></div>' +
        riga(L("Riferimento"), esc(c.ref || "—")) +
        riga(L("Telefono"), c.tel ? '<a href="tel:' + esc(String(c.tel).replace(/\s/g,"")) + '">' + esc(c.tel) + '</a>' : "—") +
        riga(L("Email"), c.email ? '<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>' : "—") +
        riga(L("Città"), esc(c.citta || "—")) +
        (c.sconto ? riga(L("Convenzione"), "−" + c.sconto + "%") : "") +
        (c.note ? '<div class="info mt">' + esc(c.note) + '</div>' : "") +
      '</div>' +
      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Quanto vale")) + '</h3>' +
        riga(L("Pratiche"), P.length) +
        riga(L("Persone portate"), pax) +
        riga(L("Giro d'affari"), eur(speso, 0), "tot") +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-h">' + ico("scheda") + '<h3>' + esc(L("Storico pratiche")) + '</h3></div>' +
      '<div>' + (P.length ? P.map(p=>{
        const d = depById(p.depId);

};

const STATI_RIC = ["da preventivare","preventivo inviato","in trattativa","vinta","persa"];
VISTE.richieste = function(){

        '<div class="card-b stack" style="gap:9px">' +
          (items.length ? items.map(r=>
            '<div class="card pad" data-act="richiesta" data-id="' + r.id + '" style="cursor:pointer;box-shadow:none">' +
              '<b class="small">' + esc(r.nome) + '</b>' +
              '<div class="tiny dim">' + esc(r.ref || "") + '</div>' +
              '<div class="row mt" style="gap:6px"><span class="chip">' + esc(r.dest) + '</span>' +
                '<span class="chip b">' + r.pax + ' ' + esc(L("pax")) + '</span></div>' +
              '<div class="tiny dim mt">' + esc(r.periodo || "") + ' · ' + esc(quando(r.data)) + '</div>' +
            '</div>').join("") : '<div class="tiny dim center">—</div>') +
        '</div>' +
      '</div>';
    }).join("") +
  '</div>';
};

<script>
/* ---------- SCADENZARIO ---------- */
VISTE.scadenzario = function(){
  const inc = incassiAttesi(), pag = pagamentiAttesi();
  const fascia = s=>{
    const g = toGo(s);
    if(g < 0) return 0;
    if(g === 0) return 1;
    if(g <= 7) return 2;
    if(g <= 30) return 3;
    return 4;
  };
  const NOMI = ["Scaduto", "Oggi", "Entro sette giorni", "Entro il mese", "Più avanti"];
  const CLS  = ["r", "a", "b", "n", "n"];

  intesta(L("Scadenzario"), L("chi deve pagare e chi dobbiamo pagare"));

  const blocco = (titolo, lista, tipo) =>
    '<div class="card">' +
      '<div class="card-h">' + ico(tipo === "in" ? "soldi" : "palazzo") + '<h3>' + esc(titolo) + '</h3><div class="sp"></div>' +
        '<b>' + eur(sum(lista.map(x=> x.importo)), 0) + '</b></div>' +
      '<div>' +
        [0,1,2,3,4].map(f=>{
          const g = lista.filter(x=> fascia(x.scad) === f);
          if(!g.length) return "";
          return '<div class="card-b" style="border-bottom:1px solid var(--sep)">' +
            '<div class="row mb"><span class="chip ' + CLS[f] + '">' + esc(L(NOMI[f])) + '</span>' +
              '<div class="sp"></div><span class="small muted">' + eur(sum(g.map(x=> x.importo)), 0) + '</span></div>' +
            g.map(x=> tipo === "in" ?
              '<div class="mv" data-go="pratica/' + x.pra.id + '" style="cursor:pointer">' +
                '<div class="av sm ' + (f === 0 ? "" : "g") + '">' + ico("scheda") + '</div>' +
                '<div style="min-width:0"><b class="small">' + esc(x.pra.codice) + ' — ' + esc(nomeC(x.pra.clienteId)) + '</b>' +
                '<div class="tiny dim trunc">' + esc(cap(L(x.tipo))) + ' · ' + esc(x.dep.titolo) + ' · ' + esc(dIT(x.scad)) + '</div></div>' +
                '<div class="m-a in">' + eur(x.importo, 0) + '</div>' +
                '<button class="btn sm" data-act="incassa" data-id="' + x.pra.id + '">' + esc(L("Incassa")) + '</button>' +
              '</div>' :
              '<div class="mv" data-go="partenza/' + x.dep.id + '/fornitori" style="cursor:pointer">' +
                '<div class="av sm ' + (f === 0 ? "" : "b") + '">' + ico("palazzo") + '</div>' +
                '<div style="min-width:0"><b class="small">' + esc(nomeF(x.f.fornitoreId)) + '</b>' +
                '<div class="tiny dim trunc">' + esc(x.f.voce) + ' · ' + esc(x.dep.titolo) + ' · ' + esc(dIT(x.scad)) + '</div></div>' +
                '<div class="m-a out">' + eur(x.importo, 0) + '</div>' +
                '<button class="btn sm" data-act="paga-fornitura" data-id="' + x.dep.id + '" data-x="' + x.f.id + '">' + esc(L("Paga")) + '</button>' +
              '</div>').join("") +
          '</div>';
        }).join("") +
        (lista.length ? "" : '<div class="card-b">' + vuoto(L("Niente in scadenza")) + '</div>') +
      '</div>' +
    '</div>';

  const saldo = sum(inc.map(x=> x.importo)) - sum(pag.map(x=> x.importo));
  return '<div class="stack">' +
    '<div class="grid g3">' +
      kpi(L("Entrate attese"), eur(sum(inc.map(x=> x.importo)), 0), esc(LN("{n} scadenze", { n: inc.length })), "br") +
      kpi(L("Uscite previste"), eur(sum(pag.map(x=> x.importo)), 0), esc(LN("{n} fatture", { n: pag.length }))) +
      kpi(L("Differenza"), '<span style="color:' + (saldo >= 0 ? "var(--green)" : "var(--red)") + '">' + eur(saldo, 0) + '</span>', esc(L("prima delle spese di struttura"))) +
    '</div>' +
    '<div class="grid g2" style="align-items:start">' +
      blocco(L("Da incassare dai clienti"), inc, "in") +
      blocco(L("Da pagare ai fornitori"), pag, "out") +
    '</div>' +
  '</div>';
};

/* ---------- CONTABILITÀ ---------- */
VISTE.contabilita = function(id, scheda){
  scheda = scheda || "riepilogo";
  const schede = [
    { v:"riepilogo",  lab:"Riepilogo" },
    { v:"partenze",   lab:"Conto per partenza" },
    { v:"prima",      lab:"Prima nota" },
    { v:"iva",        lab:"IVA sul margine" },
    { v:"statistiche",lab:"Statistiche" },
    { v:"personale",  lab:"Personale" }
  ];
  intesta(L("Contabilità"), esc(cap(mese(today()))));
  return tab(schede, scheda, "contabilita/-") + (CONTI[scheda] ? CONTI[scheda]() : "");
};
const CONTI = {};

function contiMese(m){
  let inc = 0, spese = 0, forn = 0;
  DB.pratiche.forEach(pr=> (pr.pagamenti||[]).forEach(p=>{ if(ym(p.data) === m) inc += nz(p.importo); }));
  (DB.prima||[]).forEach(x=>{ if(ym(x.data) === m){ if(x.tipo === "uscita") spese += nz(x.importo); else inc += nz(x.importo); } });
  DB.partenze.forEach(d=> (d.fornitura||[]).forEach(f=>{ if(ym(f.accontoData) === m) forn += nz(f.acconto); }));
  return { inc:inc, spese:spese, forn:forn, saldo: inc - spese - forn };
}

CONTI.riepilogo = function(){
  const mesi = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const k = iso(d).slice(0,7);
    mesi.push(Object.assign({ k:k, lab: MESI3()[d.getMonth()] + " " + String(d.getFullYear()).slice(2) }, contiMese(k)));
  }
  const c = mesi[mesi.length-1];
  const chiuse = DB.partenze.filter(d=> depStato(d) === "conclusa");
  const ricA = sum(DB.partenze.map(depRicavi)), costA = sum(DB.partenze.map(depCosti));

  return '<div class="stack">' +
    '<div class="grid g4 keep2">' +
      kpi(L("Incassato nel mese"), eur(c.inc,0), esc(cap(mese(today()))), "br") +
      kpi(L("Pagato ai fornitori"), eur(c.forn,0)) +
      kpi(L("Spese di struttura"), eur(c.spese,0), esc(L("affitto, stipendi, utenze"))) +
      kpi(L("In cassa nel mese"), '<span style="color:' + (c.saldo >= 0 ? "var(--green)" : "var(--red)") + '">' + eur(c.saldo,0) + '</span>') +
    '</div>' +
    '<div class="grid g2" style="align-items:start">' +
      '<div class="card">' +
        '<div class="card-h">' + ico("grafico") + '<h3>' + esc(L("Sei mesi di cassa")) + '</h3></div>' +
        '<div class="scroll-x"><table class="tbl"><thead><tr><th>' + esc(L("Mese")) + '</th>' +
          '<th class="num">' + esc(L("Entrate")) + '</th><th class="num">' + esc(L("Fornitori")) + '</th>' +
          '<th class="num">' + esc(L("Spese")) + '</th><th class="num">' + esc(L("Saldo")) + '</th></tr></thead><tbody>' +
          mesi.map(m=> '<tr><td><b>' + esc(m.lab) + '</b></td>' +
            '<td class="num" style="color:var(--green)">' + eur(m.inc,0) + '</td>' +
            '<td class="num">' + eur(m.forn,0) + '</td>' +
            '<td class="num">' + eur(m.spese,0) + '</td>' +
            '<td class="num"><b style="color:' + (m.saldo >= 0 ? "var(--green)" : "var(--red)") + '">' + eur(m.saldo,0) + '</b></td></tr>').join("") +
        '</tbody></table></div>' +
      '</div>' +
      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Il quadro dell'anno")) + '</h3>' +
        riga(L("Valore dei viaggi venduti"), eur(ricA, 0)) +
        riga(L("Costi diretti dei viaggi"), eur(costA, 0)) +
        riga(L("Margine lordo"), '<span style="color:var(--green)">' + eur(ricA - costA, 0) + '</span>') +
        riga(L("Spese di struttura (dodici mesi stimati)"), eur(sum((DB.prima||[]).filter(x=> x.tipo === "uscita").map(x=> x.importo)) * 12 / Math.max(1, new Set((DB.prima||[]).map(x=> ym(x.data))).size), 0)) +
        '<div class="sep-line"></div>' +
        riga(L("Partenze concluse"), chiuse.length) +
        riga(L("Passeggeri trasportati"), sum(chiuse.map(depVenduti))) +
        riga(L("Margine medio a passeggero"), eur(sum(chiuse.map(depMargine)) / Math.max(1, sum(chiuse.map(depVenduti))), 0), "tot") +
        '<button class="btn wide mt" data-act="esporta-csv">' + ico("giu") + esc(L("Esporta tutto in CSV")) + '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
};

CONTI.partenze = function(){
  const D = DB.partenze.slice().sort((a,b)=> b.inizio.localeCompare(a.inizio));
  return '<div class="card scroll-x"><table class="tbl"><thead><tr>' +

      '<td class="num"><b>' + sum(D.map(depVenduti)) + '</b></td>' +
      '<td class="num"><b>' + eur(sum(D.map(depRicavi)),0) + '</b></td>' +
      '<td class="num"><b>' + eur(sum(D.map(depCosti)),0) + '</b></td>' +
      '<td class="num"><b>' + eur(sum(D.map(depMargine)),0) + '</b></td>' +
      '<td class="num"></td><td class="num"><b>' + eur(sum(D.map(depIncassato)),0) + '</b></td>' +

CONTI.prima = function(){
  const P = (DB.prima||[]).slice().sort((a,b)=> String(b.data).localeCompare(String(a.data)));
  const inMese = P.filter(x=> ym(x.data) === ym(today()));

          '<td><span class="chip">' + esc(L(x.cat)) + '</span></td>' +

          : '<tr><td colspan="5">' + vuoto(L("Nessun movimento")) + '</td></tr>') +

          barra(cats[k]/max*100) + '</div>').join("") || '<div class="small muted">—</div>';
      })() +

};

CONTI.iva = function(){
  const m = ym(today());
  const D = DB.partenze.filter(d=> depStato(d) === "conclusa" || depStato(d) === "viaggio" || depVenduti(d) > 0);
  const ric = sum(D.map(depRicavi)), cos = sum(D.map(depCosti));
  const margine = Math.max(0, ric - cos);
  const iva = margine * 23 / 123;   /* aliquota polacca sul margine */
  return '<div class="grid" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start">' +
    '<div class="card">' +
      '<div class="card-h">' + ico("soldi") + '<h3>' + esc(L("Regime speciale delle agenzie di viaggio")) + '</h3></div>' +
      '<div class="card-b">' +
        '<p class="small muted">' + esc(L("Le agenzie che vendono pacchetti propri applicano la procedura del margine (art. 119 ustawy o VAT): l'IVA non si calcola sul prezzo di vendita, ma sul margine, cioè su quello che resta dopo aver pagato i servizi comprati da altri. Qui sotto il conto, viaggio per viaggio.")) + '</p>' +
        '<div class="scroll-x mt"><table class="tbl"><thead><tr>' +
          '<th>' + esc(L("Partenza")) + '</th><th class="num">' + esc(L("Venduto")) + '</th>' +
          '<th class="num">' + esc(L("Costi da terzi")) + '</th><th class="num">' + esc(L("Margine lordo")) + '</th>' +
          '<th class="num">' + esc(L("IVA 23% sul margine")) + '</th><th class="num">' + esc(L("Margine netto")) + '</th></tr></thead><tbody>' +
          D.map(d=>{
            const r = depRicavi(d), c = depCosti(d), mg = Math.max(0, r - c), i = mg * 22/122;
            return '<tr class="clickable" data-go="partenza/' + d.id + '">' +
              '<td>' + bandiera(d) + ' ' + esc(d.titolo) + '</td>' +
              '<td class="num">' + eur(r,0) + '</td><td class="num">' + eur(c,0) + '</td>' +
              '<td class="num">' + eur(mg,0) + '</td><td class="num">' + eur(i,0) + '</td>' +
              '<td class="num"><b>' + eur(mg - i,0) + '</b></td></tr>';
          }).join("") +
        '</tbody></table></div>' +
      '</div>' +
    '</div>' +
    '<div class="stack">' +
      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Totale")) + '</h3>' +
        riga(L("Venduto"), eur(ric,0)) +
        riga(L("Costi da terzi"), eur(cos,0)) +
        riga(L("Margine lordo"), eur(margine,0)) +
        riga(L("IVA da versare"), '<span style="color:var(--red)">' + eur(iva,0) + '</span>') +
        riga(L("Margine netto"), eur(margine - iva,0), "tot") +
      '</div>' +
      '<div class="card pad">' +
        '<div class="warn">' + esc(L("Questo è un promemoria di gestione, non una dichiarazione fiscale. I numeri vanno sempre passati al commercialista.")) + '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
};

CONTI.statistiche = function(){
  const dest = {};
  DB.partenze.forEach(d=>{
    const k = d.dest;
    if(!dest[k]) dest[k] = { pax:0, ric:0, mar:0, n:0, flag: bandiera(d) };
    dest[k].pax += depVenduti(d); dest[k].ric += depRicavi(d); dest[k].mar += depMargine(d); dest[k].n++;
  });
  const kd = Object.keys(dest).sort((a,b)=> dest[b].ric - dest[a].ric);
  const maxR = Math.max(1, ...kd.map(k=> dest[k].ric));

  const vend = {};
  DB.pratiche.filter(p=> p.stato !== "annullata").forEach(p=>{
    const k = p.venditore || "—";
    vend[k] = (vend[k] || 0) + pratTotale(p);
  });
  const canali = {};
  (DB.richieste||[]).forEach(r=> canali[r.canale || "—"] = (canali[r.canale || "—"] || 0) + 1);
  const vinte = (DB.richieste||[]).filter(r=> r.stato === "vinta").length;
  const chiuse2 = (DB.richieste||[]).filter(r=> r.stato === "vinta" || r.stato === "persa").length;

  return '<div class="grid g2" style="align-items:start">' +
    '<div class="card">' +
      '<div class="card-h">' + ico("mondo") + '<h3>' + esc(L("Destinazioni che rendono di più")) + '</h3></div>' +
      '<div class="card-b">' +
        kd.map(k=> '<div style="margin-bottom:11px">' +
          '<div class="row small"><span>' + dest[k].flag + ' <b>' + esc(k) + '</b></span><div class="sp"></div>' +
          '<span class="muted">' + dest[k].pax + ' ' + esc(L("pax")) + '</span> <b>' + eur(dest[k].ric,0) + '</b></div>' +
          barra(dest[k].ric / maxR * 100) +
          '<div class="tiny dim">' + esc(L("margine")) + ' ' + eur(dest[k].mar,0) + ' · ' + esc(LN("{n} partenze", { n: dest[k].n })) + '</div>' +
        '</div>').join("") +
      '</div>' +
    '</div>' +
    '<div class="stack">' +
      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Chi vende")) + '</h3>' +
        Object.keys(vend).sort((a,b)=> vend[b] - vend[a]).map(k=>
          riga(k === "—" ? L("non indicato") : nomeS(k), eur(vend[k],0))).join("") +
      '</div>' +
      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Da dove arrivano i clienti")) + '</h3>' +

/* ---------- FORNITORI ---------- */
let F_FOR = "tutti";
VISTE.fornitori = function(){
  const tipi = ["tutti"].concat(Array.from(new Set(DB.fornitori.map(f=> f.tipo))));
  let F = DB.fornitori.slice();
  if(F_FOR !== "tutti") F = F.filter(f=> f.tipo === F_FOR);
  F.sort((a,b)=> a.nome.localeCompare(b.nome, "it"));
  const debiti = {};
  forniture().forEach(x=> debiti[x.f.fornitoreId] = (debiti[x.f.fornitoreId] || 0) + fResiduo(x.f));

  intesta(L("Fornitori"), LN("{n} in rubrica", { n: DB.fornitori.length }),
    '<button class="btn pri" data-act="nuovo-fornitore">' + ico("piu") + '<span class="nowrap">' + esc(L("Nuovo fornitore")) + '</span></button>');

  return '<div class="stack">' +
    '<div class="row wrap"><div class="btn-group">' +
      tipi.map(t=> '<button class="' + (F_FOR === t ? "on" : "") + '" data-ch="f-for" data-v="' + esc(t) + '">' + esc(L(t)) + '</button>').join("") +
    '</div></div>' +
    '<div class="grid g-auto">' + F.map(f=>
      '<div class="card pad" data-go="fornitore/' + f.id + '" style="cursor:pointer">' +
        '<div class="row mb"><div class="av lg ' + ["b","a","v","g",""][f.nome.length % 5] + '">' +
          ico(f.tipo === "hotel" ? "letto" : f.tipo === "bus" ? "bus" : f.tipo === "volo" ? "aereo" : f.tipo === "guida" ? "bandiera" : "palazzo") + '</div>' +
          '<div style="min-width:0"><b class="trunc" style="display:block">' + esc(f.nome) + '</b>' +
          '<span class="chip">' + esc(L(f.tipo)) + '</span> <span class="tiny dim">' + esc(f.citta || "") + '</span></div></div>' +
        '<div class="small muted">' + esc(f.tel || "") + '</div>' +
        (f.ref ? '<div class="tiny dim">' + esc(L("Riferimento")) + ': ' + esc(f.ref) + '</div>' : "") +
        (debiti[f.id] > 0.5 ? '<div class="chip r mt">' + esc(L("da pagare")) + ' ' + eur(debiti[f.id],0) + '</div>' : "") +
      '</div>').join("") +
    '</div>' +
  '</div>';
};

VISTE.fornitore = function(id){
  const f = forById(id);
  if(!f) return vuoto(L("Fornitore non trovato"));
  const usi = forniture().filter(x=> x.f.fornitoreId === id);
  intesta(f.nome, L(f.tipo) + (f.citta ? " · " + f.citta : ""),
    '<button class="btn ghost ico" data-go="fornitori">' + ico("indietro") + '</button>' +
    '<button class="btn" data-act="mod-fornitore" data-id="' + f.id + '">' + ico("matita") + esc(L("Modifica")) + '</button>');

  return '<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:start">' +
    '<div class="card pad">' +
      riga(L("Tipo"), '<span class="chip">' + esc(L(f.tipo)) + '</span>') +
      riga(L("Città"), esc(f.citta || "—")) +
      riga(L("Telefono"), f.tel ? '<a href="tel:' + esc(String(f.tel).replace(/\s/g,"")) + '">' + esc(f.tel) + '</a>' : "—") +
      riga(L("Email"), f.email ? '<a href="mailto:' + esc(f.email) + '">' + esc(f.email) + '</a>' : "—") +
      riga(L("Riferimento"), esc(f.ref || "—")) +
      (f.iban ? riga("IBAN", '<span class="mono tiny">' + esc(f.iban) + '</span>') : "") +
      (f.note ? '<div class="info mt">' + esc(f.note) + '</div>' : "") +
      '<button class="btn wide mt dang" data-act="del-fornitore" data-id="' + f.id + '">' + ico("cestino") + esc(L("Elimina")) + '</button>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-h">' + ico("valigia") + '<h3>' + esc(L("Servizi prenotati")) + '</h3><div class="sp"></div>' +
        '<b>' + eur(sum(usi.map(x=> x.f.importo)), 0) + '</b></div>' +
      '<div>' + (usi.length ? usi.map(x=>
        '<div class="list-i" data-go="partenza/' + x.dep.id + '/fornitori">' +
          '<span style="font-size:19px">' + bandiera(x.dep) + '</span>' +
          '<div style="flex:1;min-width:0"><div class="li-t trunc">' + esc(x.f.voce) + '</div>' +
          '<div class="li-s trunc">' + esc(x.dep.titolo) + ' · ' + esc(dIT(x.dep.inizio)) + '</div></div>' +
          '<div class="right"><b>' + eur(x.f.importo,0) + '</b>' +
          '<div><span class="chip ' + (x.f.stato === "saldato" ? "g" : "a") + '">' + esc(L(x.f.stato)) + '</span></div></div>' +
        '</div>').join("") : vuoto(L("Nessun servizio"))) + '</div>' +
    '</div>' +
  '</div>';
};

<script>

        '<div class="card-b grid g2" style="gap:11px">' +

          campo("re-opz", L("Durata dell'opzione (giorni)"), DB.meta.giorniOpzione, "number") +

          campo("re-quo", L("Quota di iscrizione a persona"), DB.meta.quotaIscrizione, "number") +

          '<button class="btn' + (LANG === l ? " pri" : "") + '" data-act="lang" data-l="' + l + '">' +
            LNG_FLAG[l] + ' ' + esc(LNG_NOME[l]) + '</button>').join("") + '</div>' +
        '<div class="small muted mt">' + esc(L("Cambia solo le scritte del programma: i tuoi testi (programmi, note, nomi) restano come li hai scritti.")) + '</div>' +
        (typeof cartaLingue === "function" ? cartaLingue() : "") +
        '<div class="sep-line"></div>' +
        '<h3 class="mb">' + esc(L("Colore")) + '</h3>' +
        '<div class="pill-row">' + [["chiaro","Chiaro"],["notte","Notte"],["deserto","Deserto"],["mare","Mare"]].map(s=>
          '<button class="btn' + (DB.meta.skin === s[0] ? " pri" : "") + '" data-act="skin" data-v="' + s[0] + '">' + esc(L(s[1])) + '</button>').join("") + '</div>' +
      '</div>' +

      (typeof cartaRete === "function" ? cartaRete() : "") +

      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Copie di sicurezza")) + '</h3>' +
        '<p class="small muted">' + esc(L("Tutto quello che scrivi resta su questo apparecchio, dentro il browser. Nessuno lo vede da fuori. Fai una copia ogni tanto: se cambi computer, la riapri e ritrovi tutto.")) + '</p>' +
        '<div class="stack mt" style="gap:8px">' +

          '<button class="btn wide" data-act="ripristina">' + ico("su") + esc(L("Ripristina da una copia")) + '</button>' +
          '<button class="btn wide" data-act="esporta-csv">' + ico("scheda") + esc(L("Esporta gli elenchi in CSV")) + '</button>' +
        '</div>' +

        '<button class="btn wide dang" data-act="ricomincia">' + ico("cestino") + esc(L("Svuota e ricomincia da zero")) + '</button>' +
        '<button class="btn wide mt" data-act="rimetti-demo">' + ico("sincro") + esc(L("Rimetti l'agenzia di prova")) + '</button>' +

      '<div class="card pad">' +
        '<h3 class="mb">' + esc(L("Cos'è questo programma")) + '</h3>' +
        '<p class="small muted">' + esc(L("Tourista è un gestionale per agenzie che organizzano viaggi di gruppo: un solo file, nessun abbonamento, funziona anche senza internet. Si può installare sul telefono o sul computer come un'applicazione.")) + '</p>' +
        '<div class="small muted mt">' + esc(L("Versione")) + ' 1.0 · ' + esc(L("archivio")) + ' <span class="mono">' + esc(KEY) + '</span></div>' +
        '<button class="btn wide mt" data-go="guida">' + ico("libro") + esc(L("Rivedi i primi passi")) + '</button>' +

</script>
<script>
/* ============================================================
   6. QUELLO CHE SUCCEDE QUANDO SI TOCCA
   ============================================================ */
const ACT = {};
const CH = {};

/* --- generali --- */
ACT.side  = ()=> document.body.classList.toggle("side-open");
ACT.close = ()=> chiudi();
ACT.ok    = ()=>{ const f = M_OK; chiudi(); if(f) f(); };
ACT.lang  = (e, el)=> setLang(el.dataset.l);
ACT.skin  = (e, el)=>{
  const skins = ["chiaro","notte","deserto","mare"];
  DB.meta.skin = el.dataset.v || skins[(skins.indexOf(DB.meta.skin) + 1) % skins.length];
  document.documentElement.setAttribute("data-skin", DB.meta.skin);
  save(); render();
};

/* --- filtri --- */
CH["q-dep"] = (e, el)=>{ F_DEP.q = el.value; render(); ripristinaFuoco("q-dep"); };
CH["f-dep"] = (e, el)=>{ F_DEP.stato = el.dataset.v; render(); };
CH["q-pra"] = (e, el)=>{ F_PRA.q = el.value; render(); ripristinaFuoco("q-pra"); };
CH["f-pra"] = (e, el)=>{ F_PRA.stato = el.dataset.v; render(); };
CH["q-per"] = (e, el)=>{ F_PER.q = el.value; render(); ripristinaFuoco("q-per"); };
CH["f-per"] = (e, el)=>{ F_PER.filtro = el.dataset.v; render(); };
CH["f-cli"] = (e, el)=>{ F_CLI = el.dataset.v; render(); };
CH["f-for"] = (e, el)=>{ F_FOR = el.dataset.v; render(); };
function ripristinaFuoco(id){
  const el = document.getElementById(id);
  if(el){ el.focus(); const v = el.value; el.value = ""; el.value = v; }
}

/* ============================================================
   PARTENZE
   ============================================================ */
function formPartenza(d){
  const pk = DB.pacchetti.map(p=> ({ v:p.id, l:p.flag + " " + p.nome }));
  return '<div class="grid g2" style="gap:11px">' +
    campo("d-tit", L("Titolo del viaggio"), d.titolo) +
    campo("d-cod", L("Codice"), d.codice, "text", { ph:"SIC-0512" }) +
    campo("d-dest", L("Destinazione"), d.dest) +
    campo("d-flag", L("Bandiera"), d.flag, "text", { ph:"🇮🇹" }) +
    campo("d-ini", L("Partenza"), d.inizio, "date") +
    campo("d-fin", L("Ritorno"), d.fine, "date") +
    campo("d-pos", L("Posti disponibili"), d.posti, "number") +
    campo("d-min", L("Minimo per partire"), d.minimo, "number", { hint: L("sotto questo numero si perde") }) +
    campo("d-quo", L("Quota adulto"), d.quota, "number") +
    campo("d-qri", L("Quota ridotta"), d.quotaRid, "number") +
    campo("d-sup", L("Supplemento singola"), d.supSingola, "number") +
    campo("d-rid", L("Riduzione in tripla"), d.ridTripla, "number") +
    campo("d-acc", L("Acconto a persona"), d.acconto, "number") +
    campo("d-mez", L("Mezzo"), d.mezzo, "select", { opts:[{v:"bus",l:L("Bus granturismo")},{v:"volo",l:L("Volo di linea")},{v:"treno",l:L("Treno")},{v:"nave",l:L("Nave")}] }) +
    '<div style="grid-column:1/-1">' + campo("d-part", L("Ritrovo e partenza"), d.partenzaDa, "text", { ph: L("piazzale, ora") }) + '</div>' +
    '<div style="grid-column:1/-1">' + campo("d-pac", L("Dal catalogo"), d.pacchettoId, "select", { opts:[{v:"",l:"—"}].concat(pk) }) + '</div>' +
    '<div style="grid-column:1/-1">' + campo("d-note", L("Note interne"), d.note, "textarea", { rows:2 }) + '</div>' +
  '</div>';
}
function leggiPartenza(d){
  d.titolo = V("d-tit"); d.codice = V("d-cod"); d.dest = V("d-dest"); d.flag = V("d-flag");
  d.inizio = V("d-ini"); d.fine = V("d-fin") || V("d-ini");
  d.posti = VN("d-pos"); d.minimo = VN("d-min"); d.quota = VN("d-quo"); d.quotaRid = VN("d-qri");
  d.supSingola = VN("d-sup"); d.ridTripla = VN("d-rid"); d.acconto = VN("d-acc");
  d.mezzo = V("d-mez"); d.partenzaDa = V("d-part"); d.pacchettoId = V("d-pac"); d.note = V("d-note");
  return d;
}
ACT["nuova-partenza"] = function(){
  const d = { id:uid("dp"), codice:"", titolo:"", dest:"", flag:"🌍", inizio: addDays(today(), 60), fine: addDays(today(), 66),
    posti:50, minimo:30, stato:"vendita", quota:0, quotaRid:0, supSingola:0, ridTripla:0, acconto:0, mezzo:"bus",
    partenzaDa:"", accompagnatore:"", note:"", bus:{ file:13, bloccati:[] }, listaAttesa:[], creata: today(),
    programma:[], costi:[], fornitura:[], pacchettoId:"" };
  M_OK = ()=>{
    leggiPartenza(d);
    if(!d.titolo){ toast(L("Serve almeno il titolo"), "err"); return; }
    if(!d.codice) d.codice = (d.dest || "VIA").slice(0,3).toUpperCase() + "-" + dShort(d.inizio).replace("/","");
    DB.partenze.push(d); save(); vai("partenza", d.id);
  };
  modale(L("Nuova partenza"), formPartenza(d),
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Crea la partenza")) + '</button>', "wide");
};
ACT["mod-partenza"] = function(e, el){
  const d = depById(el.dataset.id);
  M_OK = ()=>{ leggiPartenza(d); save(); render(); toast(L("Salvato"), "ok"); };
  modale(L("Modifica partenza"), formPartenza(d),
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Salva")) + '</button>', "wide");
};
ACT["del-partenza"] = function(e, el){
  const d = depById(el.dataset.id);
  const n = depPratiche(d).length;
  conferma(n ? LN("La partenza ha {n} pratiche: verranno cancellate anche quelle.", { n:n }) : L("Elimino questa partenza?"), ()=>{
    DB.pratiche = DB.pratiche.filter(p=> p.depId !== d.id);
    DB.partenze = DB.partenze.filter(x=> x.id !== d.id);
    save(); vai("partenze");
  }, L("Elimina"));
};
ACT["dup-partenza"] = function(e, el){
  const d = depById(el.dataset.id);
  const n = JSON.parse(JSON.stringify(d));
  n.id = uid("dp");
  const durata = days(d.inizio, d.fine);
  n.inizio = addDays(d.inizio, 365); n.fine = addDays(n.inizio, durata);
  n.codice = d.codice + "-B"; n.stato = "vendita"; n.creata = today();
  n.listaAttesa = []; n.fornitura = (d.fornitura||[]).map(f=> Object.assign({}, f, { id:uid("fx"), acconto:0, stato:"da pagare" }));
  M_OK = ()=>{
    n.inizio = V("n-ini"); n.fine = V("n-fin"); n.codice = V("n-cod");
    DB.partenze.push(n); save(); vai("partenza", n.id); toast(L("Partenza duplicata"), "ok");
  };
  modale(L("Duplica per un'altra data"),
    '<p class="small muted">' + esc(L("Si copiano programma, costi e servizi. Le pratiche no.")) + '</p>' +
    '<div class="grid g2" style="gap:11px">' + campo("n-ini", L("Partenza"), n.inizio, "date") + campo("n-fin", L("Ritorno"), n.fine, "date") +
    campo("n-cod", L("Codice"), n.codice) + '</div>',
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Duplica")) + '</button>');
};
ACT["dep-stato"] = function(e, el){
  const d = depById(el.dataset.id);
  d.stato = el.dataset.v; save(); render();
  toast(L(STATI_DEP[d.stato] ? STATI_DEP[d.stato].lab : "Salvato"), "ok");
};
ACT["usa-prezzo"] = function(e, el){
  const d = depById(el.dataset.id);
  d.quota = prezzoConsigliato(d, nz(d.minimo));
  d.quotaRid = Math.round(d.quota * 0.88 / 10) * 10;
  save(); render(); toast(L("Quota aggiornata"), "ok");
};
CH["dep-acc"] = function(e, el){ const d = depById(el.dataset.id); d.accompagnatore = el.value; save(); render(); };

/* --- lista d'attesa --- */
ACT["nuova-attesa"] = function(e, el){
  const d = depById(el.dataset.id);
  M_OK = ()=>{
    if(!V("w-nome")) return;
    d.listaAttesa = d.listaAttesa || [];
    d.listaAttesa.push({ id:uid("wa"), nome:V("w-nome"), tel:V("w-tel"), pax:VN("w-pax") || 1, note:V("w-note") });
    save(); render();
  };
  modale(L("Aggiungi in lista d'attesa"),
    campo("w-nome", L("Nome"), "") + campo("w-tel", L("Telefono"), "", "tel") +
    campo("w-pax", L("Quanti posti"), 2, "number") + campo("w-note", L("Nota"), ""),
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Aggiungi")) + '</button>', "slim");
};
ACT["del-attesa"] = function(e, el){
  const d = depById(el.dataset.id);
  d.listaAttesa = (d.listaAttesa||[]).filter(a=> a.id !== el.dataset.x);
  save(); render();
};

/* --- programma --- */
function formGiorno(g, d){
  const hotels = DB.fornitori.filter(f=> f.tipo === "hotel").map(f=> ({ v:f.id, l:f.nome + " — " + f.citta }));
  return campo("g-n", L("Giorno numero"), g.g, "number") +
    campo("g-tit", L("Titolo della giornata"), g.titolo, "text", { ph: L("Palermo e Monreale") }) +
    campo("g-txt", L("Cosa si fa"), g.testo, "textarea", { rows:5 }) +
    '<div class="grid g2" style="gap:11px">' +
      campo("g-pasti", L("Pasti inclusi"), g.pasti, "text", { ph: L("colazione, cena") }) +
      campo("g-hotel", L("Hotel"), g.hotel, "select", { opts:[{v:"",l:"—"}].concat(hotels) }) +
    '</div>';
}
ACT["nuovo-giorno"] = function(e, el){
  const d = depById(el.dataset.id);
  const g = { g:(d.programma||[]).length + 1, titolo:"", testo:"", pasti:"", hotel:"" };
  M_OK = ()=>{
    g.g = VN("g-n") || 1; g.titolo = V("g-tit"); g.testo = V("g-txt"); g.pasti = V("g-pasti"); g.hotel = V("g-hotel");
    d.programma = d.programma || []; d.programma.push(g);
    d.programma.sort((a,b)=> a.g - b.g); save(); render();
  };
  modale(L("Nuovo giorno"), formGiorno(g, d),
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Aggiungi")) + '</button>');
};
ACT["mod-giorno"] = function(e, el){
  const d = depById(el.dataset.id), i = Number(el.dataset.x), g = d.programma[i];
  M_OK = ()=>{
    g.g = VN("g-n") || 1; g.titolo = V("g-tit"); g.testo = V("g-txt"); g.pasti = V("g-pasti"); g.hotel = V("g-hotel");
    d.programma.sort((a,b)=> a.g - b.g); save(); render();
  };
  modale(L("Modifica giorno"), formGiorno(g, d),
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Salva")) + '</button>');
};
ACT["del-giorno"] = function(e, el){
  const d = depById(el.dataset.id), i = Number(el.dataset.x);
  conferma(L("Tolgo questo giorno dal programma?"), ()=>{ d.programma.splice(i,1); save(); render(); }, L("Togli"));
};
ACT["copia-programma"] = function(e, el){
  const d = depById(el.dataset.id);
  const t = d.titolo + "\n" + periodo(d.inizio, d.fine) + "\n\n" +
    (d.programma||[]).map(g=> (L("Giorno") + " " + g.g + " — " + g.titolo + "\n" + g.testo +
      (g.pasti ? "\n(" + L("pasti") + ": " + g.pasti + ")" : ""))).join("\n\n") +
    "\n\n" + L("Quota a persona") + ": " + eur(d.quota) +
    "\n" + DB.meta.agenzia.nome + " — " + DB.meta.agenzia.tel;
  copia(t);
};

/* --- costi --- */
function formCosto(c){
  const forn = DB.fornitori.map(f=> ({ v:f.id, l:f.nome }));
  return campo("c-voce", L("Voce di costo"), c.voce, "text", { ph: L("Hotel mezza pensione") }) +
    '<div class="grid g2" style="gap:11px">' +
      campo("c-tipo", L("Come si conta"), c.tipo, "select", { opts:[
        { v:"pax", l:L("a persona") }, { v:"fisso", l:L("fisso, per tutto il gruppo") }] }) +
      campo("c-imp", L("Importo"), c.importo, "number", { step:"0.01" }) +
      campo("c-ogni", L("Una gratuità ogni"), c.ogni, "number", { hint: L("lascia vuoto se non ce ne sono") }) +
      campo("c-for", L("Fornitore"), c.fornitoreId, "select", { opts:[{v:"",l:"—"}].concat(forn) }) +
    '</div>';
}
ACT["nuovo-costo"] = function(e, el){
  const d = depById(el.dataset.id);
  const c = { id:uid("co"), voce:"", tipo:"pax", importo:0, ogni:0, fornitoreId:"" };
  M_OK = ()=>{
    c.voce = V("c-voce"); c.tipo = V("c-tipo"); c.importo = VN("c-imp"); c.ogni = VN("c-ogni"); c.fornitoreId = V("c-for");
    if(!c.voce) return;
    d.costi = d.costi || []; d.costi.push(c); save(); render();
  };
  modale(L("Nuova voce di costo"), formCosto(c),
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Aggiungi")) + '</button>');
};
ACT["mod-costo"] = function(e, el){
  const d = depById(el.dataset.id), c = (d.costi||[]).find(x=> x.id === el.dataset.x);
  if(!c) return;
  M_OK = ()=>{
    c.voce = V("c-voce"); c.tipo = V("c-tipo"); c.importo = VN("c-imp"); c.ogni = VN("c-ogni"); c.fornitoreId = V("c-for");
    save(); render();
  };
  modale(L("Modifica costo"), formCosto(c),
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Salva")) + '</button>');
};
ACT["del-costo"] = function(e, el){
  const d = depById(el.dataset.id);
  d.costi = (d.costi||[]).filter(c=> c.id !== el.dataset.x); save(); render();
};

/* --- servizi prenotati ai fornitori --- */
function formFornitura(f){
  const forn = DB.fornitori.map(x=> ({ v:x.id, l:x.nome + " — " + L(x.tipo) }));
  return campo("x-for", L("Fornitore"), f.fornitoreId, "select", { opts:[{v:"",l:"—"}].concat(forn) }) +
    campo("x-voce", L("Servizio"), f.voce, "text", { ph: L("3 notti mezza pensione") }) +
    '<div class="grid g2" style="gap:11px">' +
      campo("x-imp", L("Importo totale"), f.importo, "number") +
      campo("x-acc", L("Già pagato"), f.acconto, "number") +
      campo("x-accd", L("Data acconto"), f.accontoData, "date") +
      campo("x-sald", L("Saldo entro il"), f.saldoData, "date") +
    '</div>' +
    campo("x-stato", L("Stato"), f.stato, "select", { opts:[
      { v:"opzione", l:L("opzione") }, { v:"da pagare", l:L("da pagare") },
      { v:"acconto", l:L("acconto") }, { v:"saldato", l:L("saldato") }] });
}
function leggiFornitura(f){
  f.fornitoreId = V("x-for"); f.voce = V("x-voce"); f.importo = VN("x-imp");
  f.acconto = VN("x-acc"); f.accontoData = V("x-accd"); f.saldoData = V("x-sald"); f.stato = V("x-stato");
}
ACT["nuova-fornitura"] = function(e, el){
  const d = depById(el.dataset.id);
  const f = { id:uid("fx"), fornitoreId:"", voce:"", importo:0, acconto:0, accontoData:"", saldoData: addDays(d.inizio,-20), stato:"opzione" };
  M_OK = ()=>{ leggiFornitura(f); d.fornitura = d.fornitura || []; d.fornitura.push(f); save(); render(); };
  modale(L("Servizio prenotato"), formFornitura(f),
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Aggiungi")) + '</button>');
};
ACT["mod-fornitura"] = function(e, el){
  const d = depById(el.dataset.id), f = (d.fornitura||[]).find(x=> x.id === el.dataset.x);
  if(!f) return;
  M_OK = ()=>{ leggiFornitura(f); save(); render(); };

    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Salva")) + '</button>');
};
ACT["del-fornitura"] = function(e, el){
  const d = depById(el.dataset.id);
  d.fornitura = (d.fornitura||[]).filter(f=> f.id !== el.dataset.x);
  chiudi(); save(); render();
};
ACT["paga-fornitura"] = function(e, el){
  const d = depById(el.dataset.id), f = (d.fornitura||[]).find(x=> x.id === el.dataset.x);
  if(!f) return;
  M_OK = ()=>{
    const q = VN("p-imp");
    f.acconto = nz(f.acconto) + q;
    f.stato = fResiduo(f) <= 0.5 ? "saldato" : "acconto";
    if(!f.accontoData) f.accontoData = V("p-data");
    DB.prima.push({ id:uid("pn"), data:V("p-data"), tipo:"uscita", cat:"fornitori", importo:q,
      modo:V("p-modo"), desc: nomeF(f.fornitoreId) + " — " + f.voce, depId:d.id });
    save(); render(); toast(L("Pagamento registrato"), "ok");
  };
  modale(L("Paga il fornitore"),
    '<div class="info mb">' + esc(nomeF(f.fornitoreId)) + ' — ' + esc(f.voce) + '<br><b>' + esc(L("residuo")) + ': ' + eur(fResiduo(f)) + '</b></div>' +
    '<div class="grid g2" style="gap:11px">' +
      campo("p-imp", L("Quanto paghi"), fResiduo(f), "number", { step:"0.01" }) +
      campo("p-data", L("Data"), today(), "date") +
      campo("p-modo", L("Come"), "bonifico", "select", { opts:[
        { v:"bonifico", l:L("bonifico") }, { v:"contanti", l:L("contanti") },
        { v:"carta", l:L("carta") }, { v:"assegno", l:L("assegno") }] }) +
    '</div>',
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Registra")) + '</button>');
};

<script>
/* ============================================================
   PRATICHE
   ============================================================ */
function nuovoCodice(){
  const anno = new Date().getFullYear();
  const n = DB.pratiche.filter(p=> String(p.codice).indexOf("P" + anno) === 0).length + 1;
  return "P" + anno + "-" + String(n).padStart(3,"0");
}
function creaPersona(nome, cognome, tel, email){
  const p = { id:uid("pe"), nome:nome, cognome:cognome, sesso:"", nascita:"", doc:"", docNum:"", docScad:"",
    nazione:"", tel:tel||"", email:email||"", citta:"", indirizzo:"", cf:"", note:"", diete:"", mobilita:"" };
  DB.persone.push(p); return p;
}
ACT["nuova-pratica"] = function(e, el){
  const depId = el.dataset.id || "";
  const aperte = DB.partenze.filter(d=> ["vendita","confermata"].indexOf(depStato(d)) >= 0);
  if(!aperte.length){ toast(L("Prima serve una partenza in vendita"), "err"); return; }
  const cli = DB.clienti.slice().sort((a,b)=> a.nome.localeCompare(b.nome, "it"));
  M_OK = ()=>{
    const d = depById(V("n-dep"));
    if(!d) return;
    let cid = V("n-cli"), per = null;
    if(cid === "__new"){
      const nome = V("n-nome"), cog = V("n-cog");
      if(!cog && !nome){ toast(L("Serve il nome del cliente"), "err"); return; }
      per = creaPersona(nome, cog, V("n-tel"), V("n-mail"));
      const c = { id:uid("cl"), nome: cog + " " + nome, tipo:"privato", personId:per.id, ref:"",
        tel:V("n-tel"), email:V("n-mail"), citta:"", note:"", sconto:0 };
      DB.clienti.push(c); cid = c.id;
    } else {
      const c = cliById(cid);
      if(c && c.personId) per = perById(c.personId);
      if(!per && c) per = creaPersona(c.ref || c.nome, "", c.tel, c.email);
    }
    const a = eta(per.nascita);
    const pr = { id:uid("pr"), codice: nuovoCodice(), depId:d.id, clienteId:cid, creata: today(),
      stato: V("n-stato"), scadenzaOpzione: V("n-stato") === "opzione" ? addDays(today(), nz(DB.meta.giorniOpzione)) : "",
      pax:[{ id:uid("px"), personId:per.id, tipo: (a !== null && a < 18) ? "ridotto" : "adulto",
             prezzo: (a !== null && a < 18) ? d.quotaRid : d.quota, note:"" }],
      camere:[], extra: nz(DB.meta.quotaIscrizione) ? [{ id:uid("ex"), voce:L("Quota di iscrizione"), importo:DB.meta.quotaIscrizione, qta:1 }] : [],
      sconto:0, scontoNota:"", pagamenti:[], posti:{}, appello:{}, note:"", venditore: V("n-vend") };
    DB.pratiche.push(pr); save(); vai("pratica", pr.id);
    toast(L("Pratica aperta: ora aggiungi gli altri passeggeri"), "ok");
  };
  modale(L("Nuova pratica"),
    campo("n-dep", L("Viaggio"), depId, "select", { opts: aperte.map(d=> ({ v:d.id, l: bandiera(d) + " " + d.titolo + " — " + dIT(d.inizio) })) }) +
    campo("n-cli", L("Cliente"), "__new", "select", { opts:[{ v:"__new", l:"➕ " + L("nuovo cliente") }].concat(cli.map(c=> ({ v:c.id, l:c.nome }))) }) +
    '<div class="grid g2" style="gap:11px">' +
      campo("n-cog", L("Cognome"), "") + campo("n-nome", L("Nome"), "") +
      campo("n-tel", L("Telefono"), "", "tel") + campo("n-mail", L("Email"), "", "email") +
      campo("n-stato", L("Stato"), "opzione", "select", { opts:[
        { v:"opzione", l:L("Opzione") }, { v:"confermata", l:L("Confermata") }] }) +
      campo("n-vend", L("Venditore"), (UTENTE || DB.staff[0] || {}).id, "select", { opts: DB.staff.map(s=> ({ v:s.id, l:s.nome })) }) +
    '</div>' +
    '<div class="info">' + esc(L("Il primo passeggero è l'intestatario. Gli altri si aggiungono dalla pratica.")) + '</div>',
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Apri la pratica")) + '</button>');
};
ACT["nuova-pratica-cli"] = function(e, el){ ACT["nuova-pratica"](e, { dataset:{} }); setTimeout(()=>{ const s = document.getElementById("n-cli"); if(s){ s.value = el.dataset.id; } }, 80); };
ACT["nuova-pratica-per"] = function(e, el){
  const p = perById(el.dataset.id);
  const c = DB.clienti.find(x=> x.personId === p.id);
  ACT["nuova-pratica"](e, { dataset:{} });
  setTimeout(()=>{ const s = document.getElementById("n-cli"); if(s && c) s.value = c.id; }, 80);
};
ACT["del-pratica"] = function(e, el){
  const p = praById(el.dataset.id);
  conferma(LN("Elimino la pratica {c}? I pagamenti registrati spariscono.", { c:p.codice }), ()=>{
    DB.pratiche = DB.pratiche.filter(x=> x.id !== p.id); save(); vai("pratiche");
  }, L("Elimina"));
};
CH["pra-stato"] = function(e, el){
  const p = praById(el.dataset.id);
  p.stato = el.value;
  if(p.stato === "opzione" && !p.scadenzaOpzione) p.scadenzaOpzione = addDays(today(), nz(DB.meta.giorniOpzione));
  save(); render();
};
CH["pra-note"] = function(e, el){ const p = praById(el.dataset.id); p.note = el.value; save(); };
ACT["conferma-pratica"] = function(e, el){
  const p = praById(el.dataset.id);
  p.stato = "confermata"; p.scadenzaOpzione = ""; save(); render(); toast(L("Pratica confermata"), "ok");
};
ACT.proroga = function(e, el){
  const p = praById(el.dataset.id);
  M_OK = ()=>{ p.scadenzaOpzione = V("o-data"); save(); render(); };
  modale(L("Proroga l'opzione"), campo("o-data", L("Nuova scadenza"), addDays(today(), 7), "date"),
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Proroga")) + '</button>', "slim");
};

/* --- passeggeri nella pratica --- */
ACT["add-pax"] = function(e, el){
  const p = praById(el.dataset.id), d = depById(p.depId);
  const dentro = (p.pax||[]).map(x=> x.personId);
  const liberi = DB.persone.filter(x=> dentro.indexOf(x.id) < 0)
    .sort((a,b)=> (a.cognome+a.nome).localeCompare(b.cognome+b.nome, "it"));
  M_OK = ()=>{
    let per;
    const scelto = V("a-esiste");
    if(scelto){ per = perById(scelto); }
    else {
      if(!V("a-cog") && !V("a-nome")){ toast(L("Serve il nome"), "err"); return; }
      per = creaPersona(V("a-nome"), V("a-cog"), V("a-tel"), "");
      per.nascita = V("a-nasc");
    }
    const a = eta(per.nascita), rid = a !== null && a < 18;
    p.pax.push({ id:uid("px"), personId:per.id, tipo: rid ? "ridotto" : "adulto", prezzo: rid ? d.quotaRid : d.quota, note:"" });
    save(); render(); toast(L("Passeggero aggiunto"), "ok");
  };
  modale(L("Aggiungi passeggero"),
    campo("a-esiste", L("Già in archivio"), "", "select", { opts:[{v:"",l:"— " + L("nuovo") + " —"}].concat(
      liberi.slice(0,400).map(x=> ({ v:x.id, l: x.cognome + " " + x.nome + (x.nascita ? " (" + eta(x.nascita) + ")" : "") }))) }) +
    '<div class="sep-line"></div>' +
    '<div class="grid g2" style="gap:11px">' +
      campo("a-cog", L("Cognome"), "") + campo("a-nome", L("Nome"), "") +
      campo("a-nasc", L("Data di nascita"), "", "date") + campo("a-tel", L("Telefono"), "", "tel") +
    '</div>',
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Aggiungi")) + '</button>');
};
ACT["del-pax"] = function(e, el){
  const p = praById(el.dataset.id), x = (p.pax||[]).find(y=> y.id === el.dataset.x);
  if(!x) return;
  conferma(LN("Tolgo {chi} dalla pratica?", { chi: nomeP(x.personId) }), ()=>{
    p.pax = p.pax.filter(y=> y.id !== x.id);
    (p.camere||[]).forEach(r=> r.ids = (r.ids||[]).filter(i=> i !== x.personId));
    p.camere = (p.camere||[]).filter(r=> (r.ids||[]).length);
    delete p.posti[x.personId];
    save(); render();
  }, L("Togli"));
};

/* --- camere --- */
function formCamera(p, r, pre){
  const dentro = {};
  (p.camere||[]).forEach(c=>{ if(!r || c.id !== r.id) (c.ids||[]).forEach(i=> dentro[i] = 1); });
  return campo("r-tipo", L("Tipo di camera"), r ? r.tipo : "dbl", "select", {
      opts: Object.keys(CAMERE).map(k=> ({ v:k, l: camLab(k) + " (" + CAMERE[k].cap + ")" })) }) +
    '<div class="f mt"><label>' + esc(L("Chi ci dorme")) + '</label><div>' +
      (p.pax||[]).map(x=>{
        const dispo = !dentro[x.personId];
        const sel = (r && (r.ids||[]).indexOf(x.personId) >= 0) || (pre && pre === x.personId);
        return '<label class="check" style="padding:5px 0;opacity:' + (dispo ? 1 : .4) + '">' +
          '<input type="checkbox" class="r-pax" value="' + x.personId + '"' + (sel ? " checked" : "") + (dispo ? "" : " disabled") + '> ' +
          esc(nomeP(x.personId)) + (dispo ? "" : ' <span class="tiny dim">(' + esc(L("già in camera")) + ')</span>') + '</label>';
      }).join("") +
    '</div></div>';
}
function leggiCamera(){
  return Array.from(document.querySelectorAll(".r-pax")).filter(c=> c.checked).map(c=> c.value);
}
ACT["nuova-camera"] = function(e, el){
  const p = praById(el.dataset.id);
  M_OK = ()=>{
    const ids = leggiCamera();
    if(!ids.length){ toast(L("Scegli chi ci dorme"), "err"); return; }
    p.camere = p.camere || [];
    p.camere.push({ id:uid("rm"), tipo:V("r-tipo"), ids:ids });
    save(); render();
  };
  modale(L("Nuova camera"), formCamera(p, null, el.dataset.x),
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Aggiungi")) + '</button>');
};
ACT["assegna-camera"] = function(e, el){ ACT["nuova-camera"](e, el); };
ACT["mod-camera"] = function(e, el){
  const p = praById(el.dataset.id), r = (p.camere||[]).find(x=> x.id === el.dataset.x);
  if(!r) return;
  M_OK = ()=>{ r.tipo = V("r-tipo"); r.ids = leggiCamera(); save(); render(); };
  modale(L("Modifica camera"), formCamera(p, r),
    '<button class="btn dang" data-act="del-camera" data-id="' + p.id + '" data-x="' + r.id + '">' + esc(L("Elimina")) + '</button>' +
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Salva")) + '</button>');
};
ACT["del-camera"] = function(e, el){
  const p = praById(el.dataset.id);
  p.camere = (p.camere||[]).filter(r=> r.id !== el.dataset.x);
  chiudi(); save(); render();
};

/* --- soldi della pratica --- */
ACT.incassa = function(e, el){
  const p = praById(el.dataset.id), d = depById(p.depId);
  const res = pratResiduo(p, d);
  const acc = pratAccontoDovuto(p, d) - pratPagato(p);
  M_OK = ()=>{
    const q = VN("i-imp");
    if(q <= 0) return;
    p.pagamenti = p.pagamenti || [];
    p.pagamenti.push({ id:uid("pa"), data:V("i-data"), importo:q, modo:V("i-modo"), nota:V("i-nota") });
    if(p.stato === "opzione"){ p.stato = "confermata"; p.scadenzaOpzione = ""; }
    if(pratResiduo(p, d) <= 0.5) p.stato = "saldata";
    save(); render(); toast(L("Incasso registrato"), "ok");
  };
  modale(L("Registra un incasso"),
    '<div class="info mb">' + esc(p.codice) + ' — ' + esc(nomeC(p.clienteId)) + '<br>' +
      esc(L("Residuo")) + ': <b>' + eur(res) + '</b>' + (acc > 0.5 ? ' · ' + esc(L("acconto atteso")) + ': <b>' + eur(acc) + '</b>' : "") + '</div>' +
    '<div class="grid g2" style="gap:11px">' +
      campo("i-imp", L("Importo"), Math.max(0, acc > 0.5 ? acc : res), "number", { step:"0.01" }) +
      campo("i-data", L("Data"), today(), "date") +
      campo("i-modo", L("Come"), "bonifico", "select", { opts:[
        { v:"bonifico", l:L("bonifico") }, { v:"contanti", l:L("contanti") },
        { v:"carta", l:L("carta") }, { v:"assegno", l:L("assegno") }] }) +
      campo("i-nota", L("Nota"), acc > 0.5 ? L("Acconto") : L("Saldo")) +
    '</div>',
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Registra")) + '</button>');
};
ACT["del-pagamento"] = function(e, el){
  const p = praById(el.dataset.id);
  conferma(L("Cancello questo pagamento?"), ()=>{
    p.pagamenti = (p.pagamenti||[]).filter(x=> x.id !== el.dataset.x);
    if(p.stato === "saldata" && pratResiduo(p) > 0.5) p.stato = "confermata";
    save(); render();
  }, L("Cancella"));
};
ACT["add-extra"] = function(e, el){
  const p = praById(el.dataset.id);
  M_OK = ()=>{
    if(!V("e-voce")) return;
    p.extra = p.extra || [];
    p.extra.push({ id:uid("ex"), voce:V("e-voce"), importo:VN("e-imp"), qta:VN("e-qta") || 1 });
    save(); render();
  };
  modale(L("Aggiungi un extra"),
    campo("e-voce", L("Che cosa"), "", "text", { ph: L("Assicurazione annullamento") }) +
    '<div class="grid g2" style="gap:11px">' + campo("e-imp", L("Importo a pezzo"), 0, "number", { step:"0.01" }) +
    campo("e-qta", L("Quantità"), pratPax(p), "number") + '</div>',
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Aggiungi")) + '</button>', "slim");
};
ACT.sconto = function(e, el){
  const p = praById(el.dataset.id);
  M_OK = ()=>{ p.sconto = VN("s-imp"); p.scontoNota = V("s-nota"); save(); render(); };
  modale(L("Sconto sulla pratica"),
    campo("s-imp", L("Importo dello sconto"), p.sconto, "number", { step:"0.01" }) +
    campo("s-nota", L("Motivo"), p.scontoNota, "text", { ph: L("cliente abituale") }),
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Salva")) + '</button>', "slim");
};
ACT.promemoria = function(e, el){
  const p = praById(el.dataset.id), d = depById(p.depId);
  const res = pratResiduo(p, d), scad = pratScadenzaSaldo(p, d);
  const t = L("Buongiorno") + ", " + nomeC(p.clienteId) + ".\n" +
    LN("Le ricordiamo il viaggio {tit} del {data}.", { tit:d.titolo, data:dIT(d.inizio) }) + "\n" +
    (res > 0.5
      ? LN("Risulta un saldo di {imp} da versare entro il {scad}.", { imp:eur(res), scad:dIT(scad) }) + "\n" +
        L("Può pagare in agenzia o con bonifico") + ": " + DB.meta.agenzia.iban + "\n"
      : L("La pratica risulta saldata. Grazie!") + "\n") +
    (d.partenzaDa ? L("Ritrovo") + ": " + d.partenzaDa + "\n" : "") +
    DB.meta.agenzia.nome + " — " + DB.meta.agenzia.tel;
  modale(L("Messaggio per il cliente"),
    '<textarea id="msg" rows="10">' + esc(t) + '</textarea>',
    '<button class="btn" data-act="close">' + esc(L("Chiudi")) + '</button>' +
    '<button class="btn pri" data-act="copia-msg">' + ico("copia") + esc(L("Copia")) + '</button>');
};
ACT["copia-msg"] = ()=>{ copia(V("msg")); chiudi(); };
ACT["testo-promo"] = function(e, el){
  const d = depById(el.dataset.id);
  const t = "✈️ " + d.titolo.toUpperCase() + " " + bandiera(d) + "\n" +
    "📅 " + periodo(d.inizio, d.fine) + " · " + LN("{n} giorni", { n: depGiorni(d) }) + "\n" +
    "💶 " + eur(d.quota) + " " + L("a persona") + (d.supSingola ? " (" + L("supplemento singola") + " " + eur(d.supSingola) + ")" : "") + "\n" +
    (d.mezzo === "bus" ? "🚌 " + L("Bus granturismo") : "✈️ " + L("Volo di linea")) + "\n" +
    "🏨 " + L("hotel, pasti e guide come da programma") + "\n\n" +
    (d.programma||[]).slice(0,4).map(g=> "• " + g.titolo).join("\n") + "\n\n" +
    "🎟 " + LN("Restano {n} posti", { n: depLiberi(d) }) + "\n" +
    "📞 " + DB.meta.agenzia.nome + " — " + DB.meta.agenzia.tel + "\n" + (DB.meta.agenzia.web || "");
  modale(L("Testo per WhatsApp"), '<textarea id="msg" rows="12">' + esc(t) + '</textarea>',
    '<button class="btn" data-act="close">' + esc(L("Chiudi")) + '</button>' +
    '<button class="btn pri" data-act="copia-msg">' + ico("copia") + esc(L("Copia")) + '</button>');
};
ACT["copia-rooming"] = function(e, el){
  const d = depById(el.dataset.id);
  const c = roomingConta(d);
  const t = DB.meta.agenzia.nome + " — " + L("Rooming list") + "\n" + d.titolo + " · " + periodo(d.inizio, d.fine) + "\n\n" +
    Object.keys(c).map(k=> c[k] + " × " + camLab(k)).join("\n") + "\n\n" +
    roomingDi(d).map((x,i)=> (i+1) + ". " + camLab(x.r.tipo) + ": " +
      (x.r.ids||[]).map(id=> cognP(id)).join(" / ")).join("\n") +
    "\n\n" + L("Totale") + ": " + depVenduti(d) + " " + L("persone") + ", " + roomingDi(d).length + " " + L("camere");
  copia(t);
};

/* --- posti in bus --- */
ACT["sel-pax"] = function(e, el){
  SEL_PAX = { praId: el.dataset.id, personId: el.dataset.x };
  render();
};
ACT["annulla-sel"] = ()=>{ SEL_PAX = null; render(); };
ACT.posto = function(e, el){
  const d = depById(el.dataset.id), n = Number(el.dataset.x);
  const occ = postiOccupati(d);
  if(occ[n]){
    const o = occ[n];
    delete o.pra.posti[o.personId];
    save(); render(); return;
  }
  if(!SEL_PAX){ toast(L("Scegli prima una persona nell'elenco"), "err"); return; }
  const pr = praById(SEL_PAX.praId);
  pr.posti = pr.posti || {};
  pr.posti[SEL_PAX.personId] = n;
  SEL_PAX = null; save(); render();
};
ACT["posti-auto"] = function(e, el){
  const d = depById(el.dataset.id);
  const bloc = (d.bus && d.bus.bloccati) || [];
  const occ = postiOccupati(d);
  let s = 1;

function scarica(nome, testo, tipo){
  const b = new Blob([testo], { type: tipo || "application/json;charset=utf-8" });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = u; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 400);
}
ACT.backup = function(){
  scarica("tourista-" + today() + ".json", JSON.stringify(DB, null, 1));
  toast(L("Copia scaricata"), "ok");
};
ACT.ripristina = function(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = ()=>{
    const f = inp.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(!d.meta || !d.partenze) throw new Error("no");
        DB = d; save(); leggiHash(); render(); toast(L("Archivio ripristinato"), "ok");
      }catch(err){ toast(L("Il file non va bene"), "err"); }
    };
    r.readAsText(f);
  };
  inp.click();
};
function csv(righe){
  return righe.map(r=> r.map(c=> '"' + String(c == null ? "" : c).replace(/"/g,'""') + '"').join(";")).join("\n");

<script>
/* ============================================================
   7. L'ENTRATA — ognuno col suo codice
   ============================================================ */
let UTENTE = null;
let PIN = "";
let ULTIMO_TOCCO = Date.now();

const conPin = ()=> DB && DB.staff && DB.staff.some(s=> s.pin);
function bloccato(){ return document.getElementById("lock").classList.contains("on"); }

function blocca(){
  if(!conPin()) return;
  UTENTE = null; PIN = "";
  const l = document.getElementById("lock");
  document.getElementById("lock-logo").innerHTML = ico("chiave");
  document.getElementById("lock-nome").textContent = DB.meta.agenzia.nome || "Urania";
  document.getElementById("lock-sub").textContent = L("Digita il tuo codice per entrare");
  document.getElementById("lock-tasti").innerHTML =
    [1,2,3,4,5,6,7,8,9].map(n=> '<button data-pin="' + n + '">' + n + '</button>').join("") +
    '<button class="fn" data-pin="c">' + esc(L("pulisci")) + '</button>' +
    '<button data-pin="0">0</button>' +
    '<button class="fn" data-pin="x">←</button>';
  const conCodice = DB.staff.filter(s=> s.pin);
  document.getElementById("lock-squadra").innerHTML = conCodice.map(s=>
    '<span>' + esc(s.nome.split(" ")[0]) + '</span>').join("");
  document.getElementById("lock-hint").innerHTML =
    esc(L("Ogni persona dell'agenzia ha il suo codice: così si sa chi ha aperto una pratica e chi ha incassato.")) +
    (DB.meta.demo ? '<div style="margin-top:7px;color:var(--brand);font-weight:650">' +
      esc(L("Agenzia di prova")) + ': ' + conCodice.map(s=> esc(s.nome.split(" ")[0]) + " " + esc(s.pin)).join(" · ") + '</div>' : "");
  pips();
  l.classList.add("on");
}
function pips(){
  document.querySelectorAll("#lock .pips i").forEach((el,i)=> el.classList.toggle("on", i < PIN.length));
}
function tastoPin(v){
  if(v === "c"){ PIN = ""; pips(); return; }
  if(v === "x"){ PIN = PIN.slice(0,-1); pips(); return; }
  if(PIN.length >= 4) return;
  PIN += v; pips();
  if(PIN.length === 4) setTimeout(provaPin, 130);
}
function provaPin(){
  const s = DB.staff.find(x=> String(x.pin) === PIN);
  if(s){
    UTENTE = s;
    DB.meta.ultimoAccesso = new Date().toISOString();
    PIN = ""; pips();
    document.getElementById("lock").classList.remove("on");
    ULTIMO_TOCCO = Date.now();
    render();
    toast(LN("Buon lavoro, {chi}", { chi: s.nome.split(" ")[0] }), "ok");
  } else {
    const l = document.getElementById("lock");
    l.classList.add("err");
    setTimeout(()=>{ l.classList.remove("err"); PIN = ""; pips(); }, 400);
  }
}
document.addEventListener("click", function(e){
  const b = e.target.closest("#lock [data-pin]");
  if(b) tastoPin(b.dataset.pin);
});
document.addEventListener("keydown", function(e){
  if(!bloccato()) return;
  if(/^[0-9]$/.test(e.key)) tastoPin(e.key);
  else if(e.key === "Backspace") tastoPin("x");
  else if(e.key === "Escape") tastoPin("c");
});

/* chi può vedere che cosa */
const SOLO_UFFICIO = ["contabilita","impostazioni","scadenzario","fatture","fattura"];
function puo(view){
  if(!conPin() || !UTENTE) return true;
  if(UTENTE.ruolo === "titolare" || UTENTE.ruolo === "amministrazione") return true;
  if(UTENTE.ruolo === "accompagnatore") return ["cruscotto","agenda","guida","partenze","partenza","passeggeri","passeggero","pratiche","pratica"].indexOf(view) >= 0;
  return SOLO_UFFICIO.indexOf(view) < 0 || view === "scadenzario";
}

/* si richiude da solo dopo venti minuti di silenzio */
["click","keydown","touchstart"].forEach(ev=> document.addEventListener(ev, ()=> ULTIMO_TOCCO = Date.now(), true));
setInterval(function(){
  if(conPin() && !bloccato() && Date.now() - ULTIMO_TOCCO > 20*60*1000) blocca();
}, 30000);

ACT.esci = ()=> blocca();
ACT.pin = function(e, el){
  const s = staById(el.dataset.id);
  M_OK = ()=>{
    const v = String(V("pin-v")).replace(/\D/g,"").slice(0,4);
    if(v && v.length < 4){ toast(L("Il codice è di quattro cifre"), "err"); return; }
    if(v && DB.staff.some(x=> x.id !== s.id && String(x.pin) === v)){ toast(L("Codice già usato da un'altra persona"), "err"); return; }
    s.pin = v; save(); render(); toast(v ? L("Codice impostato") : L("Codice tolto"), "ok");
  };
  modale(LN("Codice di {chi}", { chi:s.nome }),
    campo("pin-v", L("Quattro cifre"), s.pin || "", "text", { ph:"1234", hint: L("lascia vuoto per togliere il codice") }),
    '<button class="btn" data-act="close">' + esc(L("Annulla")) + '</button>' +
    '<button class="btn pri" data-act="ok">' + esc(L("Salva")) + '</button>', "slim");
};
</script>

<script>
/* ============================================================
   10. LAVORARE IN DUE O IN TRE
   Se in ufficio è acceso il server (server.js), ogni computer
   manda quello che ha scritto e prende quello che hanno scritto
   gli altri. Comanda l'orologio del server: l'ultimo che scrive
   una certa pratica è quello che resta.
   Senza server non cambia niente: si lavora come prima.
   ============================================================ */
const SRV_KEY = "tourista_srv";
const OMBRA_KEY = "tourista_ombra";
const ORA_KEY = "tourista_ora";
const COLL = ["staff","fornitori","pacchetti","partenze","persone","clienti","pratiche","richieste","prima","cose","fatture","preventivi"];
const META_MIE = ["lingua","skin","demo"];

const SYNC = { url:"", chiave:"", stato:"locale", ora:0, timer:null, attesa:null, inCorso:false, errore:"", conta:0, ultimoGiro:0 };
let OMBRA = {};

/* --- memoria di quello che il server ha già --- */
function impronta(o){
  const s = JSON.stringify(o, (k, v) => k === "_m" ? undefined : v);
  let h = 5381;
  for(let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h;
}
function ombraLeggi(){
  try{ OMBRA = JSON.parse(localStorage.getItem(OMBRA_KEY)) || {}; }catch(e){ OMBRA = {}; }
  COLL.forEach(c => { if(!OMBRA[c]) OMBRA[c] = {}; });
}
function ombraScrivi(){
  try{ localStorage.setItem(OMBRA_KEY, JSON.stringify(OMBRA)); }catch(e){}
}
/* Che cosa è cambiato qui da quando abbiamo parlato col server l'ultima volta */
function daMandare(tutto){
  const fuori = { cambiati:{}, tolti:[] };
  let n = 0;
  /* finché sull'archivio c'è l'agenzia di prova, non si manda niente al server:
     altrimenti il primo computer che si collega riempie l'ufficio di dati finti */
  if(DB.meta.demo && !tutto){ fuori.quante = 0; return fuori; }
  COLL.forEach(c => {
    const dentro = {};
    (DB[c] || []).forEach(r => {
      if(!r || !r.id) return;
      dentro[r.id] = 1;
      const h = impronta(r);
      if(tutto || OMBRA[c][r.id] !== h){
        (fuori.cambiati[c] = fuori.cambiati[c] || []).push(r);
        n++;
      }
    });
    Object.keys(OMBRA[c]).forEach(id => {
      if(!dentro[id]){ fuori.tolti.push({ c:c, id:id }); n++; }
    });
  });
  const m = Object.assign({}, DB.meta);
  META_MIE.forEach(k => delete m[k]);
  if(tutto || impronta(m) !== OMBRA._meta){ fuori.meta = m; n++; }
  fuori.quante = n;
  return fuori;
}
function ombraAggiorna(){
  COLL.forEach(c => {
    const nuovo = {};
    (DB[c] || []).forEach(r => { if(r && r.id) nuovo[r.id] = impronta(r); });
    OMBRA[c] = nuovo;
  });
  const m = Object.assign({}, DB.meta);
  META_MIE.forEach(k => delete m[k]);
  OMBRA._meta = impronta(m);
  ombraScrivi();
}

/* --- quello che arriva dal server entra nell'archivio --- */
function applica(risposta){
  let toccato = 0;
  COLL.forEach(c => {
    const arrivati = (risposta.cambiati && risposta.cambiati[c]) || [];
    if(!arrivati.length) return;
    if(!DB[c]) DB[c] = [];
    const idx = new Map(DB[c].map((r, i) => [r.id, i]));
    arrivati.forEach(rec => {
      const i = idx.get(rec.id);
      if(i === undefined){ DB[c].push(rec); idx.set(rec.id, DB[c].length - 1); }
      else DB[c][i] = rec;
      toccato++;
    });
  });
  (risposta.tolti || []).forEach(t => {
    if(!DB[t.c]) return;
    const i = DB[t.c].findIndex(r => r.id === t.id);
    if(i >= 0){ DB[t.c].splice(i, 1); toccato++; }
  });
  if(risposta.meta){
    const mie = {};
    META_MIE.forEach(k => mie[k] = DB.meta[k]);
    DB.meta = Object.assign({}, DB.meta, risposta.meta, mie);
    toccato++;
  }
  return toccato;
}

/* --- il collegamento --- */
function srvLeggi(){
  try{
    const d = JSON.parse(localStorage.getItem(SRV_KEY)) || {};
    SYNC.url = d.url || ""; SYNC.chiave = d.chiave || "";
  }catch(e){}
  try{ SYNC.ora = Number(localStorage.getItem(ORA_KEY)) || 0; }catch(e){}
}
function srvScrivi(){
  try{
    if(SYNC.url) localStorage.setItem(SRV_KEY, JSON.stringify({ url:SYNC.url, chiave:SYNC.chiave }));
    else localStorage.removeItem(SRV_KEY);
    localStorage.setItem(ORA_KEY, String(SYNC.ora));
  }catch(e){}
}
function chiama(via, dati){
  const capo = { "Content-Type":"application/json" };
  if(SYNC.chiave) capo["x-chiave"] = SYNC.chiave;
  const ctrl = new AbortController();
  const stop = setTimeout(() => ctrl.abort(), 12000);
  return fetch(SYNC.url.replace(/\/+$/,"") + via, {
    method: dati ? "POST" : "GET",
    headers: capo,
    body: dati ? JSON.stringify(dati) : undefined,
    signal: ctrl.signal
  }).then(r => {
    clearTimeout(stop);
    if(r.status === 401) throw new Error(L("Parola d'ordine sbagliata"));
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}
function statoSync(s, errore){
  SYNC.stato = s; SYNC.errore = errore || "";
  const el = document.getElementById("sync-stato");
  if(!el) return;
  const colori = { rete:"var(--green)", locale:"var(--txt-3)", muto:"var(--red)", parla:"var(--brand)" };
  const scritte = { rete:L("in rete"), locale:L("solo qui"), muto:L("server spento"), parla:L("sto parlando…") };
  el.innerHTML = '<span class="dot" style="background:' + (colori[s] || colori.locale) + '"></span>' +
    '<span>' + esc(scritte[s] || s) + '</span>';
  el.title = errore || (s === "rete" ? SYNC.url : "");
}

/* --- il giro: manda quello che c'è di nuovo e prendi il resto --- */
function sincronizza(tutto){
  if(!SYNC.url || SYNC.inCorso) return Promise.resolve(0);
  const fuori = daMandare(tutto);
  fuori.da = SYNC.ora;
  SYNC.inCorso = true;
  SYNC.ultimoGiro = Date.now();
  if(fuori.quante) statoSync("parla");
  return chiama("/api/push", fuori).then(r => {
    SYNC.inCorso = false;
    const entrati = applica(r);
    SYNC.ora = r.ora || Date.now();
    ombraAggiorna();
    srvScrivi();
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
    statoSync("rete");
    if(entrati && !document.getElementById("modal").classList.contains("on")) render();
    else if(entrati) statoSync("rete");
    return entrati;
  }).catch(e => {
    SYNC.inCorso = false;
    statoSync("muto", e.message);
    return 0;
  });
}
function syncPush(){
  if(!SYNC.url) return;
  clearTimeout(SYNC.attesa);
  SYNC.attesa = setTimeout(() => sincronizza(false), 700);
}
function syncGiro(){
  clearInterval(SYNC.timer);
  if(!SYNC.url) return;
  /* quando la finestra è davanti si guarda ogni quattro secondi e mezzo,
     quando è dietro ogni mezzo minuto: non serve consumare batteria per niente */
  const passo = () => {
    const ora = Date.now();
    const attesa = document.visibilityState === "visible" ? 4500 : 30000;
    if(ora - SYNC.ultimoGiro < attesa) return;
    SYNC.ultimoGiro = ora;
    sincronizza(false);
  };
  SYNC.timer = setInterval(passo, 2000);
}
/* Sul computer nuovo: butta l'agenzia di prova e prendi l'archivio vero dal server. */
function prendiDalServer(){
  const lingua = DB.meta.lingua, skin = DB.meta.skin;
  DB = { meta: Object.assign({}, DB.meta), _del: [] };
  COLL.forEach(c => DB[c] = []);
  if(lingua) DB.meta.lingua = lingua;
  if(skin) DB.meta.skin = skin;
  DB.meta.demo = false;   /* da adesso questo computer lavora sull'archivio vero dell'ufficio */
  ombraAggiorna();
  SYNC.ora = 0;
  srvScrivi();
}

function syncCollega(url, chiave){
  SYNC.url = String(url || "").trim().replace(/\/+$/,"");
  SYNC.chiave = String(chiave || "").trim();
  if(!SYNC.url){ SYNC.ora = 0; srvScrivi(); statoSync("locale"); syncGiro(); return Promise.resolve(false); }
  if(!/^https?:\/\//.test(SYNC.url)) SYNC.url = "http://" + SYNC.url;
  return chiama("/api/ping").then(r => {
    if(!r || r.app !== "tourista") throw new Error(L("Non è un server di Tourista"));
    SYNC.conta = r.conta ? Object.keys(r.conta).reduce((a,k) => a + r.conta[k], 0) : 0;
    if(SYNC.conta > 0 && DB.meta.demo) prendiDalServer();
    srvScrivi();
    statoSync("rete");
    syncGiro();
    return sincronizza(false).then(() => true);
  }).catch(e => {
    statoSync("muto", e.message);
    throw e;
  });
}
function syncAvvia(){
  ombraLeggi();
  srvLeggi();
  if(SYNC.url){ statoSync("parla"); syncCollega(SYNC.url, SYNC.chiave).catch(()=>{}); return; }
  statoSync("locale");
  /* se il programma è stato aperto dall'indirizzo del server, si collega da solo */
  if(location.protocol.indexOf("http") === 0){
    const mio = location.origin;
    fetch(mio + "/api/ping").then(r => r.ok ? r.json() : null).then(r => {
      if(r && r.app === "tourista"){
        SYNC.url = mio;
        const quanti = r.conta ? Object.keys(r.conta).reduce((a,k) => a + r.conta[k], 0) : 0;
        if(quanti > 0 && DB.meta.demo) prendiDalServer();
        srvScrivi();
        statoSync("rete"); syncGiro(); sincronizza(false);
        toast(L("Collegato al server dell'ufficio"), "ok");
      }
    }).catch(()=>{});
  }
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && SYNC.url) sincronizza(false);
});
